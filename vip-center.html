const $=id=>document.getElementById(id);let client=null,user=null,state=null,selected=1,busy=false;

function safe(v){if(!v)return '';try{const u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}

async function refresh(initial=false){if(busy)return;busy=true;$('refresh').disabled=true;try{if(!client)throw Error('Supabase library failed to load.');const {data,error}=await client.auth.getUser();if(error)throw error;user=data.user;state=null;if(!user){$('notice').textContent='Log in on this same website. Previews remain available.';render();return}const result=await client.rpc('voxa_vip_state');if(result.error)throw result.error;state=result.data;$('notice').textContent=state.account?'':'No authoritative VIP account yet. Existing profiles require reviewed backend migration; no demo EXP is assigned.';render();if(initial)choose(Math.max(1,actual()));}catch(e){state=null;$('notice').textContent=e.message+' · Apply reviewed SQL setup; previews remain available.';render()}finally{busy=false;$('refresh').disabled=false}}
