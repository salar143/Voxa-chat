<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoxaChat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:20px}.box{width:100%;max-width:360px;text-align:center}h1{color:#a855f7}input,select,textarea{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:0;background:#1f1f1f;color:#fff;box-sizing:border-box}button{width:100%;padding:14px;border:0;border-radius:99px;background:#7c3aed;color:#fff;font-weight:700;margin-top:8px}.login,.g{background:#fff;color:#000}.fb{background:#1877F2}#msg{color:#fca5a5;font-size:13px}</style>
</head><body><div class="box">
<h1>VOXA CHAT</h1>
<button class="g" id="bG">Continue with Google</button>
<button class="fb" id="bF">Continue with Facebook</button>
<p style="color:#666">OR</p>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<input id="nickname" placeholder="Nickname *">
<input id="photo" type="file" accept="image/*">
<select id="gender"><option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select>
<input id="dob" type="date">
<textarea id="bio" placeholder="Bio *"></textarea>
<button id="bC">Create New ID</button>
<button class="login" id="bL">Login</button>
<p id="msg"></p>
</div>
<script>
const sb = supabase.createClient("https://mbjlcbygwpqbovmtzacbrtz.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibGNieWdwcWJvZ210emFjYnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDg0OTIsImV4cCI6MjEwODE4NDQ5Mn0.7OpmnIoZKgGLTCj2gPZtNiZyXkgYPgrdyocbCkG6-Cg");
document.getElementById('bG').onclick = ()=> sb.auth.signInWithOAuth({provider:'google'});
document.getElementById('bF').onclick = ()=> sb.auth.signInWithOAuth({provider:'facebook'});
document.getElementById('bC').onclick = async ()=>{
let e=document.getElementById('email').value, p=document.getElementById('pass').value, nick=document.getElementById('nickname').value, g=document.getElementById('gender').value, d=document.getElementById('dob').value, b=document.getElementById('bio').value, f=document.getElementById('photo').files[0];
if(!e||!p||!nick||!f||!g||!d||!b){document.getElementById('msg').innerText="Sab bharo bhai";return;}
document.getElementById('msg').innerText="Bann raha hai...";
let r = await sb.auth.signUp({email:e,password:p});
if(r.error){document.getElementById('msg').innerText=r.error.message;return;}
let uid=r.data.user.id;
await sb.storage.from('avatars').upload(uid+'.jpg',f,{upsert:true});
let url=sb.storage.from('avatars').getPublicUrl(uid+'.jpg').data.publicUrl;
let db = await sb.from('profiles').insert({id:uid,nickname:nick,profile_photo:url,gender:g,dob:d,bio:b});
if(db.error){document.getElementById('msg').innerText=db.error.message;return;}
document.getElementById('msg').innerText="ID Ban Gayi! Ab Login Dabao";
};
document.getElementById('bL').onclick = async ()=>{let r=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});if(r.error)document.getElementById('msg').innerText=r.error.message;else location.href='home.html'};
</script></body></html>
