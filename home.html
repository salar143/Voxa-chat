<!doctype html>
<html>
<head>
<meta charset="utf-8">

<title>VoxaChat Home</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;padding-bottom:80px}
.top{display:flex;gap:14px;padding:14px 16px;align-items:center;color:#888}
.top b{color:#fff;border-bottom:3px solid #8b5cf6;padding-bottom:4px}

.card{flex:1;border-radius:16px;padding:16px 6px;text-align:center;font-weight:800}
.r{background:#1f1a1a;color:#f59e0b}.g{background:#6d28d9}.f{background:#0369a1}
.pills{display:flex;gap:8px;padding:14px 16px;overflow:auto}
.pill{background:#1e1e1e;padding:9px 16px;border-radius:99px;white-space:nowrap;color:#aaa}
h3{padding:0 16px}
.users{display:flex;gap:14px;padding:0 16px;overflow:auto}
.u{text-align:center;font-size:13px}
.u img{width:70px;height:70px;border-radius:50%;border:3px solid #7c3aed;object-fit:cover}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:12px 0;text-align:center;font-size:12px;color:#888}
</style>
</head>
