
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxaChat Profile</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui}
header{padding:18px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #222}
header button{background:#222;color:white;border:0;border-radius:10px;padding:9px 13px}
main{max-width:480px;margin:auto;padding:24px 18px;text-align:center}
.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #8b5cf6}
h2{margin-bottom:5px}
.muted{color:#999;font-size:14px}
form{text-align:left;margin-top:28px}
label{display:block;margin:15px 0 7px;color:#bbb}
input,textarea{width:100%;padding:13px;background:#171717;border:1px solid #333;border-radius:10px;color:white;font:inherit}
textarea{resize:vertical;min-height:90px}
.save{margin-top:20px;width:100%;padding:14px;background:#7c3aed;color:white;border:0;border-radius:12px;font-weight:bold;font-size:16px}
#status{font-size:14px;color:#c4b5fd}
</style>
</head>
<body>
<header>
<button onclick="location.href='home.html'">← Back</button>
<strong>My Profile</strong>
</header>
<main>
<img class="avatar" id="avatar" src="https://i.pravatar.cc/200?img=12" alt="Profile photo">
<h2 id="heading">My Profile</h2>
<div class="muted" id="email">Voxa Chat member</div>

<form id="profileForm">
<label for="displayName">Display name</label>
<input id="displayName" maxlength="40" placeholder="Your name">

<label for="username">Username</label>
<input id="username" maxlength="24" placeholder="your_username">

<label for="bio">Bio</label>
<textarea id="bio" maxlength="160" placeholder="Tell people about yourself"></textarea>

<label for="avatarUrl">Profile image URL</label>
<input id="avatarUrl" type="url" placeholder="https://example.com/photo.jpg">

<button class="save" type="submit">Save Profile</button>
<p id="status" role="status"></p>
</form>
</main>

<script>
document.getElementById('avatarUrl').addEventListener('input', function(){
  if(this.value.trim()) {
    document.getElementById('avatar').src = this.value.trim();
  }
});

document.getElementById('profileForm').addEventListener('submit', function(e){
  e.preventDefault();
  document.getElementById('heading').textContent =
    document.getElementById('displayName').value.trim() || 'My Profile';
  document.getElementById('status').textContent =
    'Preview updated. Database saving abhi connect nahi hai.';
});
</script>
</body>
</html>
