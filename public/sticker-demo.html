<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Emojis - Fully Working</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0f;
            background-image: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        .header {
            padding: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Seats Area */
        .room-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            justify-items: center;
            align-content: start;
            margin-top: 20px;
        }

        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Avatar Circle */
        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #222;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar-circle.has-effect {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            background: #333;
        }

        .user-icon {
            font-size: 45px;
            color: #555;
            transition: opacity 0.3s;
        }

        /* The Cropped Emoji Image Layer */
        .seat-emoji-container {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            /* Background image position set karne ke liye */
            background-image: url('https://i.ibb.co/3k2G5V0/emoji-sheet.jpg'); /* Fallback */
            background-size: 300% 200%; /* Image me 3 columns aur 2 rows hain */
            background-repeat: no-repeat;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.9));
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
        }

        /* Jab emoji show hoga */
        .seat-emoji-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .seat-name {
            margin-top: 12px;
            font-size: 14px;
            color: #ddd;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 12px;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-top: 1px solid #333;
            padding-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .emoji-list {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Niche ke Emoji Buttons (Image Cropping) */
        .select-btn {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 50%;
            border: 2px solid #444;
            /* Same image use kar rahe hain buttons ke liye */
            background-image: url('https://i.ibb.co/3k2G5V0/emoji-sheet.jpg');
            background-size: 300% 200%;
            background-repeat: no-repeat;
        }

        .select-btn:active {
            transform: scale(0.8);
        }

        /* Alag-alag emojis ke liye image ka position set karna */
        .btn-kiss { background-position: 0% 0%; }      /* Top Left */
        .btn-shy { background-position: 50% 0%; }      /* Top Middle */
        .btn-cool { background-position: 100% 0%; }    /* Top Right */
        .btn-sleep { background-position: 0% 100%; }   /* Bottom Left */
        .btn-laugh { background-position: 50% 100%; }  /* Bottom Middle */

        .clear-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 15px auto 0;
            display: block;
            font-weight: bold;
            cursor: pointer;
        }

        /* Flying Heart Animation */
        @keyframes flyHeart {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(-40px, -80px) scale(1.5); opacity: 0; }
        }

        .flying-heart {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            z-index: 20;
            animation: flyHeart 1s ease-out forwards;
        }

    </style>
</head>
<body>

    <div class="header">Tap Emojis For Magic Effect</div>

    <div class="room-grid">
        <div class="seat">
            <div class="avatar-circle" id="seat1">
                <span class="user-icon" id="icon1">👤</span>
                <!-- Yahan image crop hokar aayegi -->
                <div class="seat-emoji-container" id="emoji1"></div>
            </div>
            <div class="seat-name">Owner</div>
        </div>

        <div class="seat">
            <div class="avatar-circle"><span class="user-icon">👤</span></div>
            <div class="seat-name">No.2</div>
        </div>

        <div class="seat">
            <div class="avatar-circle" style="background: rgba(0,0,0,0.6);"><span class="user-icon">🔒</span></div>
            <div class="seat-name">No.3</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-title">Select 3D Emoji</div>
        <div class="emoji-list">
            <!-- Buttons jisme background position se image crop ho rahi hai -->
            <div class="select-btn btn-kiss" onclick="applyEmoji('btn-kiss', true)"></div>
            <div class="select-btn btn-shy" onclick="applyEmoji('btn-shy', false)"></div>
            <div class="select-btn btn-cool" onclick="applyEmoji('btn-cool', false)"></div>
            <div class="select-btn btn-sleep" onclick="applyEmoji('btn-sleep', false)"></div>
            <div class="select-btn btn-laugh" onclick="applyEmoji('btn-laugh', false)"></div>
        </div>
        <button class="clear-btn" onclick="clearEmoji()">Remove Effect</button>
    </div>

    <script>
        const seat1Avatar = document.getElementById('seat1');
        const seat1EmojiDiv = document.getElementById('emoji1');
        const seat1NormalIcon = document.getElementById('icon1');

        // Background positions jo CSS classes me set hain
        const positions = {
            'btn-kiss': '0% 0%',
            'btn-shy': '50% 0%',
            'btn-cool': '100% 0%',
            'btn-sleep': '0% 100%',
            'btn-laugh': '50% 100%'
        };

        function applyEmoji(btnClass, isKiss) {
            // Emoji ke container ka background position set karo
            seat1EmojiDiv.style.backgroundPosition = positions[btnClass];
            
            setTimeout(() => {
                seat1EmojiDiv.classList.add('show');
                seat1Avatar.classList.add('has-effect');
                seat1NormalIcon.style.opacity = '0'; 

                // Agar Kiss wala emoji select kiya hai, to dil udaao
                if (isKiss) {
                    createFlyingHeart(seat1Avatar);
                }

            }, 50);
        }

        // Flying Heart banane ka function
        function createFlyingHeart(parentElement) {
            const heart = document.createElement('div');
            heart.classList.add('flying-heart');
            heart.innerHTML = '❤️'; 
            
            // Heart ko avatar ke paas position karo (hontho ke paas)
            heart.style.left = '70px';
            heart.style.top = '25px';
            
            parentElement.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        }

        function clearEmoji() {
            seat1EmojiDiv.classList.remove('show');
            seat1Avatar.classList.remove('has-effect');
            seat1NormalIcon.style.opacity = '1';
        }
    </script>
</body>
</html>
