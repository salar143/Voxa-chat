<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Animated Emojis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #0f172a, #000000);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        .header {
            padding: 15px 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }

        /* Seats Area */
        .room-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            justify-items: center;
            align-content: start;
            margin-top: 20px;
        }

        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .avatar-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #222;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar-circle.has-effect {
            border-color: #ffcc00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            background: #333;
        }

        .user-icon {
            font-size: 45px;
            color: #555;
            transition: opacity 0.3s;
        }

        /* Live GIF Emoji Layer */
        .seat-emoji {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 125px;
            height: 125px;
            object-fit: contain;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.9));
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
        }

        .seat-emoji.show {
            opacity: 1;
            transform: scale(1);
        }

        .seat-name {
            margin-top: 12px;
            font-size: 14px;
            color: #ddd;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 12px;
        }

        /* Control Panel (Niche ke buttons) */
        .control-panel {
            background: #111;
            padding: 15px;
            border-top: 1px solid #333;
            padding-bottom: 25px;
        }

        .panel-title {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .emoji-list {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Emoji Buttons (Jo niche hain) */
        .select-btn {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            padding: 5px;
        }

        .select-btn:active {
            transform: scale(0.8);
            background: rgba(255,255,255,0.3);
        }

        .clear-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 15px auto 0;
            display: block;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">Tap on Emoji to see Live Animation</div>

    <!-- Seats Area -->
    <div class="room-grid">
        
        <!-- Seat No. 1 -->
        <div class="seat">
            <div class="avatar-circle" id="seat1">
                <span class="user-icon" id="icon1">👤</span>
                <!-- Yahan GIF load hoga -->
                <img src="" class="seat-emoji" id="emoji1" alt="Emoji">
            </div>
            <div class="seat-name">Owner</div>
        </div>

        <div class="seat">
            <div class="avatar-circle"><span class="user-icon">👤</span></div>
            <div class="seat-name">No.2</div>
        </div>

        <div class="seat">
            <div class="avatar-circle" style="background: rgba(0,0,0,0.6);"><span class="user-icon">🔒</span></div>
            <div class="seat-name">No.3</div>
        </div>
    </div>

    <!-- Bottom Control Panel -->
    <div class="control-panel">
        <div class="panel-title">Niche se emoji par tap karein (Live GIF)</div>
        <div class="emoji-list">
            
            <!-- Kissing Emoji (Flying kiss GIF) -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f618/512.gif" 
                 class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- Thinking Emoji (Head scratch GIF) -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f914/512.gif" 
                 class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- Heart Eyes (Love GIF) -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60d/512.gif" 
                 class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- Crying Emoji -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f62d/512.gif" 
                 class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- Angry Emoji (Gussa) -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f621/512.gif" 
                 class="select-btn" onclick="applyEmoji(this.src)">
                 
        </div>
        <button class="clear-btn" onclick="clearEmoji()">Remove Effect</button>
    </div>

    <script>
        const seat1Avatar = document.getElementById('seat1');
        const seat1EmojiImg = document.getElementById('emoji1');
        const seat1NormalIcon = document.getElementById('icon1');

        function applyEmoji(imageSource) {
            // 1. Emoji ka naya GIF source set karo
            seat1EmojiImg.src = imageSource;
            
            // 2. Thoda delay dekar Animation trigger karo
            setTimeout(() => {
                seat1EmojiImg.classList.add('show');
                seat1Avatar.classList.add('has-effect');
                
                // Piche wala normal user icon hide karo
                seat1NormalIcon.style.opacity = '0'; 
            }, 50);
        }

        function clearEmoji() {
            // Animation hatao
            seat1EmojiImg.classList.remove('show');
            seat1Avatar.classList.remove('has-effect');
            
            // Normal icon wapas dikhao
            seat1NormalIcon.style.opacity = '1';

            // Thodi der baad GIF source clear kar do taaki memory free ho
            setTimeout(() => {
                seat1EmojiImg.src = "";
            }, 400);
        }
    </script>
</body>
</html>
