
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxaChat Emoji Panel</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080b20;color:white;
  font-family:Arial,sans-serif;padding:15px;
}
.app{
  max-width:480px;margin:auto;padding:18px 10px;
  background:linear-gradient(145deg,#24103e,#07162d);
  border:2px solid #a56bff;border-radius:22px;
  box-shadow:0 0 20px #974cff66;
}
h2{text-align:center;color:#e6c5ff}
#toggle{
  display:block;margin:15px auto;padding:13px 25px;
  background:#21123f;color:white;border:1px solid #d9a0ff;
  border-radius:50px;font-size:25px;cursor:pointer;
}
#panel{display:none}
#panel.open{display:block}
.tier{
  --glow:#42ffac;position:relative;
  border:1px solid var(--glow);border-radius:16px;
  padding:23px 7px 10px;margin:25px 8px;
  box-shadow:0 0 12px #a56bff22;
}
.vip2{--glow:#ffd052}
.vip6{--glow:#df70ff}
.tier h3{
  position:absolute;top:-13px;left:50%;
  transform:translateX(-50%);white-space:nowrap;
  margin:0;padding:5px 10px;font-size:12px;
  border:1px solid var(--glow);border-radius:20px;
  background:#0b0c20;color:var(--glow);
}
.grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
}
.emoji{
  aspect-ratio:1;border:1px solid #71649f;
  border-radius:12px;background:#17172f;
  display:grid;place-items:center;
  font-size:clamp(25px,7vw,38px);cursor:pointer;
}
.emoji:active{transform:scale(.9)}
.arrows{display:flex;justify-content:space-between;margin-top:9px}
.arrows button{
  color:white;background:#21143f;border:1px solid #b88aff;
  border-radius:20px;padding:5px 15px;font-size:18px;
}
.custom{
  padding:12px;border:1px solid #7963a0;border-radius:12px;
  font-size:13px;
}
label{display:flex;justify-content:space-between;margin:10px 0}
select{background:#17132c;color:white;padding:5px;border:1px solid #a56bff;border-radius:7px}
#avatar{
  position:relative;margin:35px auto 15px;
  width:90px;height:90px;border:1px solid #b9a0d8;
  border-radius:50%;display:grid;place-items:center;
  background:#111a30;font-size:35px;
}
.reaction{
  position:absolute;top:-35px;left:50%;
  font-size:45px;white-space:nowrap;
  pointer-events:none;transform:translateX(-50%);
}
.bounce{animation:bounce 1.8s ease-out forwards}
.float{animation:float 2s ease-out forwards}
.pulse{animation:pulse 1.8s ease-out forwards}
@keyframes bounce{
  0%{opacity:0;transform:translate(-50%,20px) scale(.2)}
  25%{opacity:1;transform:translate(-50%,-5px) scale(1.3)}
  55%{transform:translate(-50%,-20px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-80px) scale(.8)}
}
@keyframes float{
  0%{opacity:0;transform:translate(-50%,20px)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-100px)}
}
@keyframes pulse{
  0%{opacity:0;transform:translate(-50%,0) scale(.2)}
  30%{opacity:1;transform:translate(-50%,-10px) scale(1.4)}
  100%{opacity:0;transform:translate(-50%,-65px) scale(1)}
}
</style>
</head>
<body>
<div class="app">
<h2>✨ EMOJI COLLECTION ✨</h2>

<button id="toggle" aria-expanded="false">😊</button>

<div id="panel">
<section class="tier" data-tier="free">
<h3>💚 FREE EMOJIS (15)</h3>
<div class="grid" id="free"></div>
<div class="arrows">
<button data-move="-1">◀</button>
<button data-move="1">▶</button>
</div>
</section>

<section class="tier vip2" data-tier="vip2">
<h3>👑 VIP 2+ (5)</h3>
<div class="grid" id="vip2"></div>
<div class="arrows">
<button data-move="-1">◀</button>
<button data-move="1">▶</button>
</div>
</section>

<section class="tier vip6" data-tier="vip6">
<h3>💎 VIP 6+ (5)</h3>
<div class="grid" id="vip6"></div>
<div class="arrows">
<button data-move="-1">◀</button>
<button data-move="1">▶</button>
</div>
</section>

<div class="custom">
<b>🎨 Customize Animation</b>
<label>Animation
<select id="animation">
<option value="bounce">Bouncy</option>
<option value="float">Floating</option>
<option value="pulse">Pulse</option>
</select>
</label>
<label>Effect
<select id="effect">
<option value="✨">✨ Sparkles</option>
<option value="💗">💗 Hearts</option>
<option value="">No effect</option>
</select>
</label>
</div>
</div>

<div id="avatar">🙂</div>
<p style="text-align:center;font-size:12px;color:#c8b9e4">
Tap an emoji to preview its animation
</p>
</div>

<script>
const emojis={
 free:["😘","😉","🥰","😂","😎","😍","💞","😴","😜","😡","🥹","😤","🎧","😊","😭"],
 vip2:["💋","😍","🫶","🥳","😏"],
 vip6:["💖","💘","👑","✨","😘"]
};

const toggle=document.getElementById("toggle");
const panel=document.getElementById("panel");

toggle.onclick=()=>{
 panel.classList.toggle("open");
 toggle.setAttribute("aria-expanded",panel.classList.contains("open"));
};

function render(key){
 const grid=document.getElementById(key);
 grid.replaceChildren();

 emojis[key].forEach(emoji=>{
  const btn=document.createElement("button");
  btn.className="emoji";
  btn.textContent=emoji;
  btn.setAttribute("aria-label","Preview "+emoji);
  btn.onclick=()=>showReaction(emoji);
  grid.appendChild(btn);
 });
}

function showReaction(emoji){
 const avatar=document.getElementById("avatar");
 avatar.querySelector(".reaction")?.remove();

 const reaction=document.createElement("span");
 reaction.className="reaction "+document.getElementById("animation").value;
 reaction.textContent=emoji+document.getElementById("effect").value;
 avatar.appendChild(reaction);

 setTimeout(()=>reaction.remove(),2200);
}

document.querySelectorAll(".tier").forEach(section=>{
 const key=section.dataset.tier;
 section.querySelectorAll("[data-move]").forEach(btn=>{
  btn.onclick=()=>{
   const list=emojis[key];
   if(Number(btn.dataset.move)>0)list.push(list.shift());
   else list.unshift(list.pop());
   render(key);
  };
 });
});

Object.keys(emojis).forEach(render);
</script>
</body>
</html>
