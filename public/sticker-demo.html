<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VC App - Unique VIP Emojis</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}

.header{padding:10px 15px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.8);border-bottom:1px solid #222}
.user-stats{display:flex;gap:10px;align-items:center}
.stat-box{background:#222;padding:4px 10px;border-radius:15px;font-weight:bold;font-size:12px;border:1px solid #444}
.exp-box{color:#28a745;border-color:#28a745}
.diamond-box{color:#00e5ff;border-color:#00e5ff}
.btn-recharge{background:linear-gradient(45deg,#00e5ff,#007bff);border:none;padding:5px 10px;border-radius:15px;color:#fff;cursor:pointer;font-weight:bold;font-size:11px}

.room-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:15px;justify-items:center;align-content:start;margin-top:10px}
.seat{display:flex;flex-direction:column;align-items:center;position:relative}
.avatar-circle{width:85px;height:85px;border-radius:50%;background:#1e1e2a;border:2px solid rgba(255,255,255,.2);display:flex;justify-content:center;align-items:center;position:relative;transition:.3s}
.avatar-circle.has-effect{border-color:#fc0;box-shadow:0 0 25px rgba(255,204,0,.6)}
.user-icon{font-size:45px;color:#555;transition:opacity .3s}
.seat-emoji{position:absolute;top:-20px;left:-20px;width:125px;height:125px;object-fit:contain;filter:drop-shadow(0 15px 20px rgba(0,0,0,.9));opacity:0;transform:scale(.3);transition:all .4s cubic-bezier(.175,.885,.32,1.275);pointer-events:none;z-index:10}
.seat-emoji.show{opacity:1;transform:scale(1)}
.seat-emoji.mirror{transform:scaleX(-1) scale(.3)}
.seat-emoji.mirror.show{transform:scaleX(-1) scale(1)}
.seat-name{margin-top:10px;font-size:13px;color:#ddd;background:rgba(0,0,0,.6);padding:3px 12px;border-radius:12px}

.control-panel{background:#111;padding:10px;border-top:1px solid #333;max-height:340px;overflow-y:auto}
.category-title{font-size:13px;font-weight:bold;margin:12px 0 8px 10px;display:flex;justify-content:space-between;align-items:center}
.cat-free{color:#28a745}
.cat-vip2{color:#ffd700}
.cat-vip6{color:#d19aff}
.emoji-list{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:0 10px;margin-bottom:15px}

.select-btn{width:55px;height:55px;cursor:pointer;transition:transform .2s;border-radius:15px;background:rgba(255,255,255,.05);padding:5px;border:1px solid rgba(255,255,255,.1);position:relative;display:flex;justify-content:center;align-items:center}
.select-btn:active{transform:scale(.8)}
.select-btn img{width:100%;height:100%;object-fit:contain}

.vip-locked{position:relative;overflow:hidden;border:1px solid #ffd700;box-shadow:0 0 10px rgba(255,215,0,.3)}
.vip-locked img{filter:blur(2px) brightness(.7);opacity:.8}
.crown-icon{position:absolute;top:-8px;right:-5px;font-size:16px;z-index:6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
.lock-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:20px;z-index:5;text-shadow:0 0 5px #000}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:100;backdrop-filter:blur(5px)}
.modal-box{background:linear-gradient(135deg,#1e1e2a,#0f172a);padding:25px;border-radius:20px;width:85%;max-width:350px;text-align:center;border:2px solid #ffd700;box-shadow:0 0 30px rgba(255,215,0,.4)}
.modal-box h2{color:#ffd700;font-size:20px;margin-bottom:10px}
.modal-box p{color:#ddd;font-size:14px;margin-bottom:20px;line-height:1.5}
.modal-btn{background:linear-gradient(45deg,#ffd700,#ff8c00);color:#000;border:none;padding:12px 20px;border-radius:25px;font-weight:bold;font-size:16px;cursor:pointer;width:100%;margin-bottom:10px}
.modal-close{background:transparent;border:none;color:#888;cursor:pointer;font-size:12px}

.clear-btn{background:#f44;color:#fff;border:none;padding:8px 20px;border-radius:20px;margin:5px auto 10px;display:block;font-weight:bold;cursor:pointer;font-size:14px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#444;border-radius:10px}
</style>
</head>

<body>

<div class="header">
  <div class="user-stats">
    <div class="stat-box exp-box" id="expDisplay">EXP: 0</div>
    <div class="stat-box diamond-box" id="diamondDisplay">💎 0</div>
  </div>
  <button class="btn-recharge" onclick="addExp(1000)">+1000 EXP</button>
</div>

<div class="room-grid">
  <div class="seat">
    <div class="avatar-circle" id="seat1">
      <span class="user-icon" id="icon1">👤</span>
      <img src="" class="seat-emoji" id="emoji1" alt="Emoji">
    </div>
    <div class="seat-name">Owner (You)</div>
  </div>
</div>

<div class="control-panel">

  <div class="category-title cat-free">
    <span>✅ 15 Free Emojis</span>
  </div>

  <div class="emoji-list">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f618/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Kiss">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60d/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Heart eyes">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f914/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Thinking">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f602/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Laugh">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f62d/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Crying">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f621/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Angry">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60e/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Cool">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60a/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Blush">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Thumbs up">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f973/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Party">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f634/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Sleeping">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f92f/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Mind blown">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44f/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Clapping">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f615/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Confused">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f929/512.gif" class="select-btn" onclick="applyEmoji(this.src,false)" alt="Star eyes">
  </div>

  <div class="category-title cat-vip2">
    <span>👑 VIP 2+ Premium 3D (4000 EXP)</span>
    <span id="vip2-status" style="color:#ffd700;font-size:10px">Locked</span>
  </div>

  <div class="emoji-list" id="vip2-list">
    <div class="select-btn vip-locked" onclick="showVipModal(2,this)">
      <img class="mirror-image" src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Face%20blowing%20a%20kiss/3D/face_blowing_a_kiss_3d.png" alt="Kiss">
      <span class="crown-icon">👑</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(2,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Disguised%20face/3D/disguised_face_3d.png" alt="Disguised">
      <span class="crown-icon">👑</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(2,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Nerd%20face/3D/nerd_face_3d.png" alt="Nerd">
      <span class="crown-icon">👑</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(2,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Smirking%20face/3D/smirking_face_3d.png" alt="Smirk">
      <span class="crown-icon">👑</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(2,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Star-struck/3D/star-struck_3d.png" alt="Star eyes">
      <span class="crown-icon">👑</span>
      <div class="lock-overlay">🔒</div>
    </div>
  </div>

  <div class="category-title cat-vip6">
    <span>💎 VIP 6+ Exclusive 3D (15000 EXP)</span>
    <span id="vip6-status" style="color:#d19aff;font-size:10px">Locked</span>
  </div>

  <div class="emoji-list" id="vip6-list">
    <div class="select-btn vip-locked" onclick="showVipModal(6,this)">
      <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f528/512.gif" alt="Hammer">
      <span class="crown-icon">💎</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(6,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Prince/3D/prince_3d.png" alt="Prince">
      <span class="crown-icon">💎</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(6,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Money-mouth%20face/3D/money-mouth_face_3d.png" alt="Money">
      <span class="crown-icon">💎</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(6,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Genie/3D/genie_3d.png" alt="Genie">
      <span class="crown-icon">💎</span>
      <div class="lock-overlay">🔒</div>
    </div>

    <div class="select-btn vip-locked" onclick="showVipModal(6,this)">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Lion/3D/lion_3d.png" alt="Lion">
      <span class="crown-icon">💎</span>
      <div class="lock-overlay">🔒</div>
    </div>
  </div>

  <button class="clear-btn" onclick="clearEmoji()">Remove Effect</button>
</div>

<div class="modal-overlay" id="vipModal">
  <div class="modal-box">
    <h2 id="modalTitle">Unlock Premium Emojis</h2>
    <p id="modalDesc"></p>
    <button class="modal-btn" onclick="goToRecharge()">Recharge & Unlock VIP</button>
    <button class="modal-close" onclick="closeModal()">Maybe Later</button>
  </div>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let userData = { diamonds: 0, exp: 0 };

async function initApp(){
  const { data:{ user } } = await supabase.auth.getUser();

  if(user){
    currentUser = user;
    await fetchUserData(user.id);
    return;
  }

  const { data, error } = await supabase.auth.signInAnonymously();

  if(error){
    console.error("Login error:", error.message);
    alert("Login nahi ho paya. Supabase Anonymous Sign-in enable karo.");
    return;
  }

  currentUser = data.user;
  await fetchUserData(currentUser.id);
}

async function fetchUserData(userId){
  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("uid", userId)
    .maybeSingle();

  if(error){
    console.error("Profile error:", error.message);
    return;
  }

  if(data){
    userData = {
      diamonds: data.diamonds || 0,
      exp: data.exp || 0
    };
    updateUI();
  }
}

function updateUI(){
  document.getElementById("diamondDisplay").innerText = `💎 ${userData.diamonds}`;
  document.getElementById("expDisplay").innerText = `EXP: ${userData.exp}`;

  const vip2 = document.getElementById("vip2-status");
  const vip6 = document.getElementById("vip6-status");

  if(userData.exp >= 4000){
    vip2.innerText = "✅ Unlocked";
    vip2.style.color = "#28a745";
    unlockEmojis("vip2-list");
  }else{
    vip2.innerText = `Need ${4000 - userData.exp} EXP`;
  }

  if(userData.exp >= 15000){
    vip6.innerText = "✅ Unlocked";
    vip6.style.color = "#28a745";
    unlockEmojis("vip6-list");
  }else{
    vip6.innerText = `Need ${15000 - userData.exp} EXP`;
  }
}

function unlockEmojis(listId){
  const list = document.getElementById(listId);

  list.querySelectorAll(".vip-locked").forEach(emoji=>{
    emoji.classList.remove("vip-locked");

    const img = emoji.querySelector("img");
    const isMirror = img.classList.contains("mirror-image");

    emoji.onclick = function(){
      applyEmoji(img.src, isMirror);
    };

    const crown = emoji.querySelector(".crown-icon");
    const overlay = emoji.querySelector(".lock-overlay");

    if(crown) crown.remove();
    if(overlay) overlay.remove();

    img.style.filter = "none";
    img.style.opacity = "1";
  });
}

function showVipModal(requiredVip, element){
  const img = element.querySelector("img");
  const isMirror = img.classList.contains("mirror-image");

  if(requiredVip === 2 && userData.exp >= 4000){
    applyEmoji(img.src, isMirror);
    return;
  }

  if(requiredVip === 6 && userData.exp >= 15000){
    applyEmoji(img.src, isMirror);
    return;
  }

  const modal = document.getElementById("vipModal");
  const title = document.getElementById("modalTitle");
  const desc = document.getElementById("modalDesc");

  if(requiredVip === 2){
    title.innerText = "👑 VIP 2+ Premium Emoji";
    desc.innerHTML = `Yeh unique 3D Emoji sirf <b>VIP 2+</b> members ke liye hai.<br><br>Aapke paas abhi <b>${userData.exp} EXP</b> hai. Bas <b>${4000 - userData.exp} EXP</b> aur chahiye VIP 2+ ke liye!`;
  }else{
    title.innerText = "💎 VIP 6+ Exclusive Emoji";
    desc.innerHTML = `Yeh Royal & Attitude wala Emoji sirf <b>VIP 6+</b> members ke liye hai.<br><br>Aapke paas abhi <b>${userData.exp} EXP</b> hai. Bas <b>${15000 - userData.exp} EXP</b> aur chahiye VIP 6+ ke liye!`;
  }

  modal.style.display = "flex";
}

function closeModal(){
  document.getElementById("vipModal").style.display = "none";
}

function goToRecharge(){
  closeModal();
  alert("Recharge page par ja rahe hain...");
}

async function addExp(amount){
  if(!currentUser){
    alert("Pehle login hone do.");
    return;
  }

  const newExp = userData.exp + amount;

  const { error } = await supabase
    .from("profiles")
    .update({ exp: newExp })
    .eq("uid", currentUser.id);

  if(error){
    console.error("EXP update error:", error.message);
    alert("EXP update nahi hua: " + error.message);
    return;
  }

  userData.exp = newExp;
  updateUI();
}

function applyEmoji(imageSource, isMirror){
  const emojiImg = document.getElementById("emoji1");
  const avatar = document.getElementById("seat1");
  const icon = document.getElementById("icon1");

  emojiImg.classList.remove("show", "mirror");

  if(isMirror){
    emojiImg.classList.add("mirror");
  }

  emojiImg.src = imageSource;

  setTimeout(()=>{
    emojiImg.classList.add("show");
    avatar.classList.add("has-effect");
    icon.style.opacity = "0";
  }, 50);
}

function clearEmoji(){
  const emojiImg = document.getElementById("emoji1");
  const avatar = document.getElementById("seat1");
  const icon = document.getElementById("icon1");

  emojiImg.classList.remove("show", "mirror");
  avatar.classList.remove("has-effect");
  icon.style.opacity = "1";

  setTimeout(()=>{
    emojiImg.src = "";
  }, 400);
}

initApp();
</script>

</body>
</html>
