<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxaChat Emoji Preview</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#120e1e;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:460px;
  min-height:100vh;
  margin:auto;
  padding:22px 16px;
  background:
    radial-gradient(at top left,#75465f,transparent 65%),
    #191428;
}

h1{font-size:20px;margin:0 0 10px}

.description,.note{
  font-size:13px;
  line-height:1.6;
  color:#ccbdd5;
}

.stage{
  height:280px;
  position:relative;
  display:grid;
  place-items:center;
}

.seat{
  width:82px;
  height:82px;
  border:2px solid #bea3c0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#ffffff12;
  color:#e0d0e4;
}

.name{
  position:absolute;
  bottom:45px;
  font-size:13px;
}

#reaction{
  position:absolute;
  width:180px;
  height:180px;
  display:grid;
  place-items:center;
  pointer-events:none;
}

#reaction[hidden]{display:none}

.face{
  font-family:
    "Apple Color Emoji",
    "Segoe UI Emoji",
    "Noto Color Emoji",
    sans-serif;
  font-size:90px;
  line-height:1.2;
  filter:drop-shadow(0 6px 8px #0004);
}

.particle{
  position:absolute;
  top:50%;
  left:50%;
  font-size:24px;
  line-height:1;
}

.panel{
  background:#211b35;
  border:1px solid #ffffff20;
  border-radius:20px;
  padding:16px;
}

.heading{font-size:15px;margin-bottom:16px}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
}

.emoji-button{
  padding:10px 2px;
  border:1px solid #ffffff25;
  border-radius:13px;
  background:#372b4b;
  color:white;
  cursor:pointer;
  touch-action:manipulation;
}

.emoji-button .icon{
  display:block;
  font-size:33px;
  margin-bottom:7px;
}

.emoji-button .label{
  display:block;
  font-size:10px;
}

.emoji-button.active{
  border-color:#edb4f5;
  background:#67416c;
}

#status{
  min-height:36px;
  margin:16px 0 8px;
  color:#ecc3e5;
  font-size:13px;
}

.controls{display:flex;gap:10px}

.controls button{
  flex:1;
  padding:12px;
  background:#48315e;
  color:white;
  border:1px solid #ffffff25;
  border-radius:11px;
  cursor:pointer;
}
</style>
</head>

<body>
<main class="app">
  <h1>VoxaChat · Emoji Demo</h1>

  <div class="description">
    Tumhare select kiye hue 10 emojis
  </div>

  <div class="stage">
    <div class="seat">Your DP</div>
    <div id="reaction" hidden aria-hidden="true"></div>
    <div class="name">Sample seat</div>
  </div>

  <section class="panel">
    <div class="heading">Emoji select karo</div>

    <div id="grid" class="grid"></div>

    <div id="status" role="status">
      Kisi emoji par tap karo.
    </div>

    <div class="controls">
      <button type="button" id="replay">Replay</button>
      <button type="button" id="stop">Stop</button>
    </div>
  </section>

  <p class="note">
    Ye independent preview hai. Existing room mein koi change nahi.
    Emoji ka look phone/browser ke hisaab se thoda alag ho sakta hai.
  </p>
</main>

<script>
"use strict";

const items=[
  {emoji:"😒",name:"Unamused",effect:"side"},
  {emoji:"🤗",name:"Hug",effect:"hug"},
  {emoji:"🤔",name:"Thinking",effect:"think"},
  {emoji:"😘",name:"Kiss",effect:"kiss"},
  {emoji:"🥰",name:"Love",effect:"love"},
  {emoji:"🤣",name:"Rolling",effect:"roll"},
  {emoji:"🤭",name:"Giggle",effect:"giggle"},
  {emoji:"😂",name:"Laugh",effect:"laugh"},
  {emoji:"🥹",name:"Touched",effect:"touched"},
  {emoji:"😭",name:"Cry",effect:"cry"}
];

const box=document.getElementById("reaction");
const grid=document.getElementById("grid");
const statusBox=document.getElementById("status");

let animations=[];
let timer=null;
let last=0;

function stop(){
  clearTimeout(timer);

  animations.forEach(animation=>animation.cancel());
  animations=[];

  box.replaceChildren();
  box.hidden=true;

  [...grid.children].forEach(button=>{
    button.classList.remove("active");
  });

  statusBox.textContent="Stopped — emoji select karo.";
}

function animate(element,frames,options){
  animations.push(element.animate(frames,options));
}

function particle(symbol,x,y,endX,endY,delay){
  const p=document.createElement("span");
  p.className="particle";
  p.textContent=symbol;
  box.appendChild(p);

  animate(p,[
    {
      transform:`translate(${x}px,${y}px) scale(.4)`,
      opacity:0
    },
    {
      transform:`translate(${x}px,${y}px) scale(1)`,
      opacity:1,
      offset:.2
    },
    {
      transform:`translate(${endX}px,${endY}px) scale(.7)`,
      opacity:0
    }
  ],{
    duration:1400,
    delay,
    iterations:2,
    easing:"ease-out",
    fill:"both"
  });
}

function play(index){
  stop();
  last=index;

  const item=items[index];
  box.hidden=false;
  grid.children[index].classList.add("active");

  const face=document.createElement("span");
  face.className="face";
  face.textContent=item.emoji;
  box.appendChild(face);

  statusBox.textContent=item.emoji+" "+item.name+" · Playing";

  const reduce=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  if(!reduce){
    const frames={
      side:[
        {transform:"translateX(0)"},
        {transform:"translateX(-9px) rotate(-7deg)"},
        {transform:"translateX(0)"}
      ],
      hug:[
        {transform:"scale(.95)"},
        {transform:"scale(1.15) translateY(-5px)"},
        {transform:"scale(.95)"}
      ],
      think:[
        {transform:"rotate(0deg)"},
        {transform:"rotate(-12deg) translateY(-4px)"},
        {transform:"rotate(0deg)"}
      ],
      kiss:[
        {transform:"scale(1) rotate(0deg)"},
        {transform:"scale(1.1) rotate(-8deg)"},
        {transform:"scale(1) rotate(0deg)"}
      ],
      love:[
        {transform:"scale(.97)"},
        {transform:"scale(1.12)"},
        {transform:"scale(.97)"}
      ],
      roll:[
        {transform:"translateX(-15px) rotate(-22deg)"},
        {transform:"translateX(15px) rotate(22deg)"},
        {transform:"translateX(-15px) rotate(-22deg)"}
      ],
      giggle:[
        {transform:"translateY(0) rotate(-4deg)"},
        {transform:"translateY(-5px) rotate(4deg)"},
        {transform:"translateY(0) rotate(-4deg)"}
      ],
      laugh:[
        {transform:"translateY(0) scaleY(1)"},
        {transform:"translateY(-7px) scaleY(.94)"},
        {transform:"translateY(0) scaleY(1)"}
      ],
      touched:[
        {transform:"scale(1) rotate(-3deg)"},
        {transform:"scale(1.07) rotate(3deg)"},
        {transform:"scale(1) rotate(-3deg)"}
      ],
      cry:[
        {transform:"translateX(-3px)"},
        {transform:"translateX(3px) translateY(2px)"},
        {transform:"translateX(-3px)"}
      ]
    };

    const duration=
      ["laugh","giggle","cry"].includes(item.effect)
        ?450:1200;

    animate(face,frames[item.effect],{
      duration,
      iterations:Infinity,
      easing:"ease-in-out"
    });

    if(["kiss","love","hug","touched"].includes(item.effect)){
      for(let i=0;i<4;i++){
        particle(
          i%2?"💕":"❤️",
          -8,
          0,
          item.effect==="kiss"
            ?-65-i*5
            :(i-1.5)*35,
          -70-i*5,
          i*260
        );
      }
    }

    if(["cry","laugh"].includes(item.effect)){
      for(let i=0;i<4;i++){
        const x=i%2?26:-43;
        particle("💧",x,-5,x+(i%2?8:-8),65,i*240);
      }
    }

    if(item.effect==="think"){
      particle("?",30,-38,43,-78,0);
      particle("?",46,-25,61,-65,500);
    }
  }

  timer=setTimeout(()=>{
    stop();
    statusBox.textContent="Finished — Replay ya doosra emoji tap karo.";
  },4000);
}

items.forEach((item,index)=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="emoji-button";
  button.setAttribute("aria-label",item.name);

  const icon=document.createElement("span");
  icon.className="icon";
  icon.textContent=item.emoji;

  const label=document.createElement("span");
  label.className="label";
  label.textContent=item.name;

  button.append(icon,label);
  button.onclick=()=>play(index);
  grid.appendChild(button);
});

document.getElementById("replay").onclick=()=>play(last);
document.getElementById("stop").onclick=stop;
</script>
</body>
</html>
