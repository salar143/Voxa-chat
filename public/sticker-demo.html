
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxaChat Animated Emojis</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09051b;color:white;
 font-family:Arial,sans-serif;min-height:100vh
}
.room{
 max-width:500px;margin:auto;min-height:100vh;
 padding:20px 12px 100px;
 background:linear-gradient(160deg,#061d3b,#301044,#09051b)
}
.header{
 padding:14px;background:#ffffff10;border-radius:18px;
 font-size:19px;font-weight:bold
}
.sub{font-size:12px;color:#d5c4e8;margin-top:6px}
.seats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:32px 5px;margin-top:45px
}
.seat{text-align:center;font-size:12px;color:#ddd}
.circle{
 position:relative;width:58px;height:58px;
 border:1px solid #c7a6d7;border-radius:50%;
 background:#100d28;display:grid;place-items:center;
 margin:0 auto 8px;font-size:24px
}
.seat:first-child{grid-column:2}
.seat:nth-child(2){grid-column:4}
.reaction{
 position:absolute;left:50%;top:-35px;
 z-index:5;font-size:43px;white-space:nowrap;
 transform:translateX(-50%);
 filter:drop-shadow(0 0 9px #ff70e9);
 pointer-events:none
}
.bounce{animation:bounce 1.8s ease forwards}
.float{animation:float 2s ease forwards}
.pulse{animation:pulse 1.8s ease forwards}
@keyframes bounce{
 0%{opacity:0;transform:translate(-50%,20px) scale(.2)}
 25%{opacity:1;transform:translate(-50%,-10px) scale(1.3)}
 55%{transform:translate(-50%,-20px) scale(1)}
 100%{opacity:0;transform:translate(-50%,-85px) scale(.8)}
}
@keyframes float{
 0%{opacity:0;transform:translate(-50%,15px)}
 20%{opacity:1}
 100%{opacity:0;transform:translate(-50%,-100px) rotate(12deg)}
}
@keyframes pulse{
 0%{opacity:0;transform:translate(-50%,0) scale(.2)}
 30%{opacity:1;transform:translate(-50%,-10px) scale(1.4)}
 100%{opacity:0;transform:translate(-50%,-70px) scale(1)}
}
.bottom{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(500px,100%);height:70px;
 background:#090617f5;display:flex;
 align-items:center;justify-content:space-around
}
.bottom button{
 width:47px;height:47px;border-radius:50%;
 border:1px solid #ffffff22;background:#211434;
 color:white;font-size:24px
}
.panel{
 display:none;position:fixed;z-index:10;
 left:50%;transform:translateX(-50%);
 bottom:80px;width:min(480px,calc(100% - 14px));
 max-height:78vh;overflow:auto;padding:13px 10px;
 border:2px solid #c34bff;border-radius:23px;
 background:radial-gradient(at top,#45115e,#110820 70%);
 box-shadow:0 0 25px #ae35ff99
}
.panel.open{display:block}
.panel h2{
 text-align:center;font-size:19px;
 color:#ffd7ff;text-shadow:0 0 12px #ed4cff
}
.close{
 display:block;margin-left:auto;border:1px solid #ef9aff;
 border-radius:50%;background:#310c48;color:white;
 font-size:20px;width:34px;height:34px
}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tab{
 padding:9px 2px;border:1px solid var(--c);
 border-radius:20px;background:#180b2c;color:white;
 font-size:11px;font-weight:bold
}
.tab[data-tier="free"]{--c:#48ff9a}
.tab[data-tier="vip2"]{--c:#ffd05a}
.tab[data-tier="vip6"]{--c:#e76aff}
.tab.active{background:#49205e;box-shadow:0 0 10px var(--c)}
.page{display:none}
.page.active{display:block}
.grid{
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
 gap:6px;margin-top:14px
}
.emoji{
 aspect-ratio:1;min-width:0;
 border:1px solid #a54cc5;border-radius:12px;
 background:linear-gradient(145deg,#4b2461,#170d2c);
 font-size:clamp(26px,8vw,39px);
 display:grid;place-items:center
}
.emoji:active{transform:scale(.88)}
.pager{
 display:flex;justify-content:space-between;
 align-items:center;margin-top:12px
}
.arrow{
 background:#270d40;color:white;
 border:1px solid #db82ff;border-radius:20px;
 font-size:21px;padding:4px 17px
}
.dots{font-size:12px;color:#e5aaff}
.custom{
 margin-top:14px;padding:11px;
 border:1px solid #8e5ba8;border-radius:12px;
 background:#ffffff08;font-size:13px
}
label{
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;margin-top:10px
}
select{
 max-width:58%;background:#170b29;
 color:white;border:1px solid #a56ec2;
 border-radius:7px;padding:7px
}
.note{text-align:center;font-size:10px;color:#cfb8df}
</style>
</head>
<body>

<main class="room">
 <div class="header">
  💖 VoxaChat Room
  <div class="sub">ID: 10001 · Animated Emoji Demo</div>
 </div>
 <p>Normal · 20 Seats</p>
 <div class="seats" id="seats">
  <div class="seat">
   <div class="circle">⌂</div>Owner
  </div>
  <div class="seat">
   <div class="circle">🔒</div>Super Mic
  </div>
 </div>
 <p style="color:#50eeee;margin-top:45px">
  Tap the smiley to open emojis.
 </p>
</main>

<section class="panel" id="panel">
 <button class="close" id="close">×</button>
 <h2>😘 Animated Emojis 👑</h2>

 <div class="tabs">
  <button class="tab active" data-tier="free">💚 FREE 15</button>
  <button class="tab" data-tier="vip2">👑 VIP 2+</button>
  <button class="tab" data-tier="vip6">💎 VIP 6+</button>
 </div>

 <section class="page active" id="page-free">
  <div class="grid" id="grid-free"></div>
  <div class="pager">
   <button class="arrow" data-dir="-1">◀</button>
   <span class="dots" id="dots-free"></span>
   <button class="arrow" data-dir="1">▶</button>
  </div>
 </section>

 <section class="page" id="page-vip2">
  <div class="grid" id="grid-vip2"></div>
  <div class="pager">
   <button class="arrow" data-dir="-1">◀</button>
   <span class="dots" id="dots-vip2"></span>
   <button class="arrow" data-dir="1">▶</button>
  </div>
 </section>

 <section class="page" id="page-vip6">
  <div class="grid" id="grid-vip6"></div>
  <div class="pager">
   <button class="arrow" data-dir="-1">◀</button>
   <span class="dots" id="dots-vip6"></span>
   <button class="arrow" data-dir="1">▶</button>
  </div>
 </section>

 <div class="custom">
  <b>✨ Customize Animation</b>
  <label>Animation
   <select id="anim">
    <option value="bounce">Bouncy Pop</option>
    <option value="float">Floating</option>
    <option value="pulse">Pulse</option>
   </select>
  </label>
  <label>Extra Effect
   <select id="effect">
    <option value="✨">✨ Sparkles</option>
    <option value="💗">💗 Hearts</option>
    <option value="">None</option>
   </select>
  </label>
 </div>
 <p class="note">Tap emoji to preview above Owner seat.</p>
</section>

<nav class="bottom">
 <button aria-label="Speaker">◖))</button>
 <button aria-label="Microphone">🎙</button>
 <button aria-label="Chat">☷</button>
 <button id="toggle" aria-label="Emoji picker">☻</button>
 <button aria-label="Gifts">🎁</button>
</nav>

<script>
const emojis={
 free:[
  "😘","🥰","😎","😴","😂",
  "😍","🫶","😜","😡","🤫",
  "😭","🤩","😗","🤔","🥹"
 ],
 vip2:["💋","💞","😏","🥳","📣"],
 vip6:["💖","💘","👑","✨","😘"]
};

const tiers=["free","vip2","vip6"];
const pageIndex={free:0,vip2:0,vip6:0};
const panel=document.getElementById("panel");

document.getElementById("toggle").onclick=()=>{
 panel.classList.toggle("open");
};

document.getElementById("close").onclick=()=>{
 panel.classList.remove("open");
};

document.querySelectorAll(".tab").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".tab").forEach(t=>{
   t.classList.toggle("active",t===btn);
  });
  tiers.forEach(t=>{
   document.getElementById("page-"+t)
    .classList.toggle("active",t===btn.dataset.tier);
  });
 };
});

function render(tier){
 const grid=document.getElementById("grid-"+tier);
 grid.replaceChildren();

 for(let i=0;i<5;i++){
  const emoji=emojis[tier][
   (pageIndex[tier]*5+i)%emojis[tier].length
  ];
  const btn=document.createElement("button");
  btn.className="emoji";
  btn.textContent=emoji;
  btn.setAttribute("aria-label","Use "+emoji);
  btn.onclick=()=>react(emoji);
  grid.appendChild(btn);
 }

 const total=Math.ceil(emojis[tier].length/5);
 document.getElementById("dots-"+tier).textContent=
  "● ".repeat(pageIndex[tier]+1)+
  "○ ".repeat(total-pageIndex[tier]-1);
}

document.querySelectorAll(".arrow").forEach(btn=>{
 btn.onclick=()=>{
  const tier=btn.closest(".page").id.replace("page-","");
  const total=Math.ceil(emojis[tier].length/5);
  pageIndex[tier]=(
   pageIndex[tier]+Number(btn.dataset.dir)+total
  )%total;
  render(tier);
 };
});

function react(emoji){
 const seat=document.querySelector(".seat:first-child .circle");
 seat.querySelector(".reaction")?.remove();

 const node=document.createElement("span");
 node.className="reaction "+document.getElementById("anim").value;
 node.textContent=emoji+document.getElementById("effect").value;
 seat.appendChild(node);

 setTimeout(()=>node.remove(),2300);
 panel.classList.remove("open");
}

tiers.forEach(render);

const seats=document.getElementById("seats");
for(let i=2;i<=12;i++){
 const seat=document.createElement("div");
 seat.className="seat";
 seat.innerHTML=
  '<div class="circle">'+(i>=3?"🔒":"🎙")+
  '</div>No.'+i;
 seats.appendChild(seat);
}
</script>
</body>
</html>
