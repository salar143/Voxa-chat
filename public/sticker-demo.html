<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxaChat Custom Reactions</title>

<style>
*{margin:0;box-sizing:border-box}
body{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:linear-gradient(#0f172a,#000);
  color:white;
  font-family:Arial,sans-serif;
}
.header{
  padding:14px;
  text-align:center;
  color:#4ade80;
  background:#0008;
  border-bottom:1px solid #ffffff18;
  font-size:15px;
}
.room-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-content:start;
  justify-items:center;
  gap:12px;
  padding:35px 12px;
}
.seat{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.avatar-circle{
  width:85px;
  height:85px;
  position:relative;
  display:grid;
  place-items:center;
  background:#1e1e2a;
  border:2px solid #ffffff35;
  border-radius:50%;
}
.avatar-circle.has-effect{
  border-color:#ffcf45;
  box-shadow:0 0 24px #ffc40055;
}
.user-icon{font-size:42px}
.has-effect .user-icon{visibility:hidden}
#actor{
  position:absolute;
  width:130px;
  height:140px;
  left:50%;
  top:50%;
  margin-left:-65px;
  margin-top:-70px;
  pointer-events:none;
  z-index:3;
}
#actor svg{width:100%;height:100%;overflow:visible}
[hidden]{display:none!important}
.seat-name{
  margin-top:22px;
  font-size:12px;
  padding:4px 12px;
  background:#0008;
  border-radius:12px;
}
.control-panel{
  flex-shrink:0;
  max-height:45vh;
  overflow:auto;
  padding:14px 12px max(14px,env(safe-area-inset-bottom));
  background:#111;
  border-top:1px solid #333;
}
.panel-title{
  text-align:center;
  color:#aaa;
  font-size:12px;
  margin-bottom:12px;
}
.emoji-list{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
}
.select-btn{
  min-width:0;
  padding:4px 2px 7px;
  border:1px solid #ffffff20;
  border-radius:13px;
  background:#ffffff08;
  color:#ddd;
  cursor:pointer;
  touch-action:manipulation;
}
.select-btn svg{width:100%;height:54px}
.select-btn span{font-size:9px}
.select-btn.active{
  border-color:#ffcf45;
  background:#ffc40015;
}
.clear-btn{
  display:block;
  margin:16px auto 0;
  border:0;
  padding:10px 24px;
  border-radius:20px;
  background:#d43e50;
  color:white;
  cursor:pointer;
}
#status{
  text-align:center;
  min-height:18px;
  margin-top:10px;
  color:#b9afc8;
  font-size:12px;
}
</style>
</head>

<body>
<div class="header">Custom Animated Reactions</div>

<div class="room-grid">
  <div class="seat">
    <div class="avatar-circle" id="seat1">
      <span class="user-icon">👤</span>
      <div id="actor" hidden></div>
    </div>
    <div class="seat-name">Owner</div>
  </div>

  <div class="seat">
    <div class="avatar-circle">
      <span class="user-icon">👤</span>
    </div>
    <div class="seat-name">No.2</div>
  </div>

  <div class="seat">
    <div class="avatar-circle">
      <span class="user-icon">🔒</span>
    </div>
    <div class="seat-name">No.3</div>
  </div>
</div>

<div class="control-panel">
  <div class="panel-title">
    Select a character · Effect stays on Owner's avatar
  </div>
  <div class="emoji-list" id="list"></div>
  <div id="status">Choose a reaction</div>
  <button class="clear-btn" id="clear">Remove Effect</button>
</div>

<script>
"use strict";

const reactions=[
  ["happy","Happy"],
  ["kiss","Kiss"],
  ["cool","Cool"],
  ["laugh","Laugh"],
  ["love","Love"],
  ["think","Think"],
  ["sad","Touched"],
  ["angry","Angry"],
  ["sleep","Sleep"],
  ["wink","Wink"],
  ["king","King"],
  ["angel","Angel"],
  ["shy","Shy"],
  ["cry","Cry"],
  ["game","Gamer"]
];

const actor=document.getElementById("actor");
const seat=document.getElementById("seat1");
const list=document.getElementById("list");
const statusBox=document.getElementById("status");
const reduced=matchMedia("(prefers-reduced-motion: reduce)");

let frame=0;
let selected=-1;
let start=0;

const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=x=>{
  x=clamp(x);
  return x*x*(3-2*x);
};

function P(d,fill="none",stroke="none",w=2){
  return `<path d="${d}" fill="${fill}" stroke="${stroke}"
    stroke-width="${w}" stroke-linecap="round"
    stroke-linejoin="round"/>`;
}

function E(x,y,rx,ry,fill){
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}"
    ry="${ry}" fill="${fill}"/>`;
}

function heart(x,y,s){
  return `<g transform="translate(${x} ${y}) scale(${s})">
    ${P("M0 8C-25-7-16-28 0-15C16-28 25-7 0 8Z",
      "#f23f65","#ba1745",1.2)}
    ${P("M-11-13Q-13-19-7-20","none","#ffb9cb",2)}
  </g>`;
}

function paw(x,y,angle=0){
  return `<g transform="translate(${x} ${y}) rotate(${angle})">
    ${E(0,0,9,12,"url(#glove)")}
    ${P("M-4-6L-4 0M0-8V-1M4-6V0",
      "none","#c9bedc",1)}
  </g>`;
}

function blink(t){
  const p=(t+2.1)%3.6;
  if(p<.1)return smooth(p/.1);
  if(p<.24)return 1-smooth((p-.1)/.14);
  return 0;
}

function eye(x,y,open=1,gaze=0){
  if(open<.1)
    return P(`M${x-9} ${y}Q${x} ${y+4} ${x+9} ${y}`,
      "none","#46243a",3);

  return `<g transform="translate(${x} ${y})
    scale(1 ${open})">
    ${E(0,0,10,14,"#fff8f5")}
    ${E(gaze,2,7,10,"#40233d")}
    ${E(gaze,4,4,6,"#171329")}
    ${E(gaze-2,-3,3,4,"white")}
    ${E(gaze+3,6,1.3,1.6,"#d9b8ef")}
  </g>`;
}

function closed(x,y){
  return P(`M${x-10} ${y}Q${x} ${y-12} ${x+10} ${y}`,
    "none","#482337",3.5);
}

function mouthOpen(h){
  return P(
    `M52 87Q70 92 88 87
     C88 ${94+h} 79 ${100+h} 70 ${100+h}
     C61 ${100+h} 52 ${94+h} 52 87Z`,
    "#58243b"
  )+
  P("M55 89Q70 94 85 89L83 95Q70 98 57 95Z","#fff9f1")+
  E(70,97+h,8,3,"#f3809d");
}

function draw(kind,t,id){
  const b=blink(t);
  const beat=(Math.sin(t*8)+1)/2;
  let eyes=eye(51,65,1-b)+eye(89,65,1-b);
  let mouth=mouthOpen(3);
  let accessory="";
  let extra="";
  let hands=paw(36,112,-15)+paw(104,112,15);
  let brows="";
  let blush=.35;

  if(kind==="kiss"){
    eyes=eye(51,65,1-b)+closed(89,67);
    mouth=P("M68 87Q82 88 72 93Q82 98 68 99",
      "none","#8e3450",3.5);
    const p=(t%2.6)/2.6;
    extra=`<g opacity="${Math.sin(p*Math.PI)}">
      ${heart(103+p*14,90-p*19,.36+p*.12)}
    </g>`;
    hands=paw(47,111,-12)+paw(101,99,-28);
  }

  if(kind==="cool"||kind==="king"){
    eyes=P("M34 55L65 58L62 76Q45 82 37 69Z","#171525")+
      P("M75 58L106 55L103 69Q95 82 78 76Z","#171525")+
      P("M64 61Q70 57 76 61","none","#171525",4)+
      P("M42 59L55 62M84 60L97 57","none","#ffffff70",2);
    mouth=P("M60 92Q73 102 86 90","none","#703146",3);
  }

  if(kind==="laugh"){
    eyes=closed(51,65)+closed(89,65);
    mouth=mouthOpen(5+beat*8);
    hands=paw(38,110+beat,-15)+paw(102,110+beat,15);
  }

  if(kind==="love"){
    eyes=closed(51,65)+closed(89,65);
    extra=heart(70,111,.78);
    hands=paw(48,113,-28)+paw(92,113,28);
    blush=.65;
  }

  if(kind==="think"){
    const gaze=Math.sin(t*1.4)*2;
    eyes=eye(51,65,1-b,gaze)+eye(89,65,1-b,gaze);
    brows=P("M40 43Q51 36 61 42","none","#8b4e23",3);
    mouth=P("M61 96Q70 91 80 94","none","#703146",3);
    hands=paw(76,107,35);
    extra=`<text x="113" y="46" fill="#fff1ae"
      font-family="Arial" font-size="23">?</text>`;
  }

  if(kind==="sad"||kind==="cry"){
    brows=P("M39 45Q51 46 60 37","none","#9a5821",3)+
      P("M80 37Q89 46 101 45","none","#9a5821",3);
    mouth=kind==="cry"
      ?E(70,95,8+beat,7+beat*4,"#61283e")
      :P("M61 95Q70 89 79 95","none","#703146",3);
    hands=paw(60,119,-20)+paw(80,119,20);
    if(kind==="cry"){
      eyes=closed(51,65)+closed(89,65);
      for(let side=0;side<2;side++){
        for(let n=0;n<2;n++){
          const p=(t*.65+n*.5+side*.2)%1;
          extra+=`<g opacity="${Math.sin(p*Math.PI)}">
            ${E(side?95:45,76+p*p*36,3,5+p*2,"#62d3ff")}
          </g>`;
        }
      }
    }else{
      extra=E(51,74,7,2,"#79d7ff")+
        E(89,74,7,2,"#79d7ff");
    }
  }

  if(kind==="angry"){
    eyes=eye(51,65,.65)+eye(89,65,.65);
    brows=P("M37 45L61 55M79 55L103 45",
      "none","#804221",5);
    mouth=P("M58 99Q70 87 82 99","none","#703146",3);
    hands=paw(49,117,-30)+paw(91,117,30);
  }

  if(kind==="sleep"){
    eyes=P("M41 66Q51 75 61 66M79 66Q89 75 99 66",
      "none","#65333b",3);
    mouth=E(70,95,4,4+Math.sin(t*2),"#82403e");
    accessory=P("M28 44Q45 0 96 24L115 49Q70 30 28 44Z",
      "#6799ff","#d8e8ff",2)+
      P("M29 44Q70 33 111 48","none","#e8f2ff",9)+
      E(115,49,8,8,"#eef4ff");
    extra=`<text x="114" y="31" fill="#e1eaff"
      font-family="Arial" font-size="15">z</text>`;
  }

  if(kind==="wink"){
    eyes=eye(51,65,1-b)+closed(89,65);
    hands=paw(35,112,-15)+paw(108,88,20);
  }

  if(kind==="king"){
    accessory=P(
      "M40 32L34 10L52 22L69 3L85 22L105 10L99 34Z",
      "#ffd24d","#b97918",2
    )+E(69,20,4,5,"#ef4776");
  }

  if(kind==="angel"){
    accessory=`<ellipse cx="70" cy="15" rx="27" ry="7"
      fill="none" stroke="#ffe96c" stroke-width="5"/>`;
    extra=P("M29 91Q2 71 10 55Q19 64 31 62Z","#f7efff")+
      P("M111 91Q138 71 130 55Q121 64 109 62Z","#f7efff");
    hands=paw(63,117,-15)+paw(77,117,15);
  }

  if(kind==="shy"){
    eyes=closed(51,65)+closed(89,65);
    hands=paw(37,90,-15)+paw(103,90,15);
    blush=.8;
  }

  if(kind==="game"){
    brows=P("M39 46L61 51M79 51L101 46",
      "none","#804221",3);
    accessory=P("M25 69V51Q25 9 70 10Q115 9 115 51V69",
      "none","#7875f7",7)+
      E(26,66,8,17,"#5964e9")+
      E(114,66,8,17,"#5964e9");
    extra=P(
      "M49 108Q70 101 91 108L99 125Q97 134 88 129L79 121H61L52 129Q43 134 41 125Z",
      "#25263e","#9293ba",2
    )+P("M51 113V121M47 117H55","none","#d3d8ff",2)+
      E(87,115,2,2,"#ff6296");
    hands=paw(45,120,-20)+paw(95,120,20);
  }

  const svg=`
  <svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="face" cx="35%" cy="23%" r="80%">
        <stop stop-color="#fff6b0"/>
        <stop offset=".32" stop-color="#ffe36b"/>
        <stop offset=".72" stop-color="#ffc72d"/>
        <stop offset="1" stop-color="#e99211"/>
      </radialGradient>
      <linearGradient id="glove" x2=".8" y2="1">
        <stop stop-color="#fff"/>
        <stop offset="1" stop-color="#d4c8ed"/>
      </linearGradient>
    </defs>

    ${E(70,135,32,5,"#0005")}
    ${E(58,128,10,6,"url(#glove)")}
    ${E(82,128,10,6,"url(#glove)")}

    <circle cx="70" cy="69" r="46"
      fill="url(#face)" stroke="#f7bc33" stroke-width="1"/>

    ${E(50,34,16,6,"#fff7c050")}
    ${brows}
    ${eyes}

    <g opacity="${blush}">
      ${E(37,82,9,5,"#f17770")}
      ${E(103,82,9,5,"#f17770")}
    </g>

    ${mouth}
    ${accessory}
    ${extra}
    ${hands}
  </svg>`;

  // Unique gradient IDs allow multiple previews on one page.
  return svg
    .replaceAll('id="face"',`id="${id}-face"`)
    .replaceAll('id="glove"',`id="${id}-glove"`)
    .replaceAll("url(#face)",`url(#${id}-face)`)
    .replaceAll("url(#glove)",`url(#${id}-glove)`);
}

function clearEmoji(){
  cancelAnimationFrame(frame);
  frame=0;
  selected=-1;
  actor.hidden=true;
  actor.replaceChildren();
  seat.classList.remove("has-effect");
  [...list.children].forEach(b=>{
    b.classList.remove("active");
    b.setAttribute("aria-pressed","false");
  });
  statusBox.textContent="Choose a reaction";
}

function applyEmoji(index){
  clearEmoji();
  selected=index;
  actor.hidden=false;
  seat.classList.add("has-effect");

  list.children[index].classList.add("active");
  list.children[index].setAttribute("aria-pressed","true");

  const [kind,name]=reactions[index];
  statusBox.textContent=name+" · Remove Effect to restore avatar";
  start=performance.now();

  if(reduced.matches){
    actor.innerHTML=draw(kind,1,"active");
    return;
  }

  function tick(now){
    actor.innerHTML=draw(kind,(now-start)/1000,"active");
    frame=requestAnimationFrame(tick);
  }

  frame=requestAnimationFrame(tick);
}

reactions.forEach(([kind,name],index)=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="select-btn";
  button.setAttribute("aria-label",name);
  button.setAttribute("aria-pressed","false");
  button.innerHTML=
    draw(kind,1,"preview"+index)+`<span>${name}</span>`;
  button.onclick=()=>applyEmoji(index);
  list.appendChild(button);
});

document.getElementById("clear").onclick=clearEmoji;

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    cancelAnimationFrame(frame);
  }else if(selected>=0){
    applyEmoji(selected);
  }
});
</script>
</body>
</html>
