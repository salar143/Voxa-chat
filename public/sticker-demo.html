<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>25 Live Animated Emojis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #0f172a, #000000);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        .header {
            padding: 12px 20px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #4ade80;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid #222;
        }

        /* Seats Area */
        .room-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 15px;
            justify-items: center;
            align-content: start;
            margin-top: 10px;
        }

        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .avatar-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #1e1e2a;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar-circle.has-effect {
            border-color: #ffcc00;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.6);
        }

        .user-icon {
            font-size: 45px;
            color: #555;
            transition: opacity 0.3s;
        }

        /* Live GIF Emoji Layer */
        .seat-emoji {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 125px;
            height: 125px;
            object-fit: contain;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.9));
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
        }

        .seat-emoji.show {
            opacity: 1;
            transform: scale(1);
        }

        .seat-name {
            margin-top: 10px;
            font-size: 13px;
            color: #ddd;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 12px;
        }

        /* Control Panel */
        .control-panel {
            background: #111;
            padding: 10px;
            border-top: 1px solid #333;
            padding-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .panel-title {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }

        /* Emoji Buttons List (Grid format for 25 emojis) */
        .emoji-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            justify-items: center;
            padding: 0 10px;
        }

        .select-btn {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .select-btn:active {
            transform: scale(0.8);
            background: rgba(255,255,255,0.2);
        }

        .clear-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            margin: 15px auto 5px;
            display: block;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">Tap Emoji for Live Animation</div>

    <div class="room-grid">
        <div class="seat">
            <div class="avatar-circle" id="seat1">
                <span class="user-icon" id="icon1">👤</span>
                <img src="" class="seat-emoji" id="emoji1" alt="Emoji">
            </div>
            <div class="seat-name">Owner</div>
        </div>

        <div class="seat">
            <div class="avatar-circle"><span class="user-icon">👤</span></div>
            <div class="seat-name">No.2</div>
        </div>

        <div class="seat">
            <div class="avatar-circle" style="background: rgba(0,0,0,0.6);"><span class="user-icon">🔒</span></div>
            <div class="seat-name">No.3</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-title">Select Emoji (25 Live Animations)</div>
        <div class="emoji-list">
            
            <!-- 1. Kiss -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f618/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 2. Love/Heart Eyes -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60d/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 3. Thinking -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f914/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 4. Laughing -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f602/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 5. Crying -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f62d/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- 6. Angry -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f621/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 7. Cool Sunglasses -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60e/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 8. Shy/Blush -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60a/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 9. Thumbs Up -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 10. Party Face -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f973/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- 11. Sleeping -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f634/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 12. Mind Blown -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f92f/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 13. Clapping -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44f/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 14. Confused -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f615/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 15. Star Eyes -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f929/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- 16. Yawning -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f971/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 17. Screaming -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f631/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 18. Smiling Devil -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f608/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 19. Wink -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f609/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 20. Peace / Victory -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/270c_1f3fb/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            
            <!-- 21. Sad/Disappointed -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f61e/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 22. Smiling with Halo -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f607/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 23. Drooling (Bhookha) -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f924/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 24. Rolling Eyes -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f644/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <!-- 25. Folded Hands (Namaste) -->
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f64f/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            
        </div>
        <button class="clear-btn" onclick="clearEmoji()">Remove Effect</button>
    </div>

    <script>
        const seat1Avatar = document.getElementById('seat1');
        const seat1EmojiImg = document.getElementById('emoji1');
        const seat1NormalIcon = document.getElementById('icon1');

        function applyEmoji(imageSource) {
            seat1EmojiImg.src = imageSource;
            
            setTimeout(() => {
                seat1EmojiImg.classList.add('show');
                seat1Avatar.classList.add('has-effect');
                seat1NormalIcon.style.opacity = '0'; 
            }, 50);
        }

        function clearEmoji() {
            seat1EmojiImg.classList.remove('show');
            seat1Avatar.classList.remove('has-effect');
            seat1NormalIcon.style.opacity = '1';

            setTimeout(() => {
                seat1EmojiImg.src = "";
            }, 400);
        }
    </script>
</body>
</html>
