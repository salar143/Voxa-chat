<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Emoji - Live Working</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0f;
            background-image: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        .header {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            background: #111;
            border-bottom: 1px solid #333;
        }

        /* Image Uploader Section */
        .uploader {
            padding: 10px;
            text-align: center;
            background: #222;
            border-bottom: 1px solid #444;
        }
        .uploader input {
            color: white;
            font-size: 12px;
        }

        /* Seats Area */
        .room-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            justify-items: center;
            align-content: start;
            margin-top: 10px;
        }

        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Avatar Circle */
        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #222;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar-circle.has-effect {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        .user-icon {
            font-size: 45px;
            color: #555;
            transition: opacity 0.3s;
        }

        /* The Cropped Emoji Image Layer */
        .seat-emoji-container {
            position: absolute;
            top: -15px;
            left: -15px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            /* Default background color */
            background-color: transparent; 
            background-size: 300% 200%;
            background-repeat: no-repeat;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.9));
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
        }

        .seat-emoji-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .seat-name {
            margin-top: 12px;
            font-size: 14px;
            color: #ddd;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 12px;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-top: 1px solid #333;
            padding-bottom: 25px;
        }

        .panel-title {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .emoji-list {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Niche ke Emoji Buttons */
        .select-btn {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 50%;
            border: 2px solid #555;
            background-color: #333;
            background-size: 300% 200%;
            background-repeat: no-repeat;
        }

        .select-btn:active {
            transform: scale(0.8);
        }

        /* Positions for 6 emojis in the image (3 columns, 2 rows) */
        .pos-1 { background-position: 0% 0%; }      /* Kiss */
        .pos-2 { background-position: 50% 0%; }     /* Shy */
        .pos-3 { background-position: 100% 0%; }    /* Cool */
        .pos-4 { background-position: 0% 100%; }    /* Sleep */
        .pos-5 { background-position: 50% 100%; }   /* Laugh */
        .pos-6 { background-position: 100% 100%; }  /* Mega */

        .clear-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 15px auto 0;
            display: block;
            font-weight: bold;
            cursor: pointer;
        }

        /* Flying Heart Animation */
        @keyframes flyHeart {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(-40px, -80px) scale(1.5); opacity: 0; }
        }

        .flying-heart {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            z-index: 20;
            animation: flyHeart 1s ease-out forwards;
        }

    </style>
</head>
<body>

    <div class="header">Yari App Style Emoji Effects</div>

    <!-- Step 1: Upload Image Here -->
    <div class="uploader">
        <label>1. Apni Image Select Karein: </label>
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div class="room-grid">
        <div class="seat">
            <div class="avatar-circle" id="seat1">
                <span class="user-icon" id="icon1">👤</span>
                <!-- Yahan image crop hokar aayegi -->
                <div class="seat-emoji-container" id="emoji1"></div>
            </div>
            <div class="seat-name">Owner</div>
        </div>

        <div class="seat">
            <div class="avatar-circle"><span class="user-icon">👤</span></div>
            <div class="seat-name">No.2</div>
        </div>

        <div class="seat">
            <div class="avatar-circle" style="background: rgba(0,0,0,0.6);"><span class="user-icon">🔒</span></div>
            <div class="seat-name">No.3</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-title">2. Emoji Par Tap Karein</div>
        <div class="emoji-list" id="emojiButtons">
            <!-- Buttons jinki background image upload hone ke baad set hogi -->
            <div class="select-btn pos-1" onclick="applyEmoji('pos-1', true)"></div>
            <div class="select-btn pos-2" onclick="applyEmoji('pos-2', false)"></div>
            <div class="select-btn pos-3" onclick="applyEmoji('pos-3', false)"></div>
            <div class="select-btn pos-4" onclick="applyEmoji('pos-4', false)"></div>
            <div class="select-btn pos-5" onclick="applyEmoji('pos-5', false)"></div>
            <div class="select-btn pos-6" onclick="applyEmoji('pos-6', false)"></div>
        </div>
        <button class="clear-btn" onclick="clearEmoji()">Remove Effect</button>
    </div>

    <script>
        const seat1Avatar = document.getElementById('seat1');
        const seat1EmojiDiv = document.getElementById('emoji1');
        const seat1NormalIcon = document.getElementById('icon1');
        const imageLoader = document.getElementById('imageLoader');
        const emojiButtons = document.querySelectorAll('.select-btn');

        // Jab user apni image upload kare
        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageUrl = event.target.result;
                    
                    // Jo image user ne upload ki, usko buttons aur seat par set kar do
                    emojiButtons.forEach(btn => {
                        btn.style.backgroundImage = `url(${imageUrl})`;
                    });
                    seat1EmojiDiv.style.backgroundImage = `url(${imageUrl})`;
                    
                    alert("Image Load Ho Gayi! Ab niche emoji par tap karein.");
                };
                reader.readAsDataURL(file);
            }
        });

        // Positions mapping
        const positions = {
            'pos-1': '0% 0%',       // Kiss
            'pos-2': '50% 0%',      // Shy
            'pos-3': '100% 0%',     // Cool
            'pos-4': '0% 100%',     // Sleep
            'pos-5': '50% 100%',    // Laugh
            'pos-6': '100% 100%'    // Mega
        };

        function applyEmoji(posClass, isKiss) {
            // Check karein image load hui hai ya nahi
            if (!seat1EmojiDiv.style.backgroundImage) {
                alert("Pehle upar se image select karein!");
                return;
            }

            seat1EmojiDiv.style.backgroundPosition = positions[posClass];
            
            setTimeout(() => {
                seat1EmojiDiv.classList.add('show');
                seat1Avatar.classList.add('has-effect');
                seat1NormalIcon.style.opacity = '0'; 

                // Agar Kiss (pos-1) tap kiya hai to dil udao
                if (isKiss) {
                    createFlyingHeart(seat1Avatar);
                }
            }, 50);
        }

        function createFlyingHeart(parentElement) {
            const heart = document.createElement('div');
            heart.classList.add('flying-heart');
            heart.innerHTML = '❤️'; 
            
            heart.style.left = '70px';
            heart.style.top = '25px';
            
            parentElement.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        }

        function clearEmoji() {
            seat1EmojiDiv.classList.remove('show');
            seat1Avatar.classList.remove('has-effect');
            seat1NormalIcon.style.opacity = '1';
        }
    </script>
</body>
</html>
