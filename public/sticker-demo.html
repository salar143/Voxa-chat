<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Emoji With Flying Kiss Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0f;
            background-image: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        .header {
            padding: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Seats Area */
        .room-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            justify-items: center;
            align-content: start;
            margin-top: 20px;
        }

        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Avatar Circle */
        .avatar-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #222;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar-circle.has-effect {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
            background: #333;
        }

        .user-icon {
            font-size: 45px;
            color: #555;
            transition: opacity 0.3s;
        }

        /* 3D Emoji Image Layer */
        .seat-emoji {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 125px;
            height: 125px;
            object-fit: contain;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.9));
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
            /* Image ka background white hai, isliye blend mode use kiya hai */
            mix-blend-mode: screen; 
            background-color: transparent;
        }

        .seat-emoji.show {
            opacity: 1;
            transform: scale(1);
        }

        .seat-name {
            margin-top: 12px;
            font-size: 14px;
            color: #ddd;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 12px;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-top: 1px solid #333;
            padding-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .emoji-list {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Niche ke 3D Emoji Buttons (Aapki Image Se) */
        .select-btn {
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 15px;
            padding: 5px;
            object-fit: contain;
        }

        .select-btn:active {
            transform: scale(0.8);
        }

        .clear-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 15px auto 0;
            display: block;
            font-weight: bold;
            cursor: pointer;
        }

        /* Flying Heart Animation */
        @keyframes flyHeart {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(-30px, -60px) scale(1.5); opacity: 0; }
        }

        .flying-heart {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            z-index: 20;
            animation: flyHeart 1s ease-out forwards;
        }

    </style>
</head>
<body>

    <div class="header">Tap Emojis For Magic Effect</div>

    <div class="room-grid">
        <div class="seat">
            <div class="avatar-circle" id="seat1">
                <span class="user-icon" id="icon1">👤</span>
                <img src="" class="seat-emoji" id="emoji1" alt="Emoji">
            </div>
            <div class="seat-name">Owner</div>
        </div>

        <div class="seat">
            <div class="avatar-circle"><span class="user-icon">👤</span></div>
            <div class="seat-name">No.2</div>
        </div>

        <div class="seat">
            <div class="avatar-circle" style="background: rgba(0,0,0,0.6);"><span class="user-icon">🔒</span></div>
            <div class="seat-name">No.3</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-title">Select 3D Emoji</div>
        <div class="emoji-list">
            
            <!-- Maine yahan aapki image ke hisaab se emojis lagaye hain. 
                 Aap in src links ko apni image ke direct links se replace kar sakte hain. -->
            
            <!-- Kissing Emoji with Bow -->
            <img src="https://i.ibb.co/68ZqXqz/kiss-emoji.png" 
                 class="select-btn" onclick="applyEmoji(this.src, true)">
            
            <!-- Shy Love Emoji -->
            <img src="https://i.ibb.co/3s7Y1sB/shy-emoji.png" 
                 class="select-btn" onclick="applyEmoji(this.src, false)">
            
            <!-- Cool Sunglasses Emoji -->
            <img src="https://i.ibb.co/5K1x7t7/cool-emoji.png" 
                 class="select-btn" onclick="applyEmoji(this.src, false)">
            
            <!-- Sleeping Emoji -->
            <img src="https://i.ibb.co/L5k8ZgC/sleep-emoji.png" 
                 class="select-btn" onclick="applyEmoji(this.src, false)">
            
            <!-- Laughing Emoji -->
            <img src="https://i.ibb.co/1Jt6YpQ/laugh-emoji.png" 
                 class="select-btn" onclick="applyEmoji(this.src, false)">
                 
        </div>
        <button class="clear-btn" onclick="clearEmoji()">Remove Effect</button>
    </div>

    <script>
        const seat1Avatar = document.getElementById('seat1');
        const seat1EmojiImg = document.getElementById('emoji1');
        const seat1NormalIcon = document.getElementById('icon1');

        function applyEmoji(imageSource, isKiss) {
            seat1EmojiImg.src = imageSource;
            
            setTimeout(() => {
                seat1EmojiImg.classList.add('show');
                seat1Avatar.classList.add('has-effect');
                seat1NormalIcon.style.opacity = '0'; 

                // Agar Kiss wala emoji select kiya hai, to dil udaao
                if (isKiss) {
                    createFlyingHeart(seat1Avatar);
                }

            }, 50);
        }

        // Flying Heart banane ka function
        function createFlyingHeart(parentElement) {
            const heart = document.createElement('div');
            heart.classList.add('flying-heart');
            heart.innerHTML = '❤️'; // Ya '💖' use kar sakte hain
            
            // Heart ko avatar ke paas position karo
            heart.style.left = '60px';
            heart.style.top = '20px';
            
            parentElement.appendChild(heart);

            // 1 second baad heart remove kar do
            setTimeout(() => {
                heart.remove();
            }, 1000);
        }

        function clearEmoji() {
            seat1EmojiImg.classList.remove('show');
            seat1Avatar.classList.remove('has-effect');
            seat1NormalIcon.style.opacity = '1';

            setTimeout(() => {
                seat1EmojiImg.src = "";
            }, 400);
        }
    </script>
</body>
</html>
