<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Animated Emojis</title>
    <style>
        /* Basic Reset & Dark Theme Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d12;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Section Styling */
        .section-container {
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
        }

        /* Border Colors for different tiers */
        .tier-free { border-color: #28a745; box-shadow: 0 0 15px rgba(40, 167, 69, 0.3); }
        .tier-vip2 { border-color: #ffc107; box-shadow: 0 0 15px rgba(255, 193, 7, 0.3); }
        .tier-vip6 { border-color: #8a2be2; box-shadow: 0 0 15px rgba(138, 43, 226, 0.3); }
        .tier-premium { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }

        /* Titles */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            background: #1a1a24;
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .tier-free .section-title { border: 2px solid #28a745; color: #28a745; }
        .tier-vip2 .section-title { border: 2px solid #ffc107; color: #ffc107; }
        .tier-vip6 .section-title { border: 2px solid #8a2be2; color: #d19aff; }
        .tier-premium .section-title { border: 2px solid #00e5ff; color: #00e5ff; }

        /* Grid Layout */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        /* Emoji Card Styling */
        .emoji-card {
            background: #1e1e2a;
            border-radius: 15px;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Hover Effects & Animations */
        .emoji-card:hover {
            transform: translateY(-8px) scale(1.1);
            z-index: 10;
        }

        .tier-free .emoji-card:hover { box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4); }
        .tier-vip2 .emoji-card:hover { box-shadow: 0 10px 20px rgba(255, 193, 7, 0.4); }
        .tier-vip6 .emoji-card:hover { box-shadow: 0 10px 20px rgba(138, 43, 226, 0.5); }
        .tier-premium .emoji-card:hover { box-shadow: 0 10px 20px rgba(0, 229, 255, 0.5); }

        /* Click Animation (Bounce) */
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .clicked {
            animation: bounce 0.4s ease;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .emoji-grid { grid-template-columns: repeat(3, 1fr); }
            .section-title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- 1. FREE TIER -->
    <div class="section-container tier-free">
        <div class="section-title">✅ 15 Free Emoji (Sabhi Users ke liye)</div>
        <div class="emoji-grid">
            <div class="emoji-card">👍</div>
            <div class="emoji-card">😘</div>
            <div class="emoji-card">😎</div>
            <div class="emoji-card">😂</div>
            <div class="emoji-card">🥰</div>
            <div class="emoji-card">🤔</div>
            <div class="emoji-card">🥺</div>
            <div class="emoji-card">😡</div>
            <div class="emoji-card">😴</div>
            <div class="emoji-card">✌️</div>
            <div class="emoji-card">😇</div>
            <div class="emoji-card">😳</div>
            <div class="emoji-card">🥳</div>
            <div class="emoji-card">🤩</div>
            <div class="emoji-card">🫶</div>
        </div>
    </div>

    <!-- 2. VIP 2+ TIER -->
    <div class="section-container tier-vip2">
        <div class="section-title">👑 5 VIP 2+ Emoji (Premium Access)</div>
        <div class="emoji-grid">
            <div class="emoji-card">🤴</div>
            <div class="emoji-card">👼</div>
            <div class="emoji-card">😊</div>
            <div class="emoji-card">🎉</div>
            <div class="emoji-card">🎧</div>
        </div>
    </div>

    <!-- 3. VIP 6+ TIER -->
    <div class="section-container tier-vip6">
        <div class="section-title">👑 5 VIP 6+ Emoji (Super Premium)</div>
        <div class="emoji-grid">
            <div class="emoji-card">😈</div>
            <div class="emoji-card">🥷</div>
            <div class="emoji-card">👸</div>
            <div class="emoji-card">🎮</div>
            <div class="emoji-card">🧑‍💼</div>
        </div>
    </div>

    <!-- 4. PREMIUM TIER -->
    <div class="section-container tier-premium">
        <div class="section-title">💎 5 Premium Emoji (Exclusive)</div>
        <div class="emoji-grid">
            <div class="emoji-card">💖</div>
            <div class="emoji-card">🕶️</div>
            <div class="emoji-card">😭</div>
            <div class="emoji-card">🐼</div>
            <div class="emoji-card">👨‍🚀</div>
        </div>
    </div>

    <!-- JavaScript for Click Animation -->
    <script>
        // Saare emoji cards ko select karein
        const emojiCards = document.querySelectorAll('.emoji-card');

        emojiCards.forEach(card => {
            card.addEventListener('click', function() {
                // Animation class add karein
                this.classList.add('clicked');
                
                // 400ms (animation duration) ke baad class remove kar dein taaki dobara click kar sakein
                setTimeout(() => {
                    this.classList.remove('clicked');
                }, 400);

                // Yahan aap sound effect ya copy feature bhi add kar sakte hain
                console.log("Emoji Clicked: " + this.innerText);
            });
        });
    </script>
</body>
</html>
