<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VC App - EXP based VIP</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        .header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); border-bottom: 1px solid #222; }
        .user-stats { display: flex; gap: 10px; align-items: center; }
        .stat-box { background: #222; padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 12px; border: 1px solid #444; }
        .exp-box { color: #28a745; border-color: #28a745; }
        .diamond-box { color: #00e5ff; border-color: #00e5ff; }
        
        .btn-recharge { background: linear-gradient(45deg, #00e5ff, #007bff); border: none; padding: 5px 10px; border-radius: 15px; color: white; cursor: pointer; font-weight: bold; font-size: 11px;}

        /* Seats */
        .room-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; justify-items: center; align-content: start; margin-top: 10px;}
        .seat { display: flex; flex-direction: column; align-items: center; position: relative; }
        .avatar-circle { width: 85px; height: 85px; border-radius: 50%; background: #1e1e2a; border: 2px solid rgba(255, 255, 255, 0.2); display: flex; justify-content: center; align-items: center; position: relative; transition: 0.3s; }
        .avatar-circle.has-effect { border-color: #ffcc00; box-shadow: 0 0 25px rgba(255, 204, 0, 0.6); }
        .user-icon { font-size: 45px; color: #555; transition: opacity 0.3s; }
        .seat-emoji { position: absolute; top: -20px; left: -20px; width: 125px; height: 125px; object-fit: contain; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.9)); opacity: 0; transform: scale(0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 10; }
        .seat-emoji.show { opacity: 1; transform: scale(1); }
        .seat-name { margin-top: 10px; font-size: 13px; color: #ddd; background: rgba(0,0,0,0.6); padding: 3px 12px; border-radius: 12px; }

        /* Control Panel */
        .control-panel { background: #111; padding: 10px; border-top: 1px solid #333; max-height: 340px; overflow-y: auto; }
        .category-title { font-size: 13px; font-weight: bold; margin: 12px 0 8px 10px; display: flex; justify-content: space-between; align-items: center;}
        .cat-free { color: #28a745; }
        .cat-vip2 { color: #ffd700; }
        .cat-vip6 { color: #d19aff; }
        
        .buy-vip-btn { font-size: 11px; padding: 4px 10px; border-radius: 10px; border: none; cursor: pointer; color: #000; font-weight: bold; }
        .buy-btn-2 { background: #ffd700; }
        .buy-btn-6 { background: #b02aed; color: white; }

        .emoji-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 0 10px; margin-bottom: 15px; }
        .select-btn { width: 50px; height: 50px; cursor: pointer; transition: transform 0.2s; border-radius: 50%; background: rgba(255,255,255,0.05); padding: 5px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .select-btn:active { transform: scale(0.8); }
        
        .vip-locked { opacity: 0.6; }
        .lock-icon { position: absolute; top: -2px; right: -2px; font-size: 12px; background: #000; border-radius: 50%; width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; z-index: 5; }
        .clear-btn { background: #ff4444; color: white; border: none; padding: 8px 20px; border-radius: 20px; margin: 5px auto 10px; display: block; font-weight: bold; cursor: pointer; font-size: 14px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-stats">
            <div class="stat-box exp-box" id="expDisplay">EXP: 0</div>
            <div class="stat-box diamond-box" id="diamondDisplay">💎 0</div>
        </div>
        <!-- Testing ke liye EXP add karne ka button -->
        <button class="btn-recharge" onclick="addExp(1000)">+1000 EXP</button>
    </div>

    <div class="room-grid">
        <div class="seat">
            <div class="avatar-circle" id="seat1">
                <span class="user-icon" id="icon1">👤</span>
                <img src="" class="seat-emoji" id="emoji1" alt="Emoji">
            </div>
            <div class="seat-name">Owner (You)</div>
        </div>
        <div class="seat">
            <div class="avatar-circle"><span class="user-icon">👤</span></div>
            <div class="seat-name">No.2</div>
        </div>
    </div>

    <div class="control-panel">
        <!-- FREE TIER -->
        <div class="category-title cat-free"><span>✅ 15 Free Emojis (All Users)</span></div>
        <div class="emoji-list">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60a/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f609/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f602/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60d/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f615/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f61e/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f621/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f634/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44f/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f618/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f914/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f62d/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60e/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f971/512.gif" class="select-btn" onclick="applyEmoji(this.src)">
        </div>

        <!-- VIP 2+ TIER (4000 EXP Required) -->
        <div class="category-title cat-vip2">
            <span>👑 VIP 2+ Emojis (Needs 4000 EXP)</span>
            <span id="vip2-status" style="color:#ffd700; font-size:10px;">Locked</span>
        </div>
        <div class="emoji-list" id="vip2-list">
            <div class="select-btn vip-locked" onclick="handleVipClick(2, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f92f/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(2, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f929/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(2, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f973/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(2, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/270c_1f3fb/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(2, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f644/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
        </div>

        <!-- VIP 6+ TIER (15000 EXP Required) -->
        <div class="category-title cat-vip6">
            <span>💎 VIP 6+ Emojis (Needs 15000 EXP)</span>
            <span id="vip6-status" style="color:#d19aff; font-size:10px;">Locked</span>
        </div>
        <div class="emoji-list" id="vip6-list">
            <div class="select-btn vip-locked" onclick="handleVipClick(6, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f608/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(6, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f631/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(6, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f924/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(6, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f64f/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
            <div class="select-btn vip-locked" onclick="handleVipClick(6, this)">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f607/512.gif" style="width:100%; height:100%;"><span class="lock-icon">🔒</span>
            </div>
        </div>
        <button class="clear-btn" onclick="clearEmoji()">Remove Effect</button>
    </div>

    <script>
        // ==========================================
        // 1. SUPABASE SETUP
        // ==========================================
        // IMPORTANT: Apne Supabase profiles table me 'exp' (int) column add karein
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        // userData me ab 'exp' bhi add kar diya hai
        let userData = { diamonds: 0, exp: 0 }; 

        // ==========================================
        // 2. APP INITIALIZATION
        // ==========================================
        async function initApp() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                currentUser = user;
                await fetchUserData(user.id);
            } else {
                const { data, error } = await supabase.auth.signInAnonymously();
                if (!error) {
                    currentUser = data.user;
                    await fetchUserData(currentUser.id);
                }
            }
        }

        async function fetchUserData(userId) {
            const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (data) {
                // Agar database me exp nahi hai toh 0 maan lo
                userData = { ...data, exp: data.exp || 0 };
                updateUI();
            }
        }

        // ==========================================
        // 3. UI UPDATE & VIP UNLOCK LOGIC
        // ==========================================
        function updateUI() {
            document.getElementById('diamondDisplay').innerText = `💎 ${userData.diamonds}`;
            document.getElementById('expDisplay').innerText = `EXP: ${userData.exp}`;

            // VIP 2 Check (4000 EXP)
            if (userData.exp >= 4000) {
                document.getElementById('vip2-status').innerText = "✅ Unlocked";
                document.getElementById('vip2-status').style.color = "#28a745";
                unlockEmojis('vip2-list');
            } else {
                document.getElementById('vip2-status').innerText = `Need ${4000 - userData.exp} more EXP`;
            }

            // VIP 6 Check (15000 EXP)
            if (userData.exp >= 15000) {
                document.getElementById('vip6-status').innerText = "✅ Unlocked";
                document.getElementById('vip6-status').style.color = "#28a745";
                unlockEmojis('vip6-list');
            } else {
                document.getElementById('vip6-status').innerText = `Need ${15000 - userData.exp} more EXP`;
            }
        }

        function unlockEmojis(listId) {
            const list = document.getElementById(listId);
            const lockedEmojis = list.querySelectorAll('.vip-locked');
            lockedEmojis.forEach(emoji => {
                emoji.classList.remove('vip-locked'); 
                const lockIcon = emoji.querySelector('.lock-icon');
                if (lockIcon) lockIcon.remove(); 
            });
        }

        // ==========================================
        // 4. TESTING: EXP ADD KARNA (Real app me gifts se EXP badhega)
        // ==========================================
        async function addExp(amount) {
            const newExp = userData.exp + amount;
            const { error } = await supabase.from('profiles').update({ exp: newExp }).eq('id', currentUser.id);
            
            if (!error) {
                userData.exp = newExp;
                updateUI();
                // Agar EXP se VIP unlock hua toh alert bhi dikhayein
                if (newExp >= 4000 && newExp < 4000 + amount) {
                    alert("🎉 Badhai ho! Aapne 4000 EXP cross kar liye. VIP 2+ Emojis Unlock ho gaye hain!");
                }
                if (newExp >= 15000 && newExp < 15000 + amount) {
                    alert("💎 Badhai ho! Aapne 15000 EXP cross kar liye. VIP 6+ Premium Emojis Unlock ho gaye hain!");
                }
            }
        }

        // ==========================================
        // 5. EMOJI CLICK & ANIMATION
        // ==========================================
        function handleVipClick(requiredVip, element) {
            if (requiredVip === 2 && userData.exp < 4000) {
                alert("🔒 Yeh emoji VIP 2+ ka hai. Isko unlock karne ke liye aapko 4000 EXP chahiye. (Gifts receive karein)");
                return;
            }
            if (requiredVip === 6 && userData.exp < 15000) {
                alert("🔒 Yeh emoji VIP 6+ ka hai. Isko unlock karne ke liye aapko 15000 EXP chahiye. (Gifts receive karein)");
                return;
            }
            applyEmoji(element.querySelector('img').src);
        }

        function applyEmoji(imageSource) {
            const emojiImg = document.getElementById('emoji1');
            const avatar = document.getElementById('seat1');
            const icon = document.getElementById('icon1');

            emojiImg.src = imageSource;
            setTimeout(() => {
                emojiImg.classList.add('show');
                avatar.classList.add('has-effect');
                icon.style.opacity = '0';
            }, 50);
        }

        function clearEmoji() {
            const emojiImg = document.getElementById('emoji1');
            const avatar = document.getElementById('seat1');
            const icon = document.getElementById('icon1');

            emojiImg.classList.remove('show');
            avatar.classList.remove('has-effect');
            icon.style.opacity = '1';
            setTimeout(() => { emojiImg.src = ""; }, 400);
        }

        initApp();
    </script>
</body>
</html>
