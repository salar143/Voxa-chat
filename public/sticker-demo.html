
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Animated Emoji Picker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 12px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at top, #25105a, transparent 65%),
    linear-gradient(160deg, #030817, #100527 55%, #020817);
}

.emoji-app {
  max-width: 1050px;
  margin: auto;
}

.tier {
  --glow: #00eaff;
  position: relative;
  margin: 26px 30px 40px;
  padding: 48px 14px 16px;
  border: 2px solid var(--glow);
  border-radius: 26px;
  box-shadow: 0 0 15px var(--glow),
              inset 0 0 16px #ffffff10;
}

.free { --glow: #32ff9c; }
.vip2 { --glow: #ffbe24; }
.vip6 { --glow: #d64dff; }

.tier-title {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 90%;
  padding: 10px 22px;
  text-align: center;
  border: 2px solid var(--glow);
  border-radius: 40px;
  background: #08071c;
  box-shadow: 0 0 14px var(--glow);
  font-size: clamp(14px, 2.7vw, 23px);
  font-weight: 800;
}

.free .tier-title { color: #66ffb2; }
.vip2 .tier-title { color: #ffd65c; }
.vip6 .tier-title { color: #e8a0ff; }

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.emoji-card {
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  position: relative;
  overflow: hidden;
  border: 1px solid #7778ff;
  border-radius: 20px;
  background: linear-gradient(145deg, #171936, #090d22);
  box-shadow: inset 0 0 12px #7b61ff25;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

.emoji-card:hover {
  transform: translateY(-5px) scale(1.04);
  box-shadow: 0 0 18px var(--glow);
}

.emoji {
  font-size: clamp(27px, 6.3vw, 66px);
  line-height: 1;
  filter: drop-shadow(0 5px 5px #0008);
  user-select: none;
}

.vip2 .emoji-card { border-color: #ffbf45; }
.vip6 .emoji-card { border-color: #d64dff; }

.nav {
  position: absolute;
  top: 50%;
  z-index: 2;
  transform: translateY(-50%);
  width: 44px;
  height: 54px;
  border: 2px solid #9b7bff;
  border-radius: 50%;
  color: white;
  background: #160d3b;
  box-shadow: 0 0 15px #8d59ff;
  font-size: 30px;
  cursor: pointer;
}

.nav:hover {
  background: #4622a2;
  box-shadow: 0 0 22px #bd91ff;
}

.nav.left { left: -27px; }
.nav.right { right: -27px; }

.footer {
  text-align: center;
  color: #bdb5df;
  font-size: 13px;
  padding: 8px;
}

@media (max-width: 520px) {
  body { padding: 20px 5px; }
  .tier {
    margin: 28px 21px 34px;
    padding: 35px 6px 8px;
    border-radius: 17px;
  }
  .emoji-grid { gap: 5px; }
  .emoji-card { border-radius: 12px; }
  .nav {
    width: 32px;
    height: 40px;
    font-size: 23px;
  }
  .nav.left { left: -21px; }
  .nav.right { right: -21px; }
  .tier-title {
    padding: 9px 10px;
    top: -18px;
  }
}
</style>
</head>

<body>
<main class="emoji-app">

  <!-- FREE: 15 EMOJIS -->
  <section class="tier free" data-tier="free">
    <div class="tier-title">
      ✅ Free Emojis (15) — Everyone Can Use
    </div>

    <button class="nav left" aria-label="Previous free emojis"
      onclick="moveEmojis('free', -1)">‹</button>

    <div class="emoji-grid" id="free-grid"></div>

    <button class="nav right" aria-label="Next free emojis"
      onclick="moveEmojis('free', 1)">›</button>
  </section>

  <!-- VIP LEVEL 2+: 5 EMOJIS -->
  <section class="tier vip2" data-tier="vip2">
    <div class="tier-title">
      👑 VIP 2+ (5) — Premium Access
    </div>

    <button class="nav left" aria-label="Previous VIP 2 emojis"
      onclick="moveEmojis('vip2', -1)">‹</button>

    <div class="emoji-grid" id="vip2-grid"></div>

    <button class="nav right" aria-label="Next VIP 2 emojis"
      onclick="moveEmojis('vip2', 1)">›</button>
  </section>

  <!-- VIP LEVEL 6+: 5 EMOJIS -->
  <section class="tier vip6" data-tier="vip6">
    <div class="tier-title">
      👑 VIP 6+ (5) — Exclusive Emojis
    </div>

    <button class="nav left" aria-label="Previous VIP 6 emojis"
      onclick="moveEmojis('vip6', -1)">‹</button>

    <div class="emoji-grid" id="vip6-grid"></div>

    <button class="nav right" aria-label="Next VIP 6 emojis"
      onclick="moveEmojis('vip6', 1)">›</button>
  </section>

  <div class="footer">
    ✨ 25 Custom Emojis · Free & VIP Collection ✨
  </div>
</main>

<script>
const emojiData = {
  free: [
    "😘", "😉", "🥰", "😂", "😎",
    "😍", "💞", "😴", "😜", "😡",
    "🥹", "😤", "🎧", "😊", "😭"
  ],

  vip2: [
    "🤴", "🫶", "😎", "🤔", "🥳"
  ],

  vip6: [
    "😇", "😈", "👑", "🎧", "🥷"
  ]
};

// Current position for each collection
const positions = {
  free: 0,
  vip2: 0,
  vip6: 0
};

function renderEmojis(tierName) {
  const grid = document.getElementById(tierName + "-grid");
  const emojis = emojiData[tierName];

  grid.innerHTML = "";

  // Always show the correct number of emojis
  emojis.forEach((emoji, index) => {
    const card = document.createElement("button");
    card.className = "emoji-card";
    card.type = "button";
    card.title = "Use " + emoji;
    card.setAttribute("aria-label", "Select emoji " + emoji);

    const face = document.createElement("span");
    face.className = "emoji";
    face.textContent = emoji;

    card.appendChild(face);

    card.addEventListener("click", () => {
      // Copies selected emoji for use in a project
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(emoji)
          .then(() => showMessage(card, "Copied!"))
          .catch(() => showMessage(card, emoji));
      } else {
        showMessage(card, emoji);
      }
    });

    grid.appendChild(card);
  });
}

function moveEmojis(tierName, direction) {
  const emojis = emojiData[tierName];
  const length = emojis.length;

  // Rotate collection when arrows are clicked
  positions[tierName] =
    (positions[tierName] + direction + length) % length;

  emojiData[tierName] = emojis.slice(
    direction > 0 ? 1 : length - 1
  );

  if (direction > 0) {
    emojiData[tierName].push(emojis[0]);
  } else {
    emojiData[tierName].unshift(emojis[length - 1]);
  }

  renderEmojis(tierName);
}

function showMessage(card, message) {
  const original = card.querySelector(".emoji").textContent;
  card.querySelector(".emoji").textContent = message;

  setTimeout(() => {
    card.querySelector(".emoji").textContent = original;
  }, 700);
}

// Load all 25 emojis
renderEmojis("free");
renderEmojis("vip2");
renderEmojis("vip6");
</script>
</body>
</html>
