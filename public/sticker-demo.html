<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxaChat · Animated Reactions</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 20%,#4b2b5e 0%,transparent 45%),
    radial-gradient(circle at 80% 80%,#20365c 0%,transparent 45%),
    #120d1d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:#fff;
}

.app{
  width:100%;
  max-width:430px;
  padding:22px 18px 30px;
}

header{
  text-align:center;
  margin-bottom:18px;
}

h1{
  font-size:22px;
  letter-spacing:.3px;
}

p{
  margin-top:6px;
  color:#c9b8d8;
  font-size:13px;
}

.stage{
  position:relative;
  height:310px;
  border-radius:28px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,255,255,.09),transparent 60%),
    linear-gradient(160deg,#2b1f3f,#191427);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
}

.emoji{
  font-size:118px;
  line-height:1;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.45));
  user-select:none;
}

.hidden{
  display:none;
}

/* Base pop animation */
@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  45%{transform:scale(1.12);opacity:1}
  65%{transform:scale(.98)}
  100%{transform:scale(1);opacity:1}
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  40%{transform:translateY(-12px)}
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

@keyframes rise{
  0%{transform:translateY(0) scale(.6);opacity:0}
  20%{opacity:1}
  100%{transform:translateY(-160px) scale(1.15);opacity:0}
}

@keyframes fall{
  0%{transform:translateY(-40px) scale(.7);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(230px) scale(1.1);opacity:0}
}

@keyframes fadeUp{
  0%{transform:translateY(18px);opacity:0}
  25%{opacity:1}
  100%{transform:translateY(-70px);opacity:0}
}

.pop{animation:pop .65s cubic-bezier(.2,.9,.25,1.2) both}
.float{animation:pop .6s both,float 2.4s ease-in-out .6s infinite}
.shake{animation:pop .55s both,shake .55s ease-in-out .6s 3}
.bounce{animation:pop .55s both,bounce 1.5s ease-in-out .6s 2}
.pulse{animation:pop .55s both,pulse 1.1s ease-in-out .6s 3}

.particle{
  position:absolute;
  font-size:26px;
  pointer-events:none;
  animation:rise 1.9s ease-out forwards;
}

.tear{
  position:absolute;
  font-size:22px;
  pointer-events:none;
  animation:fall 1.7s ease-in forwards;
}

.text{
  position:absolute;
  bottom:28px;
  font-size:15px;
  font-weight:700;
  color:#ffe9a8;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
  animation:fadeUp 2.4s ease-out forwards;
}

.panel{
  margin-top:18px;
  padding:16px;
  border-radius:22px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
}

.panel h2{
  font-size:14px;
  margin-bottom:12px;
  color:#e6d6f5;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

.choice{
  padding:10px 4px 8px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  transition:.18s;
}

.choice:hover{
  background:rgba(255,255,255,.16);
  transform:translateY(-2px);
}

.choice.active{
  background:linear-gradient(135deg,#8d4bd6,#c2449b);
  border-color:#ffb8e6;
  box-shadow:0 8px 20px rgba(160,60,190,.4);
}

.choice span:first-child{
  display:block;
  font-size:27px;
}

.choice span:last-child{
  display:block;
  margin-top:5px;
  font-size:9.5px;
  color:#e8dcf5;
}

.status{
  margin-top:14px;
  min-height:20px;
  text-align:center;
  font-size:13px;
  color:#d9c7ea;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.controls button{
  flex:1;
  padding:12px;
  border-radius:14px;
  font-size:14px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#7b3fd1,#c0399b);
  box-shadow:0 8px 18px rgba(120,40,180,.35);
}

.controls button:active{
  transform:scale(.97);
}

@media (prefers-reduced-motion:reduce){
  .emoji,.particle,.tear,.text{
    animation:none!important;
    opacity:1!important;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <h1>VoxaChat Reactions</h1>
    <p>Tap any reaction to preview</p>
  </header>

  <div class="stage" id="stage">
    <div class="emoji hidden" id="emoji"></div>
  </div>

  <section class="panel">
    <h2>Choose a reaction</h2>

    <div class="grid" id="grid"></div>

    <div class="status" id="status">
      Select a reaction to see the animation
    </div>

    <div class="controls">
      <button id="replay">Replay</button>
      <button id="stop">Stop</button>
    </div>
  </section>

</div>

<script>
"use strict";

const reactions=[
  {
    emoji:"😒",
    name:"Unamused",
    text:"Seriously?",
    anim:"float",
    particles:["💨","🌫️"]
  },
  {
    emoji:"🤗",
    name:"Hug",
    text:"Sending hugs!",
    anim:"pulse",
    particles:["💛","🤍","✨"]
  },
  {
    emoji:"🤔",
    name:"Thinking",
    text:"Hmm… let me think",
    anim:"float",
    particles:["💭","❓"]
  },
  {
    emoji:"😘",
    name:"Kiss",
    text:"Mwah!",
    anim:"pop",
    particles:["💋","❤️","💖"]
  },
  {
    emoji:"🥰",
    name:"Love",
    text:"So sweet!",
    anim:"pulse",
    particles:["❤️","💕","💖","✨"]
  },
  {
    emoji:"🤣",
    name:"Big Laugh",
    text:"Hahaha!",
    anim:"shake",
    particles:["😂","🤣","✨"]
  },
  {
    emoji:"🤭",
    name:"Giggle",
    text:"Hehe…",
    anim:"float",
    particles:["🤭","✨","💫"]
  },
  {
    emoji:"😂",
    name:"Laugh Cry",
    text:"Can’t stop laughing!",
    anim:"bounce",
    particles:["😂","💦","✨"]
  },
  {
    emoji:"🥹",
    name:"Touched",
    text:"That’s so sweet…",
    anim:"float",
    particles:["🥹","💧","✨"]
  },
  {
    emoji:"😭",
    name:"Crying",
    text:"I’m crying!",
    anim:"shake",
    particles:["😭","💧","💦"]
  }
];

const stage=document.getElementById("stage");
const emojiBox=document.getElementById("emoji");
const grid=document.getElementById("grid");
const statusBox=document.getElementById("status");

let current=-1;
let timer=null;

function clearStage(){
  stage.querySelectorAll(".particle,.tear,.text")
    .forEach(el=>el.remove());
}

function stop(){
  clearTimeout(timer);
  timer=null;
  current=-1;

  emojiBox.className="emoji hidden";
  emojiBox.textContent="";

  clearStage();

  document.querySelectorAll(".choice")
    .forEach(b=>b.classList.remove("active"));

  statusBox.textContent="Select a reaction to see the animation";
}

function spawnParticles(reaction){
  const symbols=reaction.particles;

  for(let i=0;i<12;i++){
    const el=document.createElement("div");

    el.className=symbols.includes("💧")?"tear":"particle";
    el.textContent=symbols[i%symbols.length];

    el.style.left=(8+Math.random()*84)+"%";
    el.style.top=(symbols.includes("💧")?"18%":"55%");

    el.style.animationDelay=(Math.random()*.8)+"s";
    el.style.fontSize=(18+Math.random()*18)+"px";

    stage.appendChild(el);

    setTimeout(()=>{
      el.remove();
    },2800);
  }
}

function play(index){
  const reaction=reactions[index];

  if(!reaction)return;

  clearTimeout(timer);
  clearStage();

  current=index;

  document.querySelectorAll(".choice")
    .forEach((button,i)=>{
      button.classList.toggle("active",i===index);
    });

  emojiBox.textContent=reaction.emoji;
  emojiBox.className="emoji "+reaction.anim;

  const text=document.createElement("div");
  text.className="text";
  text.textContent=reaction.text;

  stage.appendChild(text);
  spawnParticles(reaction);

  statusBox.textContent=reaction.name+" reaction playing…";

  timer=setTimeout(()=>{
    stop();
    statusBox.textContent="Finished — replay or choose another reaction";
  },3200);
}

reactions.forEach((reaction,index)=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="choice";

  button.innerHTML=`
    <span>${reaction.emoji}</span>
    <span>${reaction.name}</span>
  `;

  button.onclick=()=>play(index);
  grid.appendChild(button);
});

document.getElementById("replay").onclick=()=>{
  if(current>=0)play(current);
};

document.getElementById("stop").onclick=stop;
</script>

</body>
</html>
