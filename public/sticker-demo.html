<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxaChat Kiss Preview</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#151022;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:440px;
  min-height:100vh;
  margin:auto;
  padding:24px 18px;
  background:
    radial-gradient(at top left,#72465e,transparent 65%),
    #191428;
}

h1{
  font-size:20px;
  margin:0 0 10px;
}

p{
  color:#d0bfd8;
  font-size:13px;
  line-height:1.6;
}

.stage{
  height:280px;
  position:relative;
  display:grid;
  place-items:center;
}

.seat{
  width:76px;
  height:76px;
  border:2px solid #bea3bf;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#ffffff12;
  color:#dacbdd;
}

.actor{
  position:absolute;
  width:110px;
  height:110px;
  pointer-events:none;
}

.actor[hidden]{display:none}

.actor svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}

.name{
  position:absolute;
  bottom:56px;
  font-size:13px;
}

.panel{
  padding:20px;
  border-radius:20px;
  border:1px solid #ffffff20;
  background:#241c38;
  text-align:center;
}

button{
  padding:13px 24px;
  border:1px solid #ffffff30;
  border-radius:12px;
  background:#714782;
  color:white;
  cursor:pointer;
  font-size:15px;
  touch-action:manipulation;
}

button.secondary{
  background:#392a4b;
  margin-left:8px;
}

#status{
  min-height:35px;
  margin-top:18px;
  color:#efc8e7;
  font-size:13px;
}

.note{margin-top:20px}
</style>
</head>

<body>
<main class="app">
  <h1>VoxaChat · Kiss Sample</h1>

  <p>
    Wink + lips movement + ek red heart.
    Face apni jagah rahega.
  </p>

  <div class="stage">
    <div class="seat">Your DP</div>

    <div id="actor" class="actor" hidden>
      <svg
        viewBox="0 0 160 160"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <defs>
          <radialGradient id="faceColor" cx="35%" cy="28%" r="75%">
            <stop offset="0" stop-color="#ffe779"/>
            <stop offset=".65" stop-color="#ffd139"/>
            <stop offset="1" stop-color="#f3a51c"/>
          </radialGradient>

          <linearGradient id="heartColor" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff465a"/>
            <stop offset="1" stop-color="#dc143a"/>
          </linearGradient>
        </defs>

        <!-- The face does not move. -->
        <circle
          cx="72" cy="78" r="51"
          fill="url(#faceColor)"
          stroke="#e7a12c"
          stroke-width="1.5"
        />

        <!-- Soft face highlights -->
        <ellipse
          cx="52" cy="45"
          rx="20" ry="9"
          fill="#fff4b1"
          opacity=".22"
        />

        <!-- Open eye -->
        <ellipse
          cx="53" cy="68"
          rx="5" ry="8"
          fill="#583a29"
        />

        <!-- Eyebrows -->
        <path
          d="M43 52Q52 47 61 51"
          fill="none"
          stroke="#8b5829"
          stroke-width="3.5"
          stroke-linecap="round"
        />

        <path
          id="rightBrow"
          d="M83 51Q92 47 101 52"
          fill="none"
          stroke="#8b5829"
          stroke-width="3.5"
          stroke-linecap="round"
        />

        <!-- Animated eye -->
        <ellipse
          id="rightEye"
          cx="91" cy="68"
          rx="5" ry="8"
          fill="#583a29"
        />

        <path
          id="wink"
          d="M82 70Q91 62 100 70"
          fill="none"
          stroke="#583a29"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0"
        />

        <!-- Cheek blush -->
        <g id="blush" fill="#ee8e55" opacity=".25">
          <ellipse cx="40" cy="89" rx="10" ry="5"/>
          <ellipse cx="106" cy="88" rx="9" ry="5"/>
        </g>

        <!-- Mouth shape changes in JavaScript -->
        <path
          id="mouth"
          d="M64 94Q74 102 84 94"
          fill="none"
          stroke="#7a432c"
          stroke-width="3.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- One red heart, attached to the kiss cycle -->
        <g id="heart">
          <path
            d="M0 5
               C-22-8 -13-27 0-15
               C13-27 22-8 0 5Z"
            fill="url(#heartColor)"
          />
          <path
            d="M-10-14Q-13-19-7-20"
            fill="none"
            stroke="#ffb0b6"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </g>
      </svg>
    </div>

    <div class="name">Sample seat</div>
  </div>

  <section class="panel">
    <button type="button" id="play">Play Kiss</button>
    <button type="button" id="stop" class="secondary">Stop</button>

    <div id="status" role="status">
      Play Kiss dabao.
    </div>
  </section>

  <p class="note">
    Ye sirf kiss ka independent preview hai.
    Room ka purana emoji code abhi replace nahi karna.
  </p>
</main>

<script>
"use strict";

const actor=document.getElementById("actor");
const rightEye=document.getElementById("rightEye");
const wink=document.getElementById("wink");
const mouth=document.getElementById("mouth");
const blush=document.getElementById("blush");
const heart=document.getElementById("heart");
const statusBox=document.getElementById("status");

let animationFrame=0;
let startedAt=0;

const clamp=x=>Math.max(0,Math.min(1,x));

function ease(x){
  x=clamp(x);
  return x*x*(3-2*x);
}

function mix(a,b,t){
  return a+(b-a)*t;
}

function setHeart(x,y,scale,opacity){
  heart.setAttribute(
    "transform",
    `translate(${x} ${y}) scale(${scale})`
  );
  heart.setAttribute("opacity",opacity);
}

function render(seconds){
  const t=seconds%2.8;

  // Prepare kiss, hold expression, then return to normal.
  const prepare=ease(t/.45);
  const release=ease((t-1.85)/.55);
  const expression=prepare*(1-release);

  rightEye.setAttribute(
    "ry",
    Math.max(.2,8*(1-expression))
  );

  rightEye.setAttribute("opacity",1-expression);
  wink.setAttribute("opacity",expression);
  blush.setAttribute("opacity",.25+expression*.35);

  // Smoothly morph smile into puckered lips.
  const x=mix(64,79,expression);
  const y=mix(94,93,expression);
  const cx=mix(74,94,expression);
  const cy=mix(102,96,expression);
  const ex=mix(84,81,expression);
  const ey=mix(94,99,expression);

  const cx2=mix(74,94,expression);
  const cy2=mix(102,102,expression);
  const ex2=mix(64,80,expression);
  const ey2=mix(94,106,expression);

  mouth.setAttribute(
    "d",
    `M${x} ${y}
     Q${cx} ${cy} ${ex} ${ey}
     Q${cx2} ${cy2} ${ex2} ${ey2}`
  );

  if(t<.48){
    // The single heart appears beside the lips.
    const appear=ease(t/.4);
    setHeart(104,102,.48,appear);
  }else if(t<2.1){
    // That same heart flies away and fades.
    const flight=clamp((t-.48)/1.62);
    const travel=ease(flight);

    const opacity=flight<.55
      ?1
      :1-ease((flight-.55)/.45);

    setHeart(
      104+travel*37,
      102-travel*29,
      .48+travel*.32,
      opacity
    );
  }else{
    setHeart(104,102,.48,0);
  }
}

function stop(){
  cancelAnimationFrame(animationFrame);
  animationFrame=0;
  actor.hidden=true;
  statusBox.textContent="Stopped — Play Kiss dabao.";
}

function play(){
  cancelAnimationFrame(animationFrame);

  actor.hidden=false;
  startedAt=performance.now();

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  if(reduced){
    render(.48);
    statusBox.textContent=
      "Reduced-motion mode: still kiss preview.";
    return;
  }

  statusBox.textContent=
    "Kiss playing — same red heart lips se nikal raha hai.";

  function tick(now){
    const elapsed=(now-startedAt)/1000;

    if(elapsed>=8.4){
      stop();
      statusBox.textContent="Finished — dobara Play Kiss dabao.";
      return;
    }

    render(elapsed);
    animationFrame=requestAnimationFrame(tick);
  }

  animationFrame=requestAnimationFrame(tick);
}

document.getElementById("play").onclick=play;
document.getElementById("stop").onclick=stop;

// Set initial appearance before the first play.
render(0);
</script>
</body>
</html>
