<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxaChat · Party Reactions</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 30% 20%,#3d1f5c 0%,transparent 50%),
    radial-gradient(circle at 70% 80%,#1a3a5c 0%,transparent 50%),
    #120d1d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:#fff;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* Top bar */
.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}

.back{font-size:20px;cursor:pointer}

.title{
  flex:1;
  text-align:center;
  font-size:16px;
  font-weight:600;
}

/* Room stage */
.stage{
  flex:1;
  position:relative;
  overflow:hidden;
}

/* Seats */
.seats{
  position:absolute;
  bottom:110px;
  left:0;right:0;
  display:flex;
  justify-content:center;
  gap:18px;
}

.seat{
  width:64px;height:64px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.15);
  display:grid;place-items:center;
  font-size:26px;
}

.seat.active{
  border-color:#a855f7;
  box-shadow:0 0 18px rgba(168,85,247,.5);
}

/* Floating emoji */
.float-emoji{
  position:absolute;
  bottom:120px;
  font-size:64px;
  pointer-events:none;
  animation:floatUp 3.2s ease-out forwards;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));
}

@keyframes floatUp{
  0%{
    transform:translateY(0) scale(.4);
    opacity:0;
  }
  15%{
    transform:translateY(-40px) scale(1.2);
    opacity:1;
  }
  70%{
    transform:translateY(-360px) scale(1);
    opacity:1;
  }
  100%{
    transform:translateY(-520px) scale(.8);
    opacity:0;
  }
}

/* Sparkle trail */
.spark{
  position:absolute;
  font-size:16px;
  pointer-events:none;
  animation:sparkUp 1.6s ease-out forwards;
}

@keyframes sparkUp{
  0%{transform:translateY(0) scale(.5);opacity:0}
  25%{opacity:1}
  100%{transform:translateY(-120px) scale(1.2);opacity:0}
}

/* Bottom reaction bar */
.bar{
  padding:12px 10px 22px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,.08);
}

.row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px;
  scrollbar-width:none;
}

.row::-webkit-scrollbar{display:none}

.opt{
  flex:0 0 auto;
  width:52px;height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  display:grid;place-items:center;
  font-size:26px;
  cursor:pointer;
  transition:.15s;
}

.opt:hover{
  background:rgba(255,255,255,.16);
  transform:scale(1.1);
}

.opt:active{transform:scale(.92)}

/* Input bar */
.input{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:rgba(0,0,0,.35);
}

.input input{
  flex:1;
  padding:10px 16px;
  border-radius:20px;
  border:0;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:14px;
  outline:none;
}

.input .send{
  width:40px;height:40px;
  border-radius:50%;
  background:#a855f7;
  display:grid;place-items:center;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <span class="back">←</span>
    <div class="title">VoxaChat Party Room</div>
    <span>⋯</span>
  </div>

  <div class="stage" id="stage">

    <div class="seats">
      <div class="seat">🧑</div>
      <div class="seat active">🧑‍🎤</div>
      <div class="seat">🧑</div>
      <div class="seat">🧑</div>
    </div>

  </div>

  <div class="bar">
    <div class="row" id="row"></div>
  </div>

  <div class="input">
    <input placeholder="Say something…" />
    <div class="send">➤</div>
  </div>

</div>

<script>
"use strict";

const reactions=[
  "😒","🤗","🤔","😘","🥰",
  "🤣","🤭","😂","🥹","😭"
];

const stage=document.getElementById("stage");
const row=document.getElementById("row");

// Build reaction buttons
reactions.forEach(e=>{
  const b=document.createElement("div");
  b.className="opt";
  b.textContent=e;
  b.onclick=()=>floatEmoji(e);
  row.appendChild(b);
});

function floatEmoji(emoji){
  const el=document.createElement("div");
  el.className="float-emoji";
  el.textContent=emoji;

  // Random horizontal position
  el.style.left=(10+Math.random()*70)+"%";

  stage.appendChild(el);

  // Sparkle trail
  const sparks=["✨","💫","⭐"];
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const s=document.createElement("div");
      s.className="spark";
      s.textContent=sparks[i%sparks.length];
      s.style.left=(parseFloat(el.style.left)+Math.random()*10-5)+"%";
      s.style.bottom=(120+Math.random()*80)+"px";
      stage.appendChild(s);
      setTimeout(()=>s.remove(),1700);
    },i*180);
  }

  // Cleanup
  setTimeout(()=>el.remove(),3300);
}
</script>

</body>
</html>
