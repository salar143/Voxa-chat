<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxa Inbox</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 16px; padding-bottom: 90px; }
  .wrap { max-width: 480px; margin: auto; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  .card { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; width: 100%; border: none; color: inherit; text-align: left; cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
  .info { flex: 1; }
  .small { font-size: 12px; color: #94a3b8; }
  .muted { color: #94a3b8; font-size: 14px; }
  .actions { display: flex; gap: 6px; }
  button { background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
  button.alt { background: #475569; }
  input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: inherit; margin-bottom: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { flex: 1; background: #1e293b; }
  .tabs button.active { background: #3b82f6; }
  .badge { background: #ef4444; border-radius: 50%; padding: 2px 7px; font-size: 12px; }
  dialog { background: #1e293b; color: inherit; border: none; border-radius: 12px; padding: 16px; width: min(480px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .messages { max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .bubble { background: #334155; padding: 8px 12px; border-radius: 12px; max-width: 80%; align-self: flex-start; }
  .bubble.mine { background: #3b82f6; align-self: flex-end; }
  .bubble img { max-width: 100%; border-radius: 8px; }
  .caption { font-size: 13px; margin-top: 4px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; margin: 0; }
  #attachment { margin: 8px 0; }
  #attachment img { max-width: 120px; border-radius: 8px; display: block; margin-bottom: 6px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,18,.9); backdrop-filter: blur(16px); border-top: 1px solid rgba(168,85,247,.4); display: flex; justify-content: space-around; padding: 12px 0; z-index: 10; }
  .nav button { background: none; border: 0; color: #9ca3af; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .nav button.active { color: #c084fc; }
  .nav .ic { font-size: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Voxa Inbox</h1>
  <p id="myId" class="muted">Loading…</p>
  <p id="status" class="muted"></p>

  <div class="tabs">
    <button id="chatsTab" class="active">💬 Chats</button>
    <button id="contactsTab">👥 Contacts</button>
    <button id="requests">🔔 Requests <span id="badge" class="badge" hidden>0</span></button>
  </div>

  <div id="chats">
    <div id="searchSection" hidden>
      <input id="search" placeholder="User ID se search karo…">
      <div id="results"></div>
    </div>
    <div id="online"></div>
  </div>

  <div id="contacts" hidden></div>
</div>
<dialog id="listModal">
  <h2 id="listTitle"></h2>
  <div id="listBody" style="margin:12px 0"></div>
  <button data-close="listModal">Close</button>
</dialog>

<dialog id="chatModal">
  <h2 id="chatTitle"></h2>
  <p id="chatNote" class="muted"></p>
  <div id="messages" class="messages"></div>
  <div id="attachment" hidden>
    <img id="previewImage" alt="preview">
    <button id="removePhoto" class="alt">Remove photo</button>
  </div>
  <form id="sendForm">
    <div class="row">
      <button type="button" id="photoButton">📷</button>
      <input id="message" placeholder="Message likho…" autocomplete="off">
      <button type="submit" id="sendButton">Send</button>
    </div>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
  </form>
  <button data-close="chatModal" class="alt" style="margin-top:8px">Close chat</button>
</dialog>

<dialog id="callModal">
  <h2>Call</h2>
  <p id="callState" class="muted">Ringing…</p>
  <div class="row" style="margin-top:12px">
    <button id="acceptCall">Accept</button>
    <button id="muteCall" class="alt">Mute</button>
    <button id="endCall" class="alt">End</button>
  </div>
</dialog>

<div class="nav">
  <button onclick="location.href='homefile3.html'"><span class="ic">🏠</span>Home</button>
  <button onclick="alert('Party Room ban raha hai!')"><span class="ic">🎉</span>Party</button>
  <button class="active"><span class="ic">📥</span>Inbox</button>
  <button onclick="location.href='profile2.html'"><span class="ic">👤</span>Profile</button>
</div>

<script>
 const SUPABASE_URL = 'https://mblcbygpqbogmtzacbtz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibGNieWdwcWJvZ210emFjYnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDg0OTIsImV4cCI6MjEwODE4NDQ5Mn0.7OpmnIoZKgGLTCj2gPZtNiZyXkgYPgrdyocbCkG6-Cg';

const $ = id => document.getElementById(id);

let sb;
let me;
let peer = null;
let tab = 'chats';
let selectedPhoto = null;
let previewURL = null;
let sending = false;
let searchTimer;

const photoCache = new Map();

function report(error) {
  const text = error?.message || String(error || '');
  $('status').textContent = text;
  $('chatNote').textContent = text;
}

function check(result) {
  if (result.error) throw result.error;
  return result.data;
}

async function run(fn) {
  try {
    report('');
    await fn();
  } catch (error) {
    report(error);
  }
}

function empty(box, text) {
  const p = document.createElement('p');
  p.className = 'muted';
  p.textContent = text;
  box.replaceChildren(p);
}

function button(text, fn, alt = false) {
  const b = document.createElement('button');
  b.textContent = text;
  if (alt) b.className = 'alt';
  b.onclick = async () => {
    b.disabled = true;
    await run(fn);
    if (b.isConnected) b.disabled = false;
  };
  return b;
}

function card(person, online = false) {
  const row = document.createElement('div');
  row.className = 'card';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = Array.from(person.name || 'U')[0].toUpperCase();
  const info = document.createElement('div');
  info.className = 'info';
  const name = document.createElement('div');
  name.textContent = person.name;
  const sub = document.createElement('div');
  sub.className = 'small';
  sub.textContent = (online ? '🟢 Online · ' : '') + 'ID: ' + person.user_number;
  const actions = document.createElement('div');
  actions.className = 'actions';
  info.append(name, sub, actions);
  row.append(avatar, info);
  return { row, actions };
}

async function people(ids) {
  ids = [...new Set(ids)];
  if (!ids.length) return [];
  return check(await sb.from('vc_people').select('id,name,user_number').in('id', ids));
}

async function heartbeat() {
  check(await sb.from('vc_people').update({ last_seen: new Date().toISOString() }).eq('id', me.id));
}

async function loadOnline() {
  const rows = check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .neq('id', me.id)
      .gte('last_seen', new Date(Date.now() - 90000).toISOString())
      .order('last_seen', { ascending: false })
      .limit(100)
  );
  $('online').replaceChildren();
  if (!rows.length) {
    empty($('online'), 'Abhi koi doosra user online nahi hai.');
    return;
  }
  for (const person of rows) {
    const c = card(person, true);
    c.actions.append(button('Chat', () => openChat(person)));
    $('online').append(c.row);
  }
}

async function loadBadge() {
  const result = await sb.from('vc_requests')
    .select('id', { count: 'exact', head: true })
    .eq('receiver_id', me.id)
    .eq('status', 'pending');
  check(result);
  $('badge').textContent = result.count || 0;
  $('badge').hidden = !result.count;
}

async function searchUser() {
  const q = $('search').value.trim();
  const box = $('results');
  $('searchSection').hidden = !q;
  box.replaceChildren();
  if (!q) return;
  if (!/^\d{1,15}$/.test(q)) {
    empty(box, 'Poora numeric User ID enter karo.');
    return;
  }
  const person = check(
    await sb.from('vc_people').select('id,name,user_number').eq('user_number', q).maybeSingle()
  );
  if (!person) {
    empty(box, 'Koi user nahi mila.');
    return;
  }
  if (person.id === me.id) {
    empty(box, 'Ye aapki apni ID hai.');
    return;
  }
  const c = card(person);
  c.actions.append(button('Chat', () => openChat(person)));
  c.actions.append(
    button('Add Friend', async () => {
      check(await sb.from('vc_requests').insert({ sender_id: me.id, receiver_id: person.id }));
      await searchUser();
    })
  );
  box.replaceChildren(c.row);
}

function showList(title) {
  $('listTitle').textContent = title;
  empty($('listBody'), 'Loading…');
  if (!$('listModal').open) $('listModal').showModal();
}

async function showRequests() {
  showList('Friend Requests');
  const rows = check(
    await sb.from('vc_requests')
      .select('*')
      .eq('receiver_id', me.id)
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
  );
  const map = new Map((await people(rows.map(r => r.sender_id))).map(p => [p.id, p]));
  const box = $('listBody');
  box.replaceChildren();
  if (!rows.length) {
    empty(box, 'Abhi koi friend request nahi hai.');
    return;
  }
  for (const request of rows) {
    const person = map.get(request.sender_id);
    if (!person) continue;
    const c = card(person);
    const answer = async status => {
      check(await sb.from('vc_requests').update({ status }).eq('id', request.id).eq('status', 'pending'));
      await showRequests();
      await loadBadge();
    };
    c.actions.append(
      button('Accept', () => answer('accepted')),
      button('Reject', () => answer('rejected'), true)
    );
    box.append(c.row);
  }
}

async function showCategory(name) {
  showList(name);
  if (name === 'Family' || name === 'Family group') {
    empty($('listBody'), name + ' abhi available nahi hai.');
    return;
  }
  const followers = name === 'Followers';
  const rows = check(
    await sb.from('vc_follows')
      .select(followers ? 'follower_id' : 'following_id')
      .eq(followers ? 'following_id' : 'follower_id', me.id)
  );
  const ids = rows.map(r => followers ? r.follower_id : r.following_id);
  const peopleRows = await people(ids);
  const box = $('listBody');
  box.replaceChildren();
  if (!peopleRows.length) {
    empty(box, 'Abhi list khaali hai.');
    return;
  }
  for (const person of peopleRows) {
    const c = card(person);
    c.actions.append(button('Chat', () => openChat(person)));
    box.append(c.row);
  }
}

for (const [icon, name] of [['👥', 'Friends'], ['👤', 'Followers'], ['⭐', 'Following']]) {
  const b = document.createElement('button');
  b.className = 'card';
  b.textContent = icon + '　' + name + '　›';
  b.onclick = () => run(() => showCategory(name));
  $('contacts').append(b);
}

function switchTab(value) {
  tab = value;
  $('chats').hidden = value !== 'chats';
  $('contacts').hidden = value !== 'contacts';
  $('chatsTab').classList.toggle('active', value === 'chats');
  $('contactsTab').classList.toggle('active', value === 'contacts');
}

function clearPhoto() {
  if (previewURL) URL.revokeObjectURL(previewURL);
  previewURL = null;
  selectedPhoto = null;
  $('file').value = '';
  $('previewImage').removeAttribute('src');
  $('attachment').hidden = true;
}

async function openChat(person) {
  if (sending) return;
  clearPhoto();
  $('message').value = '';
  peer = person;
  $('chatTitle').textContent = person.name + ' · ID ' + person.user_number;
  $('messages').replaceChildren();
  if ($('listModal').open) $('listModal').close();
  if (!$('chatModal').open) $('chatModal').showModal();
  await loadMessages();
}

async function photoURL(path) {
  const old = photoCache.get(path);
  if (old && old.expiry > Date.now()) return old.url;
  const data = check(await sb.storage.from('vc-chat-images').createSignedUrl(path, 3600));
  photoCache.set(path, { url: data.signedUrl, expiry: Date.now() + 3300000 });
  return data.signedUrl;
}

async function loadMessages() {
  if (!peer || !$('chatModal').open) return;
  const target = peer.id;
  const rows = check(
    await sb.from('vc_messages')
      .select('id,sender_id,content,image_path,created_at')
      .or(`and(sender_id.eq.${me.id},receiver_id.eq.${target}),and(sender_id.eq.${target},receiver_id.eq.${me.id})`)
      .order('created_at', { ascending: true })
      .limit(100)
  );
  const box = $('messages');
  box.replaceChildren();
  if (!rows.length) {
    empty(box, 'Pehla message ya photo bhejo.');
    return;
  }
  for (const message of rows) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (message.sender_id === me.id ? ' mine' : '');
    if (message.image_path) {
      try {
        const url = await photoURL(message.image_path);
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Chat photo';
        bubble.append(img);
      } catch (error) {
        bubble.textContent = 'Photo load nahi hui.';
      }
      if (message.content !== '[Photo]') {
        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.textContent = message.content;
        bubble.append(caption);
      }
    } else {
      bubble.textContent = message.content;
    }
    box.append(bubble);
  }
  box.scrollTop = box.scrollHeight;
}

$('sendForm').onsubmit = async event => {
  event.preventDefault();
  const target = peer;
  const text = $('message').value.trim();
  const file = selectedPhoto;
  if (!target || sending || (!text && !file)) return;
  sending = true;
  $('sendButton').disabled = true;
  let path = null;
  try {
    if (file) {
      const extension = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[file.type];
      path = me.id + '/' + target.id + '/' + crypto.randomUUID() + '.' + extension;
      check(await sb.storage.from('vc-chat-images').upload(path, file, { contentType: file.type, upsert: false }));
    }
    check(await sb.from('vc_messages').insert({
      sender_id: me.id,
      receiver_id: target.id,
      content: text || '[Photo]',
      image_path: path
    }));
    clearPhoto();
    $('message').value = '';
    await loadMessages();
  } catch (error) {
    report(error);
  } finally {
    sending = false;
    $('sendButton').disabled = false;
  }
};

$('photoButton').onclick = () => $('file').click();

$('file').onchange = () => {
  const file = $('file').files[0];
  if (!file) return;
  selectedPhoto = file;
  previewURL = URL.createObjectURL(file);
  $('previewImage').src = previewURL;
  $('attachment').hidden = false;
};

$('removePhoto').onclick = clearPhoto;

$('chatsTab').onclick = () => switchTab('chats');
$('contactsTab').onclick = () => switchTab('contacts');
$('requests').onclick = () => run(showRequests);

$('search').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => run(searchUser), 400);
};

document.querySelectorAll('[data-close]').forEach(button => {
  button.onclick = () => {
    const id = button.dataset.close;
    $(id).close();
    if (id === 'chatModal') {
      peer = null;
      clearPhoto();
    }
  };
});

$('acceptCall').onclick = () => { $('callState').textContent = 'Call connected (basic mode).'; };
$('muteCall').onclick = () => { $('callState').textContent = 'Muted.'; };
$('endCall').onclick = () => { $('callState').textContent = 'Call ended.'; $('callModal').close(); };

async function start() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession();
  const user = data.session?.user;
  if (!user) {
    $('myId').textContent = 'Pehle login karo.';
    return;
  }
  me = user;
  const profile = check(
    await sb.from('vc_people').select('id,name,user_number').eq('id', me.id).maybeSingle()
  );
  if (profile) {
    $('myId').textContent = 'My ID: ' + profile.user_number;
  }
  await heartbeat();
  await loadOnline();
  await loadBadge();
  setInterval(() => run(heartbeat), 30000);
  setInterval(() => run(loadOnline), 30000);
  sb.channel('inbox-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'vc_messages' }, () => {
      run(loadOnline);
      if (peer) run(loadMessages);
    })
    .subscribe();
}

start();
</script>
</body>
</html>
