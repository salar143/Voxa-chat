<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Voxa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.tabs button{background:none;border:none;color:#94a3b8;padding:6px}
.tabs button.active{color:#3b82f6;font-weight:bold}
.tabs input{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}
.card{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.actions button{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer}
h3{margin:14px 0 8px}
</style>
</head>
<body>
<div class="tabs">
<button id="chatsTab" class="active">Chat</button>
<button id="contactsTab">Contacts</button>
<input id="idSearch" placeholder="🔍 Search ID">
<button id="addFriend">👤+</button>
</div>
<div id="chats">
<h3>🆕 New Friend Requests</h3><div id="reqList"></div>
<h3>👥 All Users</h3><div id="allUsers"></div>
<h3>🔥 Online Rooms</h3><div id="rooms"></div>
<h3>✨ Recommended Users</h3><div id="recommended"></div>
<h3>Online users…</h3><div id="online"></div>
</div>
<div id="contacts" hidden>
<h3>Family group</h3><div id="famGroup"></div>
<h3>Friends</h3><div id="friends"></div>
<h3>Followers</h3><div id="followers"></div>
<h3>Following</h3><div id="following"></div>
<h3>Family</h3><div id="family"></div>
</div>
<script>const sb=supabase.createClient('https://mblcbygpqbgomtzacbtz.supabase.co','sb_publishable_d0jKzXs_b-tBVzhusjYKJw_ZdPkMxdV');
const $=id=>document.getElementById(id);
let me=null;
sb.auth.getUser().then(({data})=>{me=data.user;if(!me)location.href='/';else loadAll();});
async function loadAll(){loadRooms();loadUsers();loadRecommended();}
function loadRooms(){
$('rooms').innerHTML=['General Room','Gaming Room','Music Room']
.map(r=>`<div class="card">${r}<button onclick="joinRoom('${r}')">Join</button></div>`).join('');}
function joinRoom(n){alert('Joining '+n);}
async function loadUsers(){
const{data}=await sb.from('profiles').select('*').neq('id',me.id).limit(10);
$('allUsers').innerHTML=(data||[]).map(u=>`<div class="card">${u.username}<button onclick="openChat('${u.id}')">Chat</button></div>`).join('');}
async function loadRecommended(){
const{data}=await sb.from('profiles').select('*').neq('id',me.id).limit(5);
$('recommended').innerHTML=(data||[]).map(u=>`<div class="card">${u.username} 🟢<button onclick="openChat('${u.id}')">Chat</button></div>`).join('');}
function openChat(id){alert('Chat: '+id);}
</script>
</body>
</html>
