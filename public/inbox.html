<script>
// Supabase project details
const SUPABASE_URL = 'https://mblcbygpqbgomtzacbtz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_d0jKzXs_b-tBVzhusjYKJw_ZdPkMxdV';

const $ = id => document.getElementById(id);

let sb;
let me;
let peer = null;
let tab = 'chats';
let selectedPhoto = null;
let previewURL = null;
let sending = false;
let searchTimer;

const photoCache = new Map();

function report(error) {
  const text = error?.message || String(error || '');
  $('status').textContent = text;
  $('chatNote').textContent = text;
}

function check(result) {
  if (result.error) throw result.error;
  return result.data;
}

async function run(fn) {
  try {
    report('');
    await fn();
  } catch (error) {
    report(error);
  }
}

function empty(box, text) {
  const p = document.createElement('p');
  p.className = 'muted';
  p.textContent = text;
  box.replaceChildren(p);
}

function button(text, fn, alt = false) {
  const b = document.createElement('button');
  b.textContent = text;
  if (alt) b.className = 'alt';

  b.onclick = async () => {
    b.disabled = true;
    await run(fn);
    if (b.isConnected) b.disabled = false;
  };

  return b;
}

function card(person, online = false) {
  const row = document.createElement('div');
  row.className = 'card';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = Array.from(person.name || 'U')[0].toUpperCase();

  const info = document.createElement('div');
  info.className = 'info';

  const name = document.createElement('div');
  name.textContent = person.name;

  const sub = document.createElement('div');
  sub.className = 'small';
  sub.textContent =
    (online ? '🟢 Online · ' : '') +
    'ID: ' + person.user_number;

  const actions = document.createElement('div');
  actions.className = 'actions';

  info.append(name, sub, actions);
  row.append(avatar, info);

  return { row, actions };
}

async function people(ids) {
  ids = [...new Set(ids)];
  if (!ids.length) return [];

  return check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .in('id', ids)
  );
}

async function heartbeat() {
  check(
    await sb.from('vc_people')
      .update({ last_seen: new Date().toISOString() })
      .eq('id', me.id)
  );
}

async function loadOnline() {
  const rows = check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .neq('id', me.id)
      .gte('last_seen', new Date(Date.now() - 90000).toISOString())
      .order('last_seen', { ascending: false })
      .limit(100)
  );

  $('online').replaceChildren();

  if (!rows.length) {
    empty($('online'), 'Abhi koi doosra user online nahi hai.');
    return;
  }

  for (const person of rows) {
    const c = card(person, true);
    c.actions.append(button('Chat', () => openChat(person)));
    $('online').append(c.row);
  }
}

async function loadBadge() {
  const result = await sb.from('vc_requests')
    .select('id', { count: 'exact', head: true })
    .eq('receiver_id', me.id)
    .eq('status', 'pending');

  check(result);

  $('badge').textContent = result.count || 0;
  $('badge').hidden = !result.count;
}

async function searchUser() {
  const q = $('search').value.trim();
  const box = $('results');

  $('searchSection').hidden = !q;
  box.replaceChildren();

  if (!q) return;

  if (!/^\d{1,15}$/.test(q)) {
    empty(box, 'Poora numeric User ID enter karo.');
    return;
  }

  const person = check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .eq('user_number', q)
      .maybeSingle()
  );

  if (!person) {
    empty(box, 'Koi user nahi mila.');
    return;
  }

  if (person.id === me.id) {
    empty(box, 'Ye aapki apni ID hai.');
    return;
  }

  const c = card(person);
  c.actions.append(button('Chat', () => openChat(person)));

  c.actions.append(
    button('Add Friend', async () => {
      check(
        await sb.from('vc_requests').insert({
          sender_id: me.id,
          receiver_id: person.id
        })
      );

      await searchUser();
    })
  );

  box.replaceChildren(c.row);
}

function showList(title) {
  $('listTitle').textContent = title;
  empty($('listBody'), 'Loading…');

  if (!$('listModal').open) {
    $('listModal').showModal();
  }
}

async function showRequests() {
  showList('Friend Requests');

  const rows = check(
    await sb.from('vc_requests')
      .select('*')
      .eq('receiver_id', me.id)
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
  );

  const map = new Map(
    (await people(rows.map(r => r.sender_id)))
      .map(p => [p.id, p])
  );

  const box = $('listBody');
  box.replaceChildren();

  if (!rows.length) {
    empty(box, 'Abhi koi friend request nahi hai.');
    return;
  }

  for (const request of rows) {
    const person = map.get(request.sender_id);
    if (!person) continue;

    const c = card(person);

    const answer = async status => {
      check(
        await sb.from('vc_requests')
          .update({ status })
          .eq('id', request.id)
          .eq('status', 'pending')
      );

      await showRequests();
      await loadBadge();
    };

    c.actions.append(
      button('Accept', () => answer('accepted')),
      button('Reject', () => answer('rejected'), true)
    );

    box.append(c.row);
  }
}

async function showCategory(name) {
  showList(name);

  if (name === 'Family' || name === 'Family group') {
    empty($('listBody'), name + ' abhi available nahi hai.');
    return;
  }

  const followers = name === 'Followers';

  const rows = check(
    await sb.from('vc_follows')
      .select(followers ? 'follower_id' : 'following_id')
      .eq(followers ? 'following_id' : 'follower_id', me.id)
  );

  const ids = rows.map(r =>
    followers ? r.follower_id : r.following_id
  );

  const peopleRows = await people(ids);
  const box = $('listBody');
  box.replaceChildren();

  if (!peopleRows.length) {
    empty(box, 'Abhi list khaali hai.');
    return;
  }

  for (const person of peopleRows) {
    const c = card(person);
    c.actions.append(button('Chat', () => openChat(person)));
    box.append(c.row);
  }
}

for (const [icon, name] of [
  ['👥', 'Friends'],
  ['👤', 'Followers'],
  ['⭐', 'Following']
]) {
  const b = document.createElement('button');
  b.className = 'card';
  b.textContent = icon + '　' + name + '　›';
  b.onclick = () => run(() => showCategory(name));
  $('contacts').append(b);
}

function switchTab(value) {
  tab = value;

  $('chats').hidden = value !== 'chats';
  $('contacts').hidden = value !== 'contacts';

  $('chatsTab').classList.toggle('active', value === 'chats');
  $('contactsTab').classList.toggle('active', value === 'contacts');
}

function clearPhoto() {
  if (previewURL) URL.revokeObjectURL(previewURL);

  previewURL = null;
  selectedPhoto = null;

  $('file').value = '';
  $('previewImage').removeAttribute('src');
  $('attachment').hidden = true;
}

async function openChat(person) {
  if (sending) return;

  clearPhoto();
  $('message').value = '';

  peer = person;

  $('chatTitle').textContent =
    person.name + ' · ID ' + person.user_number;

  $('messages').replaceChildren();

  if ($('listModal').open) $('listModal').close();

  if (!$('chatModal').open) $('chatModal').showModal();

  await loadMessages();
}

async function photoURL(path) {
  const old = photoCache.get(path);

  if (old && old.expiry > Date.now()) return old.url;

  const data = check(
    await sb.storage.from('vc-chat-images')
      .createSignedUrl(path, 3600)
  );

  photoCache.set(path, {
    url: data.signedUrl,
    expiry: Date.now() + 3300000
  });

  return data.signedUrl;
}

async function loadMessages() {
  if (!peer || !$('chatModal').open) return;

  const target = peer.id;

  const rows = check(
    await sb.from('vc_messages')
      .select('id,sender_id,content,image_path,created_at')
      .or(
        `and(sender_id.eq.${me.id},receiver_id.eq.${target}),` +
        `and(sender_id.eq.${target},receiver_id.eq.${me.id})`
      )
      .order('created_at', { ascending: true })
      .limit(100)
  );

  const box = $('messages');
  box.replaceChildren();

  if (!rows.length) {
    empty(box, 'Pehla message ya photo bhejo.');
    return;
  }

  for (const message of rows) {
    const bubble = document.createElement('div');
    bubble.className =
      'bubble' + (message.sender_id === me.id ? ' mine' : '');

    if (message.image_path) {
      try {
        const url = await photoURL(message.image_path);

        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Chat photo';

        bubble.append(img);
      } catch (error) {
        bubble.textContent = 'Photo load nahi hui.';
      }

      if (message.content !== '[Photo]') {
        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.textContent = message.content;
        bubble.append(caption);
      }
    } else {
      bubble.textContent = message.content;
    }

    box.append(bubble);
  }

  box.scrollTop = box.scrollHeight;
}

$('sendForm').onsubmit = async event => {
  event.preventDefault();

  const target = peer;
  const text = $('message').value.trim();
  const file = selectedPhoto;

  if (!target || sending || (!text && !file)) return;

  sending = true;
  $('sendButton').disabled = true;

  let path = null;

  try {
    if (file) {
      const extension = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp'
      }[file.type];

      path =
        me.id + '/' + target.id + '/' +
        crypto.randomUUID() + '.' + extension;

      check(
        await sb.storage.from('vc-chat-images')
          .upload(path, file, {
            contentType: file.type,
            upsert: false
          })
      );
    }

    check(
      await sb.from('vc_messages').insert({
        sender_id: me.id,
        receiver_id: target.id,
        content: text || '[Photo]',
        image_path: path
      })
    );

    clearPhoto();
    $('message').value = '';
    await loadMessages();

  } catch (error) {
    report(error);
  } finally {
    sending = false;
    $('sendButton').disabled = false;
  }
};

$('photoButton').onclick = () => $('file').click();

$('file').onchange = () => {
  const file = $('file').files[0];
  if (!file) return;

  selectedPhoto = file;
  previewURL = URL.createObjectURL(file);

  $('previewImage').src = previewURL;
  $('attachment').hidden = false;
};

$('removePhoto').onclick = clearPhoto;

$('chatsTab').onclick = () => switchTab('chats');
$('contactsTab').onclick = () => switchTab('contacts');

$('requests').onclick = () => run(showRequests);

$('search').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => run(searchUser), 400);
};

document.querySelectorAll('[data-close]').forEach(button => {
  button.onclick = () => {
    const id = button.dataset.close;
    $(id).close();

    if (id === 'chatModal') {
      peer = null;
      clearPhoto();
    }
  };
});

$('acceptCall').onclick = () => {
  $('callState').textContent = 'Call connected (basic mode).';
};

$('muteCall').onclick = () => {
  $('callState').textContent = 'Muted.';
};

$('endCall').onclick = () => {
  $('callState').textContent = 'Call ended.';
  $('callModal').close();
};

async function start() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data } = await sb.auth.getSession();
  const user = data.session?.user;

  if (!user) {
    $('myId').textContent = 'Pehle login karo.';
    return;
  }

  me = user;

  const profile = check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .eq('id', me.id)
      .maybeSingle()
  );

  if (profile) {
    $('myId').textContent = 'My ID: ' + profile.user_number;
  }

  await heartbeat();
  await loadOnline();
  await loadBadge();

  setInterval(() => run(heartbeat), 30000);
  setInterval(() => run(loadOnline), 30000);

  const channel = sb
    .channel('inbox-realtime')
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'vc_messages'
      },
      () => {
        run(loadOnline);
        if (peer) run(loadMessages);
      }
    )
    .subscribe();
}

start();
</script>.
