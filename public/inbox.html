<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxa Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit}
button svg{pointer-events:none}
body{background:#0B0816;color:#e9d5ff;font-family:system-ui,sans-serif;padding-bottom:90px}
svg{display:inline-block;vertical-align:middle}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.header{position:sticky;top:0;background:#19142E;z-index:10;padding:12px 14px 0;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.tabs{display:flex;gap:14px;align-items:center}
.tab{background:none;border:none;font-size:15px;color:#a78bfa;cursor:pointer;padding:8px 0;position:relative}
.tab.active{color:#fff;font-weight:700}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:#7C4DFF}
.search{flex:1;display:flex;align-items:center;gap:6px;background:#241C3F;border-radius:20px;padding:8px 10px;max-width:170px;border:1px solid #3a2a5e}
.search input{border:none;background:none;outline:none;font-size:13px;color:#e9d5ff;width:100%}
.add-btn{background:#7C4DFF;color:#fff;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.features{display:flex;gap:10px;overflow-x:auto;padding:12px 0 4px}
.feature{min-width:92px;height:80px;border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .2s;border:1px solid rgba(255,255,255,.1)}
.feature:active{transform:scale(.95)}
.feature svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.feature .nm{font-size:11px;font-weight:700;margin-top:4px;pointer-events:none}
.f-voice{background:linear-gradient(135deg,#FFEA00,#E6C300);color:#0B0816;box-shadow:0 0 15px rgba(255,234,0,.3)}
.f-truth{background:linear-gradient(135deg,#00B0FF,#0081CB);color:#fff;box-shadow:0 0 15px rgba(0,176,255,.3)}
.f-ludo{background:linear-gradient(135deg,#FF007F,#C70059);color:#fff;box-shadow:0 0 15px rgba(255,0,127,.3)}
.f-domino{background:linear-gradient(135deg,#00E676,#00B252);color:#0B0816;box-shadow:0 0 15px rgba(0,230,118,.3)}
.section-title{font-size:13px;font-weight:700;margin:14px 0 8px;color:#c4b5fd;display:flex;align-items:center;gap:6px}
.bubbles{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.bubble{min-width:64px;text-align:center;cursor:pointer}
.ring{width:56px;height:56px;border-radius:50%;background:#251E44;border:2px solid #3a2a5e;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;margin:0 auto;position:relative}
.dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#00E676;border:2px solid #19142E;box-shadow:0 0 8px #00E676}
.live-badge{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#00B0FF,#00E5FF);color:#fff;font-size:9px;font-weight:800;border-radius:10px;padding:2px 6px;display:flex;align-items:center;gap:3px;white-space:nowrap;box-shadow:0 0 10px rgba(0,229,255,.4);cursor:pointer}
.live-badge i{width:6px;height:6px;border-radius:50%;background:#FF1744;display:inline-block}
.bubble-name{font-size:11px;color:#a78bfa;margin-top:5px}
.chatlist-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px}
.chatlist-head h3{font-size:15px;color:#fff}
.filter{background:#241C3F;border:1px solid #3a2a5e;border-radius:16px;padding:5px 10px;font-size:12px;color:#a78bfa;cursor:pointer}
.conv-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:10px}
.conv-actions{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:0 10px;background:#19142E}
.conv-actions button{border:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12px;font-weight:700}
.pin-btn{background:#facc15;color:#0B0816}
.del-btn{background:#FF2A54;color:#fff}
.conv{display:flex;align-items:center;gap:12px;background:#19142E;border:1px solid #251E44;border-radius:14px;padding:12px;cursor:pointer;position:relative;transition:transform .2s}
.conv-main{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#251E44;border:2px solid #3a2a5e;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0;position:relative}
.c-info{flex:1}
.c-name{font-size:15px;font-weight:500;color:#fff}
.c-preview{font-size:12px;color:#8E8A9F;margin-top:2px}
.c-right{text-align:right}
.c-time{font-size:11px;color:#a78bfa}
.unread{min-width:18px;height:18px;background:#FF2A54;color:#fff;font-size:10px;font-weight:800;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 6px #FF2A54}
.teleport-btn{background:linear-gradient(90deg,#00B0FF,#00E5FF);color:#fff;font-size:11px;font-weight:800;padding:6px 12px;border-radius:20px;border:none;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.4);display:flex;align-items:center;gap:5px}
.teleport-btn i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.empty{margin:30px 14px;text-align:center;color:#a78bfa;font-size:13px;background:#19142E;border-radius:14px;padding:24px 14px}
.contacts-view{padding:6px 14px}
.acc{background:#19142E;border:1px solid #3a2a5e;border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.acc-head .nm{flex:1;font-size:14px;font-weight:600;color:#fff}
.acc-head .ar{color:#a78bfa}
.acc-body{max-height:0;transition:max-height .3s ease;overflow:hidden}
.acc.open .acc-body{max-height:400px}
.acc-body .u{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;position:relative}
.acc-body .u:hover{background:#241C3F}
.acc-body .u .av{width:34px;height:34px;border-radius:50%;background:#251E44;border:2px solid #3a2a5e;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;position:relative}
.teleport-banner{height:36px;background:#7C4DFF;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer;user-select:none;overflow:hidden}
.teleport-banner .left{display:flex;align-items:center;gap:8px;overflow:hidden;flex:1}
.teleport-banner svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;animation:bounce 1s infinite;pointer-events:none}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.teleport-banner marquee{color:#fff;font-size:13px;font-weight:500}
.teleport-banner .arrow{color:#fff;font-weight:800}
.chat-screen{position:fixed;inset:0;background:#0B0816;display:flex;flex-direction:column;z-index:30}
.chat-head{background:#19142E;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.chat-head .row{display:flex;align-items:center;gap:10px;padding:12px}
.back{background:none;border:none;font-size:20px;cursor:pointer;color:#c4b5fd}
.title{flex:1}
.title .nm{font-size:15px;font-weight:700;color:#fff;cursor:pointer}
.title .lv{font-size:11px;color:#a78bfa}
.menu{background:none;border:none;font-size:18px;cursor:pointer;color:#a78bfa}
#messages{flex:1;overflow-y:auto;padding:12px 0;min-height:0}
.time-sep{text-align:center;font-size:11px;color:#a78bfa;margin:10px 0}
.msg{display:flex;gap:8px;margin-bottom:6px;align-items:flex-end;position:relative}
.msg .avatar{width:32px;height:32px;font-size:13px}
.bubble{max-width:72%;background:#241C3F;border:1px solid #3a2a5e;padding:10px 12px;border-radius:14px;font-size:14px;color:#e9d5ff}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:#7C4DFF;color:#fff}
.read{font-size:10px;color:#a78bfa;text-align:right;margin-top:3px}
.sticker-anim{max-width:120px;max-height:120px;background:none;border:none;box-shadow:none}
.msg-img{max-width:200px;border-radius:10px;display:block}
.msg-del{background:none;border:none;color:#a78bfa;font-size:11px;cursor:pointer;margin-top:2px;padding:0}
.room-share-card{max-width:260px;background:#19142E;border:1px solid #3a2a5e;border-radius:14px;overflow:hidden}
.room-share-card .img{height:100px;background:linear-gradient(135deg,#7C4DFF,#a855f7);display:flex;align-items:center;justify-content:center}
.room-share-card .img svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2;pointer-events:none}
.room-share-card .body{padding:10px}
.room-share-card .t{font-weight:700;color:#fff;font-size:13px}
.room-share-card .tag{font-size:10px;color:#a78bfa;margin:4px 0}
.room-share-card .badge{font-size:9px;background:#2f2547;color:#c4b5fd;border-radius:6px;padding:2px 6px;display:inline-block;margin-right:4px}
.room-share-card button{width:100%;background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:8px;font-weight:700;cursor:pointer;margin-top:8px}
.chat-input{display:flex;gap:8px;align-items:center;padding:10px 0}
.attach,.emoji-btn,.send-btn{background:#241C3F;border:1px solid #3a2a5e;border-radius:50%;width:38px;height:38px;cursor:pointer;color:#c4b5fd;display:flex;align-items:center;justify-content:center}
.send-btn{background:#7C4DFF;color:#fff}
.chat-input svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.chat-input input{flex:1;border:1px solid #3a2a5e;border-radius:20px;padding:11px 14px;font-size:14px;outline:none;background:#241C3F;color:#e9d5ff}
.chat-tools{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid #1F1B35;background:#0E0B1E;position:relative;z-index:5}
.tool{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8E8A9F;flex:1;transition:color .2s}
.tool:active{color:#7C4DFF}
.tool svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tool .lb{font-size:11px;font-weight:500;pointer-events:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:#19142E;border-top:1px solid #3a2a5e;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
.nav button{background:none;border:0;color:#a78bfa;font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.active{color:#c4b5fd;font-weight:700}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.hidden{display:none!important}
.float-card{position:fixed;top:70px;left:14px;right:14px;background:#241C3F;border:1px solid #7C4DFF;border-radius:14px;padding:12px;z-index:40;display:flex;flex-direction:column;gap:4px}
.float-card .nm{flex:1;font-weight:700;color:#fff}
.float-card button{background:#7C4DFF;color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:300px;left:50%;transform:translateX(-50%);background:#7C4DFF;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:70}
.kb{position:fixed;bottom:90px;left:0;right:0;height:280px;background:#19142E;border-top:1px solid #3a2a5e;z-index:35;display:flex;flex-direction:column}
.kb-tabs{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid #3a2a5e}
.kb-tabs button{background:#241C3F;border:1px solid #3a2a5e;color:#a78bfa;border-radius:16px;padding:6px 14px;cursor:pointer;font-size:12px}
.kb-tabs button.active{background:#7C4DFF;color:#fff;font-weight:700}
.kb-body{flex:1;overflow-y:auto;padding:10px 14px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:24px;text-align:center}
.emoji-grid span{cursor:pointer;padding:4px;border-radius:8px}
.emoji-grid span:hover{background:#241C3F}
.sticker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sticker-grid .st{cursor:pointer;border-radius:12px;overflow:hidden;background:#241C3F}
.sticker-grid .st img{width:100%;display:block}
.kb-plus{position:absolute;bottom:12px;left:14px;background:#7C4DFF;color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.kb-foot{padding:10px 14px 10px 64px;position:relative;border-top:1px solid #3a2a5e}
.store-modal{position:fixed;inset:0;background:#0B0816;z-index:60;display:flex;flex-direction:column}
.store-head{display:flex;align-items:center;gap:10px;padding:14px;background:#19142E}
.store-head .back{background:none;border:none;font-size:20px;color:#c4b5fd;cursor:pointer}
.store-head .t{font-weight:800;color:#fff}
.store-body{flex:1;overflow-y:auto;padding:14px}
.pack{background:#19142E;border:1px solid #3a2a5e;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pack .cover{width:70px;height:70px;border-radius:10px;overflow:hidden;flex-shrink:0}
.pack .cover img{width:100%;height:100%;object-fit:cover}
.pack .info{flex:1}
.pack .info .t{font-weight:700;color:#fff}
.pack .info .c{font-size:11px;color:#a78bfa;margin:2px 0 6px}
.pack .info .badge{font-size:10px;background:#2f2547;color:#c4b5fd;border-radius:8px;padding:2px 8px;display:inline-block}
.pack button{background:#7C4DFF;color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:12px;min-width:110px}
.pack button.installed{background:#2f2547;color:#a78bfa}
.progress{height:6px;background:#241C3F;border-radius:4px;margin-top:6px;overflow:hidden}
.progress i{display:block;height:100%;background:#7C4DFF;width:0;transition:width .2s}
.gift-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center}
.gift-box{background:#19142E;border:1px solid #7C4DFF;border-radius:16px;padding:20px;text-align:center;width:280px}
.gift-box .g{cursor:pointer;margin:8px;display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.gift-box .g svg{width:32px;height:32px;stroke:#7C4DFF;fill:none;stroke-width:2;pointer-events:none}
.gift-box .price{font-size:11px;color:#a78bfa}
.gift-box .btn{background:#7C4DFF;color:#fff;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;margin-top:10px}
.call-overlay{position:fixed;inset:0;background:rgba(11,8,22,.95);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.call-overlay svg{width:60px;height:60px;stroke:#c4b5fd;fill:none;stroke-width:2}
.call-overlay .st{color:#a78bfa;font-size:14px}
.call-overlay .end{background:#FF2A54;color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:16px;cursor:pointer}
.call-overlay .accept{background:#00E676;color:#0B0816;border:none;border-radius:50%;width:56px;height:56px;font-size:18px;cursor:pointer}
.call-overlay .reject{background:#FF2A54;color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:16px;cursor:pointer}
.call-overlay .btns{display:flex;gap:14px;margin-top:6px}
.req-btn{background:#7C4DFF;color:#fff;border:none;border-radius:16px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:12px}
.req-accept{background:#00E676;color:#0B0816;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.req-reject{background:#FF2A54;color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.search-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.search-row .avatar{width:40px;height:40px;font-size:16px}
</style>
</head><body>

<div class="header">
  <div class="tabs">
    <button class="tab active" id="chatsTab">Chats</button>
    <button class="tab" id="contactsTab">Contacts</button>
    <div class="search" id="searchBox">
      <svg class="ic" viewBox="0 0 24 24" style="stroke:#8E8A9F"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="idSearch" placeholder="Search ID">
    </div>
    <button class="add-btn" id="addBtn">
      <svg class="ic" viewBox="0 0 24 24" style="stroke:#fff"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M19 8v6M16 11h6"/></svg>
    </button>
  </div>
  <div class="features">
    <button class="feature f-voice" onclick="openFeature('Voice Party')">
      <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/></svg>
      <span class="nm">Voice Party</span>
    </button>
    <button class="feature f-truth" onclick="openFeature('Truth & Dare')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="8.5" cy="15.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/></svg>
      <span class="nm">Truth & Dare</span>
    </button>
    <button class="feature f-ludo" onclick="openFeature('Ludo')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/><circle cx="12" cy="12" r="1"/></svg>
      <span class="nm">Ludo</span>
    </button>
    <button class="feature f-domino" onclick="openFeature('Domino')">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 3v18"/><circle cx="9" cy="8" r="1"/><circle cx="15" cy="16" r="1"/></svg>
      <span class="nm">Domino</span>
    </button>
  </div>
</div>
<div id="searchResult" class="float-card hidden"></div>
<div id="notFound" style="padding:4px 16px;font-size:12px;color:#a78bfa"></div>

<div id="chatsView">
  <div class="section-title">
  <svg class="ic" viewBox="0 0 24 24" style="stroke:#FFEA00"><path d="M4 20V10M9 20V4M14 20v-8M19 20V7"/></svg>
  Online Rooms</div>
<div class="bubbles" id="onlineBubbles"></div>
<div class="section-title">
  <svg class="ic" viewBox="0 0 24 24" style="stroke:#00E5FF"><path d="M12 3v1M12 20v1M4.22 4.22l.7.7M18.36 18.36l.7.7M1 12h1M22 12h1M4.22 19.78l.7-.7M18.36 5.64l.7-.7"/></svg>
  Recommended Users
</div>
<div class="bubbles" id="recommendBubbles"></div>
<div class="chatlist-head">
  <h3>Chatlist</h3>
  <div class="filter">All</div>
</div>
<div id="chatList"></div>
</div>
<div id="contactsView" class="contacts-view hidden"></div>
<div id="chatScreen" class="chat-screen hidden">
  <div id="teleportBanner" class="teleport-banner hidden" onclick="teleport()">
    <div class="left">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M9 20V4M14 20v-8M19 20V7"/></svg>
      <marquee behavior="scroll" direction="left"><span id="teleportText">chatting in the voice party now.</span></marquee>
    </div>
    <span class="arrow">></span>
  </div>
  <div class="chat-head">
    <div class="row" style="display:flex;align-items:center;gap:10px;padding:12px">
      <button class="back" onclick="closeChat()">←</button>
      <div class="title">
        <div class="nm" id="chatName" onclick="viewProfile()">User</div>
      </div>
      <button class="menu" onclick="openChatMenu()">...</button>
    </div>
  </div>
  <div id="messages"></div>
  <div class="chat-input">
    <button class="attach" onclick="pickImage()">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <input id="msgInput" placeholder="Type a message">
    <button class="emoji-btn" onclick="toggleKeyboard()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="9.5" r=".5"/><circle cx="15" cy="9.5" r=".5"/></svg>
    </button>
    <button class="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24" style="stroke:#fff"><path d="m5 12 14-7-7 14-2-5-5-2z"/></svg>
    </button>
      </div><div class="kb" id="keyboard" style="display:none">

function esc(s){return String(s??'').replace(/</g,'&lt;');}

function avatarOf(u){return u.photo?'<img src="'+esc(u.photo)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':esc(u.dp||'👤');}
function lastSeen(u){
  if(!u.last_active)return'Offline';
  const diff=Date.now()-new Date(u.last_active).getTime();
  if(diff<5*60*1000)return'Online';
  const mins=Math.floor(diff/60000);
  if(mins<60)return'Last seen '+mins+' min ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24)return'Last seen '+hrs+' hr ago';
  return'Last seen '+Math.floor(hrs/24)+' days ago';
}

  me=p;
  await loadUsers();
  await loadThreads();
render();

const requestedUid =
 new URLSearchParams(location.search).get('uid');

if(requestedUid){
 const target=State.users.find(

 );

 if(target){

 }else{
  toast('Is user ki conversation load nahi hui.');
 }
}
  sb.channel('voxa-msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},pl=>{const m=pl.new;if(m.sender_id===me.id||m.receiver_id===me.id)addMessage(m);}).subscribe();

async function loadUsers(){
  const {data}=await sb.from('profiles').select('id,uid,name,dp,photo,gender,age,last_active').neq('id',me.id);
  State.users=(data||[]).map(u=>({id:u.id,uid:u.uid,name:u.name||'User',dp:u.dp||'👤',photo:u.photo,last_active:u.last_active,isOnline:!!(u.last_active&&Date.now()-new Date(u.last_active)<5*60*1000),inRoom:false,roomId:null}));
}
async function loadThreads(){
  const {data}=await sb.from('messages').select('*').or('sender_id.eq.'+me.id+',receiver_id.eq.'+me.id).order('created_at');
  (data||[]).forEach(m=>addMessage(m,true));
  renderChatList();
}
function addMessage(m,silent){
  const other=m.sender_id===me.id?m.receiver_id:m.sender_id;
  const th=State.threads[other]=State.threads[other]||[];
  if(th.find(x=>x.id===m.id))return;
  th.push({id:m.id,text:m.text||'',sender:m.sender_id===me.id?'me':other,timestamp:new Date(m.created_at),read:m.read,type:m.type||'text',extra:m.extra});
  if(activeChat===other&&!silent)renderMessages(other);
  if(!silent){
    renderChatList();
    if(m.sender_id!==me.id&&m.receiver_id===me.id){
      const u=State.users.find(x=>x.id===m.sender_id);
      toast('💬 New message from '+(u?u.name:'User'));
    }
  }
}
async function sendMsg(){
  const t=$('msgInput').value.trim();
  if(!t||!activeChat)return;
  $('msgInput').value='';
  sb.from('typing_status').upsert({user_id:me.id,chat_with:activeChat,typing:false},{onConflict:'user_id,chat_with'});
  const {data,error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:activeChat,text:esc(t),type:'text'}).select().single();
 if(error){
 toast('Send failed: ' + error.message);
 console.log(error);
 return;
 }
}
async function markRead(uid){
  await sb.from('messages').update({read:true}).match({sender_id:uid,receiver_id:me.id,read:false});
  (State.threads[uid]||[]).forEach(m=>{if(m.sender!=='me')m.read=true;});
  renderChatList();
}

function openFeature(n){if(n==='Voice Party'){location.href='party.html';}else{toast(n+' opening soon');}}
function joinRoom(r){location.href='party.html';}
function render(){renderRecommend();renderChatList();renderOnline();renderContacts();renderStickerTab();}
function presenceBadge(u){const p=presenceOf(u.id);if(p.status==='online')return '<span class="dot"></span>';return '';}
function renderRecommend(){
  const us=State.users.filter(u=>u.isOnline).slice(0,10);
  $('recommendBubbles').innerHTML=us.map(u=>`<div class="bubble" onclick="openChat('${u.id}')"><div class="ring" onclick="event.stopPropagation();location.href='profile2.html?uid=${u.uid}'" style="cursor:pointer">${avatarOf(u)}${presenceBadge(u)}</div><div class="bubble-name" onclick="event.stopPropagation();location.href='profile2.html?uid=${u.uid}'" style="cursor:pointer">${esc(u.name)}</div></div>`).join('');
}
function renderOnline(){
  const us=State.users.filter(u=>u.isOnline).slice(0,10);
  $('onlineBubbles').innerHTML=us.map(u=>`<div class="bubble" onclick="openChat('${u.id}')"><div class="ring" onclick="event.stopPropagation();location.href='profile2.html?uid=${u.uid}'" style="cursor:pointer">${avatarOf(u)}${presenceBadge(u)}</div><div class="bubble-name" onclick="event.stopPropagation();location.href='profile2.html?uid=${u.uid}'" style="cursor:pointer">${esc(u.name)}</div></div>`).join('');
}
function renderChatList(){
  const entries=Object.entries(State.threads).map(([uid,arr])=>({uid,arr,user:State.users.find(u=>u.id===uid)||{name:'User',dp:'👤'}}))
  .sort((a,b)=>{const la=a.arr[a.arr.length-1]?.timestamp||0,lb=b.arr[b.arr.length-1]?.timestamp||0;return lb-la;});
  if(!entries.length){$('chatList').innerHTML='<div class="empty">Your inbox is fresh! Search an ID above to start chatting.</div>';return;}
  $('chatList').innerHTML=entries.map(e=>{
    const last=e.arr[e.arr.length-1];const unread=e.arr.filter(m=>!m.read&&m.sender!=='me').length;
    const p=presenceOf(e.uid);
    const prev=(last.type==='sticker'||last.type==='animated_sticker')?'Sticker':(last.type==='image'?'Photo':(last.type==='gift'?'Gift sent':last.text));
    const preview=p.status==='online'?'Online':prev;
    return `<div class="conv-wrap"><div class="conv-actions"><button class="pin-btn" onclick="event.stopPropagation();pinChat('${e.uid}')">Pin</button><button class="del-btn" onclick="event.stopPropagation();deleteChat('${e.uid}')">Delete</button></div><div class="conv"><div class="conv-main" onclick="openChat('${e.uid}')"><div class="avatar" onclick="event.stopPropagation();location.href='profile2.html?uid=${e.user.uid}'" style="cursor:pointer">${avatarOf(e.user)}${p.status==='online'?'<span class="dot"></span>':''}</div><div class="c-info" onclick="event.stopPropagation();location.href='profile2.html?uid=${e.user.uid}'" style="cursor:pointer"><div class="c-name">${esc(e.user.name)}</div><div class="c-preview">${esc(preview)}</div></div><div class="c-right"><div class="c-time">${new Date(last.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>${unread?'<span class="unread">'+unread+'</span>':''}</div></div></div></div>`;
  }).join('');
  attachSwipe();
}function attachSwipe(){
  document.querySelectorAll('.conv-wrap').forEach(w=>{
    const conv=w.querySelector('.conv');
    if(!conv)return;
    let sx=0,dx=0;
    conv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;conv.style.transition='none';});
    conv.addEventListener('touchmove',e=>{dx=e.touches[0].clientX-sx;if(dx<0)conv.style.transform='translateX('+Math.max(dx,-120)+'px)';});
    conv.addEventListener('touchend',()=>{
      conv.style.transition='transform .2s';
      conv.style.transform=dx<-60?'translateX(-120px)':'translateX(0)';
    });
  });
}
function renderContacts(){
  const box=$('contactsView');
  box.innerHTML='';
  const groups={};
  State.users.forEach(u=>{const g=u.name[0].toUpperCase();(groups[g]=groups[g]||[]).push(u);});
  Object.keys(groups).sort().forEach(g=>{
    const acc=document.createElement('div');acc.className='acc';
    acc.innerHTML=`<div class="acc-head"><div class="nm">${g}</div><div class="ar">▾</div></div><div class="acc-body">${groups[g].map(u=>`<div class="u" onclick="openChat('${u.id}')"><div class="av" onclick="event.stopPropagation();location.href='profile2.html?uid=${u.uid}'" style="cursor:pointer">${avatarOf(u)}${presenceBadge(u)}</div><div onclick="event.stopPropagation();location.href='profile2.html?uid=${u.uid}'" style="cursor:pointer">${esc(u.name)}</div></div>`).join('')}</div>`;
    acc.querySelector('.acc-head').onclick=()=>acc.classList.toggle('open');
    box.appendChild(acc);
  });
}
function pinChat(uid){State.pinned.push(uid);toast('Chat pinned');renderChatList();}
function deleteChat(uid){delete State.threads[uid];toast('Chat deleted');renderChatList();}
function openChat(uid){
  activeChat=uid;
  const u=State.users.find(x=>x.id===uid);
  $('chatName').textContent=u?u.name:'User';
  $('teleportBanner').classList.remove('hidden');
  $('chatScreen').classList.remove('hidden');
  renderMessages(uid);
  markRead(uid);
}
function closeChat(){activeChat=null;$('chatScreen').classList.add('hidden');renderChatList();}
function renderMessages(uid){
  const arr=State.threads[uid]||[];
  let last='';
  $('messages').innerHTML=arr.map(m=>{
    const t=new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const sep=t!==last?'<div class="time-sep">'+t+'</div>':'';
    last=t;
    const u=State.users.find(x=>x.id===uid);
    if(m.type==='sticker'||m.type==='animated_sticker'){
      return sep+`<div class="msg ${m.sender==='me'?'me':''}">${m.sender==='me'?'':'<div class="avatar" onclick="location.href=\'profile2.html?uid='+u.uid+'\'" style="cursor:pointer">'+avatarOf(u)+'</div>'}<div class="bubble sticker-anim"><img src="${esc(m.extra)}" style="max-width:120px"></div></div>`;
    }
    if(m.type==='image'){
      return sep+`<div class="msg ${m.sender==='me'?'me':''}">${m.sender==='me'?'':'<div class="avatar" onclick="location.href=\'profile2.html?uid='+u.uid+'\'" style="cursor:pointer">'+avatarOf(u)+'</div>'}<div><div class="bubble"><img src="${esc(m.extra)}" class="msg-img"></div>${m.sender==='me'?'<div class="read">✓✓</div>':''}</div></div>`;
    }
    if(m.type==='gift'){
      return sep+`<div class="msg ${m.sender==='me'?'me':''}">${m.sender==='me'?'':'<div class="avatar" onclick="location.href=\'profile2.html?uid='+u.uid+'\'" style="cursor:pointer">'+avatarOf(u)+'</div>'}<div class="bubble">🎁 ${esc(m.text)}</div></div>`;
    }
    return sep+`<div class="msg ${m.sender==='me'?'me':''}">${m.sender==='me'?'':'<div class="avatar" onclick="location.href=\'profile2.html?uid='+u.uid+'\'" style="cursor:pointer">'+avatarOf(u)+'</div>'}<div><div class="bubble">${esc(m.text)}</div>${m.sender==='me'?'<div class="read">✓✓</div>':''}</div></div>`;
  }).join('');
  $('messages').scrollTop=$('messages').scrollHeight;
}

  addMessage(data);
};
function toggleKeyboard(){
  const kb=$('keyboard');
  kb.style.display=kb.style.display==='none'?'flex':'none';
  if(kb.style.display==='flex'){renderStickerTab();}
}
function setKbTab(tab,btn){

  $('kbEmoji').classList.toggle('hidden',tab!=='emoji');

function renderStickerTab(){
  $('kbEmoji').innerHTML=EMOJIS.map(e=>`<span onclick="insertEmoji('${e}')">${e}</span>`).join('');
  const packs=State.stickerPacks;
  $('kbSticker').innerHTML=packs.length?packs.map(p=>`<div class="st" onclick="sendSticker('${p.id}')"><img src="${esc(p.cover)}"></div>`).join(''):'<div style="color:#a78bfa;font-size:12px">No sticker packs installed</div>';
}
function insertEmoji(e){$('msgInput').value+=e;}
async function sendSticker(pid){
  const p=State.stickerPacks.find(x=>x.id===pid);
  if(!p||!activeChat)return;
  const {data,error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:activeChat,text:'',type:'sticker',extra:p.cover}).select().single();
  if(error){toast('Send failed');return;}
  addMessage(data);
}
async function openStore(){
  $('storeModal').classList.remove('hidden');
  const {data}=await sb.from('sticker_packs').select('*');
  State.stickerPacks=data||[];
  $('storeBody').innerHTML=(data||[]).map(p=>{
    const installed=State.installedPacks.includes(p.id);
    const prog=State.downloadProgress[p.id]||0;
    return `<div class="pack"><div class="cover"><img src="${esc(p.cover)}"></div><div class="info"><div class="t">${esc(p.name)}</div><div class="c">${esc(p.category||'Stickers')} · ${p.stickers?p.stickers.length:0} stickers</div><span class="badge">${p.type||'static'}</span><div class="progress"><i style="width:${prog}%"></i></div></div><button class="${installed?'installed':''}" onclick="installPack('${p.id}')">${installed?'Installed':'Install'}</button></div>`;
  }).join('');
}
function closeStore(){$('storeModal').classList.add('hidden');}
async function installPack(pid){
  const p=State.stickerPacks.find(x=>x.id===pid);
  if(!p)return;
  State.downloadProgress[pid]=0;
  const btn=document.querySelector(`[onclick="installPack('${pid}')"]`);
  if(btn){btn.textContent='Downloading…';btn.disabled=true;}
  const timer=setInterval(()=>{
    State.downloadProgress[pid]=Math.min(100,(State.downloadProgress[pid]||0)+10);
    const bar=document.querySelector(`[onclick="installPack('${pid}')"]`)?.closest('.pack')?.querySelector('.progress i');
    if(bar)bar.style.width=State.downloadProgress[pid]+'%';
    if(State.downloadProgress[pid]>=100){
      clearInterval(timer);
      State.installedPacks.push(pid);
      localStorage.setItem('voxa_sticker_packs',JSON.stringify(State.installedPacks));
      if(btn){btn.textContent='Installed';btn.classList.add('installed');btn.disabled=false;}
      toast('Pack installed!');
      renderStickerTab();
    }
  },200);
}
function openQA(){
  const box=$('searchResult');
  box.classList.remove('hidden');
  box.innerHTML='<div style="font-weight:700;color:#fff;font-size:13px;margin-bottom:6px">Q&A</div><div style="color:#a78bfa;font-size:12px">Coming soon</div>';
}
function openGifts(){$('giftModal').classList.remove('hidden');}
function closeGifts(){$('giftModal').classList.add('hidden');}
async function sendGift(name,label,price){
  if(!activeChat)return;
  const {data,error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:activeChat,text:'Gift: '+name,type:'gift',extra:''}).select().single();
  if(error){toast('Gift failed');return;}
  addMessage(data);
  closeGifts();
  toast('Gift sent! 🎁');
}
function startVoice(){
  if(!activeChat)return;
  const u=State.users.find(x=>x.id===activeChat);
  $('callName').textContent='Voice Party';
  $('callStatus').textContent='Joining room with '+u.name;
  $('callOverlay').classList.remove('hidden');
  $('endCallBtn').style.display='block';
  $('acceptCallBtn').style.display='none';
  $('rejectCallBtn').style.display='none';
}
function startCall(){
  if(!activeChat)return;
  const u=State.users.find(x=>x.id===activeChat);
  $('callName').textContent='Calling '+u.name;
  $('callStatus').textContent='Connecting Audio Channel';
  $('callOverlay').classList.remove('hidden');
  $('endCallBtn').style.display='block';
  $('acceptCallBtn').style.display='none';
  $('rejectCallBtn').style.display='none';
  sb.from('call_signals').insert({from_user:me.id,to_user:activeChat,type:'ring'});
}
function handleSignal(s){
  if(s.type==='ring'){
    const u=State.users.find(x=>x.id===s.from_user);
    $('callName').textContent='Incoming call from '+u.name;
    $('callStatus').textContent='Incoming Voice Call';
    $('callOverlay').classList.remove('hidden');
    $('acceptCallBtn').style.display='block';
    $('rejectCallBtn').style.display='block';
    $('endCallBtn').style.display='none';
  }
}
function acceptCall(){
  $('callStatus').textContent='Connected';
  $('acceptCallBtn').style.display='none';
  $('rejectCallBtn').style.display='none';
  $('endCallBtn').style.display='block';
}
function rejectCall(){
  $('callOverlay').classList.add('hidden');
  sb.from('call_signals').insert({from_user:me.id,to_user:activeChat,type:'reject'});
}
function endCall(){
  $('callOverlay').classList.add('hidden');
  sb.from('call_signals').insert({from_user:me.id,to_user:activeChat,type:'end'});
}
function teleport(){
  location.href='party.html';
}
init();
</script>
