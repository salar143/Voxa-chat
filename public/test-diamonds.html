<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Test Diamonds</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif;max-width:500px;margin:40px auto">
<h2>Add Diamonds Test</h2>

<label>UUID<br>
<input id="u" style="width:100%;padding:8px">
</label><br>

<label>Amount<br>
<input id="a" type="number" value="100" style="width:100%;padding:8px">
</label><br>

<button onclick="go()" style="padding:10px 20px">Add Diamonds</button>
<pre id="r"></pre>

<script>
const db = supabase.createClient(
  "https://mblcbygpqbogmtzacbtz.supabase.co",
  "sb_publishable_d0jKzXs_b-tBVzhusjYKJw_ZdPkMxdV"
);

async function go(){
  const r = document.getElementById('r');
  try{
    const {data,error} = await db.rpc('voxa_add_diamonds',{
      target_profile: document.getElementById('u').value.trim(),
      diamond_amount: Number(document.getElementById('a').value)
    });
    r.textContent = error ? 'ERROR: '+error.message : 'SUCCESS: '+JSON.stringify(data);
  }catch(e){
    r.textContent = 'ERROR: '+e.message;
  }
}
</script>
</body>
</html>
