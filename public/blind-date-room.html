<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoxaChat Room</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#110c19;color:#fff;font:13px Arial,sans-serif;display:flex;justify-content:center}
button,input,select,textarea{font:inherit}
button{color:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{--bg:radial-gradient(ellipse at 10% 32%,#bd985c70,transparent 48%),linear-gradient(160deg,#4c2357,#513544 42%,#211c32 78%,#100d1b);width:100%;max-width:480px;height:100svh;min-height:450px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.app[data-theme="midnight"]{--bg:radial-gradient(at 20% 10%,#492c7566,transparent 55%),linear-gradient(#1a112e,#0d0b18)}
.app[data-theme="ocean"]{--bg:radial-gradient(at 15% 30%,#2fafa966,transparent 55%),linear-gradient(#173343,#101522)}
.app[data-theme="rose"]{--bg:radial-gradient(at 15% 30%,#c9658c55,transparent 55%),linear-gradient(#532844,#221327)}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 10px 8px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
.room-photo{width:43px;height:43px;border:2px solid #edd18e;border-radius:11px;display:grid;place-items:center;overflow:hidden;background:#2a1f37;flex-shrink:0;cursor:pointer}
.room-photo img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0;cursor:pointer}
.title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:#ecdbea;margin-top:5px}
.room-frame{display:inline-block;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:700;color:#fff;margin-left:4px}
.icon{background:none;border:0;width:32px;height:36px;display:grid;place-items:center;flex-shrink:0}
svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.line{display:flex;justify-content:space-between;gap:10px;padding:2px 12px 10px;font-size:10px;color:#f0deef;align-items:center}
.livecount{display:flex;align-items:center;gap:5px;color:#7ee7a0;font-size:14px;font-weight:700;cursor:pointer;background:none;border:0;padding:0}
.livecount svg{width:16px;height:16px;stroke:#7ee7a0}
.seats{flex:0 0 auto;min-height:0;overflow-y:auto;padding:10px 8px 0;scrollbar-width:none}
.seats::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 4px}
.seat{border:0;background:none;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar{width:clamp(42px,12.8vw,59px);height:clamp(42px,12.8vw,59px);border:1px solid #ffffff66;background:#ffffff12;border-radius:50%;display:grid;place-items:center;position:relative;font-weight:700;font-size:18px;color:#f4d28b;overflow:hidden}
.avatar svg{color:#dfc9e7;width:23px;height:23px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.occupied{border:2px solid #edd18e}
.avatar.muted svg{color:#ffa6bb}
.mute-badge{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:#1a1020;border:1px solid #ffa6bb;display:grid;place-items:center}
.mute-badge svg{width:11px;height:11px;stroke:#ffa6bb;stroke-width:2}
.seat-num{font-size:10px;color:#e5dcf0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recv-line{width:80%;height:4px;background:#ffffff22;border-radius:2px;margin-top:2px;overflow:hidden}
.recv-line .recv-fill{height:100%;background:#fbbf24;width:0%}
.lower{min-height:108px;flex:1;position:relative;padding:6px 66px 6px 12px;flex-shrink:0}
.chat{height:100%;overflow:auto;font-size:11px;line-height:1.7;overflow-wrap:anywhere}
.msg{margin-bottom:5px}
.msg.system{color:#f2dca7;font-size:11px}
.msg.gift{color:#ff8fc7;font-weight:700}
.msg.chat-msg{display:flex;gap:6px;align-items:flex-start}
.msg.chat-msg .c-pic{width:26px;height:26px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff44;display:grid;place-items:center;font-size:11px;font-weight:700;color:#f4d28b;flex-shrink:0;overflow:hidden;cursor:pointer}
.msg.chat-msg .c-pic img{width:100%;height:100%;object-fit:cover}
.msg.chat-msg .c-body{min-width:0;flex:1}
.msg.chat-msg .c-name{font-weight:700;color:#f4d28b;cursor:pointer}
.role-tag{display:inline-block;font-size:8px;border-radius:6px;padding:0 5px;margin-left:4px;color:#fff;background:#8754f6}
.role-tag.owner{background:#d97706}
.role-tag.admin{background:#2563eb}
.role-tag.manager{background:#0891b2}
.role-tag.official{background:#16a34a}
.c-tags{font-size:9px;color:#d1bddb;margin:1px 0}
.c-tags .tag{display:inline-block;border:1px solid #ffffff33;border-radius:6px;padding:0 3px;margin-right:2px;background:#ffffff10;font-size:8px}
.c-tags .tag.lvl{font-size:7px;padding:0 3px;min-width:16px;text-align:center}
.tag-mention{color:#d1bddb}
.tag-mention.me{color:#fbbf24;font-weight:700}
.msg.join{margin-bottom:6px}
.join-box{border:1px solid #ffffff33;background:transparent;border-radius:10px;padding:6px 8px;display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.join-box .c-pic{width:26px;height:26px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff44;display:grid;place-items:center;font-size:11px;font-weight:700;color:#f4d28b;flex-shrink:0;overflow:hidden}
.join-box .c-pic img{width:100%;height:100%;object-fit:cover}
.join-box .c-body{min-width:0;flex:1}
.join-box .c-name{font-weight:700;color:#f4d28b}
.join-box .c-tags{font-size:9px;color:#d1bddb;margin:1px 0}
.join-box .c-tags .tag{display:inline-block;border:1px solid #ffffff33;border-radius:6px;padding:0 3px;margin-right:2px;background:#ffffff10;font-size:8px}
.join-box .c-tags .tag.lvl{font-size:7px;padding:0 3px;min-width:16px;text-align:center}
.side{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:10px}
.side button{width:39px;height:39px;border:1px solid #ffffff44;border-radius:12px;background:#ffffff18;display:grid;place-items:center}
.side .inbox{background:#687ac7bb}
.side .invite{background:#8754f6bb}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#130d22b0;flex-shrink:0}
.left{display:flex;align-items:center;gap:13px}
.recharge-box{display:flex;flex-direction:column;align-items:center;gap:3px;margin-right:6px;cursor:pointer;border:0;border-radius:12px;padding:4px 6px;background:transparent}
.recharge-box .rb-label{font-size:7px;color:#fbbf24;text-align:center;line-height:1.2}
.giftbox{position:relative;width:30px;height:30px}
.giftbox .body{position:absolute;bottom:0;left:2px;width:26px;height:18px;background:linear-gradient(145deg,#db2777,#831843);border:1px solid #f472b6;border-radius:4px}
.giftbox .lid{position:absolute;top:6px;left:0;width:30px;height:7px;background:linear-gradient(145deg,#ec4899,#9d174d);border:1px solid #f472b6;border-radius:3px}
.giftbox .ribbon-v{position:absolute;top:6px;left:14px;width:3px;height:22px;background:#fbbf24}
.giftbox .ribbon-h{position:absolute;top:12px;left:2px;width:26px;height:3px;background:#fbbf24}
.giftbox .bow{position:absolute;top:1px;left:11px;width:8px;height:6px;border:2px solid #fbbf24;border-radius:50% 50% 0 0}
.giftbox.anim{animation:giftBounce 1.2s ease-in-out infinite}
@keyframes giftBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.08)}}
.muted{color:#ffa6bb}
.gold{color:#f4d28b}
.composer{display:flex;gap:6px;padding:9px;background:#271a36}
.composer input{min-width:0;flex:1;border:1px solid #ffffff33;border-radius:22px;background:#ffffff0a;padding:10px 12px;color:white}
.emoji{position:absolute;bottom:65px;left:12px;background:#2b1c39;border:1px solid #ffffff33;border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.emoji button{border:0;background:none;font-size:24px;padding:6px}
.overlay{position:absolute;inset:0;background:#0009;z-index:8}
.panel{position:absolute;bottom:0;left:0;right:0;max-height:85%;overflow:auto;background:#261a35;border:1px solid #ffffff22;border-radius:24px 24px 0 0;padding:18px 15px max(20px,env(safe-area-inset-bottom));z-index:9}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panel h2{font-size:19px}
.opt{border:1px solid #ffffff26;background:#ffffff08;border-radius:12px;padding:13px 9px;text-align:center;width:100%;margin-top:9px}
.opt.big-blue{background:#2563eb;border-color:#60a5fa;color:#fff;font-weight:700;padding:15px}
.opt.big-white{background:#fff;color:#1d1230;border-color:#fff;font-weight:700;padding:15px}
.note{font-size:11px;color:#d1bddb;line-height:1.6;margin:12px 0}
.toast{position:absolute;bottom:80px;left:15px;right:15px;padding:12px;background:#21132ef5;border:1px solid #ffffff44;border-radius:12px;z-index:15;font-size:12px;line-height:1.6;text-align:center}
dialog{margin:auto;width:calc(100% - 36px);max-width:360px;background:#291b38;border:1px solid #ffffff44;border-radius:18px;color:white;padding:20px}
dialog::backdrop{background:#0009}
dialog p{white-space:pre-line;font-size:12px;line-height:1.7;margin:12px 0}
.restore{position:fixed;bottom:20px;right:18px;background:#3b284c;border:1px solid #f4d28b;border-radius:30px;padding:13px 18px;color:#fff;z-index:50}
.page{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;overflow:hidden}
.page-head{display:flex;align-items:center;gap:8px;padding:14px 12px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid #ffffff22;flex-shrink:0;flex-wrap:wrap}
.page-head h2{font-size:17px;flex-shrink:0}
.page-head .hide-tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.hide-tab{border:1px solid #ffffff26;background:#ffffff08;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;color:#d1bddb}
.hide-tab.active{background:#8754f6;border-color:#a78bfa;color:#fff}
.page-body{flex:1;overflow-y:auto;padding:16px 14px max(20px,env(safe-area-inset-bottom))}
.setting-row{display:flex;align-items:center;gap:12px;border:1px solid #ffffff22;background:#ffffff08;border-radius:14px;padding:14px 12px;margin-top:10px;cursor:pointer}
.setting-row .row-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#3a2a4e,#241a33);border:1px solid #ffffff22;display:grid;place-items:center;flex-shrink:0}
.setting-row .row-icon svg{width:20px;height:20px;stroke:#f4d28b}
.setting-row .row-label{flex:1;font-size:13px;font-weight:600}
.setting-row .row-arrow{color:#d1bddf}
.list-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #ffffff18;border-radius:12px;margin-top:8px;background:#ffffff08;font-size:12px}
.list-item .li-icon{width:34px;height:34px;border-radius:10px;background:#ffffff10;display:grid;place-items:center}
.list-item .li-icon svg{width:18px;height:18px;stroke:#f4d28b}
.hidden-input{display:none}
.game-logo{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;margin:0 auto 6px}
.game-logo svg{width:30px;height:30px}
.game-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:8px 4px}
.game-item .g-name{font-size:10px;color:#e5dcf0;text-align:center}
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.game-result{margin-top:12px;padding:12px;border:1px solid #ffffff33;border-radius:12px;background:#ffffff08;font-size:13px;line-height:1.7;text-align:center}
.lights-on{position:absolute;inset:0;z-index:30;pointer-events:none;animation:lights 1.2s infinite}
@keyframes lights{0%{background:#ff008022}25%{background:#00ff8822}50%{background:#0080ff22}75%{background:#ffff0022}100%{background:#ff008022}}
.cropper{position:fixed;inset:0;background:#1a112eee;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:auto}
.cropper h3{margin-bottom:10px;color:#f4d28b}
.crop-stage{position:relative;width:320px;height:320px;max-width:92vw;max-height:92vw;border:2px solid #f4d28b;border-radius:14px;touch-action:none;background:#2a1f37;overflow:hidden}
.crop-stage canvas{display:block;width:320px;height:320px;max-width:92vw;max-height:92vw;touch-action:none}
.crop-shapes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.crop-shapes button{padding:8px 14px;border-radius:12px;border:1px solid #ffffff44;background:#ffffff18;color:#fff;font-size:12px}
.crop-shapes button.active{background:#2563eb;border-color:#60a5fa}
.crop-preview{margin-top:10px;text-align:center}
.crop-preview .cp-label{font-size:11px;color:#d1bddb;margin-bottom:6px}
.crop-preview canvas{width:110px;height:110px;object-fit:cover;border:2px solid #f4d28b;border-radius:12px;background:#2a1f37}
.crop-controls{display:flex;align-items:center;gap:10px;margin-top:12px;width:320px;max-width:92vw;flex-wrap:wrap}
.crop-controls label{font-size:11px;color:#d1bddb}
.crop-controls input[type=range]{flex:1;min-width:100px}
.crop-actions{display:flex;gap:10px;margin-top:12px}
.crop-actions button{padding:10px 18px;border-radius:12px;border:1px solid #ffffff44;background:#ffffff18;color:#fff}
.crop-actions .save{background:#16a34a;border-color:#22c55e;font-weight:700}
.ps-overlay{position:absolute;inset:0;background:#000000c0;z-index:14}
.ps-sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1a112e,#0d0b18);color:#fff;border:1px solid #8754f655;border-radius:22px 22px 0 0;padding:0 16px max(18px,env(safe-area-inset-bottom));z-index:15;transform:translateY(100%);transition:transform .3s ease;max-height:88%;overflow-y:auto}
.ps-sheet.open{transform:translateY(0)}
.ps-dp{width:88px;height:88px;border-radius:50%;border:3px solid #8754f6;background:#2a1f37;display:grid;place-items:center;overflow:hidden;font-size:32px;font-weight:700;color:#f4d28b;margin:16px auto 8px;position:relative;z-index:3;box-shadow:0 0 18px #8754f666;cursor:pointer}
.ps-dp img{width:100%;height:100%;object-fit:cover}
.ps-toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.ps-toprow .ps-side{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#3a2a4e,#241a33);border:1px solid #8754f655;display:grid;place-items:center}
.ps-toprow .ps-side svg{width:19px;height:19px;stroke:#c4b5fd}
.ps-name{font-size:16px;font-weight:700;color:#f4d28b;text-align:center;flex:1;cursor:pointer}
.ps-intimacy{display:inline-flex;align-items:center;gap:3px;background:#3b1d2e;color:#ff6b9d;border:1px solid #ff6b9d55;border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700}
.ps-intimacy svg{width:11px;height:11px;stroke:#ff6b9d;fill:#ff6b9d}
.ps-uid{text-align:center;font-size:11px;color:#a78bfa;margin-bottom:10px}
.ps-stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ps-stat{display:inline-flex;align-items:center;gap:4px;background:#2a1f37;border:1px solid #8754f644;border-radius:14px;padding:4px 10px;font-size:11px;font-weight:700;color:#c4b5fd}
.ps-stat.blue{color:#60a5fa;border-color:#60a5fa55}
.ps-stat.gold{color:#fbbf24;border-color:#fbbf2455}
.ps-giftwall{background:linear-gradient(90deg,#2a1f37,#1a112e);border:1px solid #8754f644;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left}
.ps-giftwall .gw-title{font-weight:700;font-size:13px;color:#f4d28b}
.ps-giftwall .gw-score{font-size:10px;color:#a78bfa}
.ps-giftwall .gw-gifts{display:flex;gap:4px;margin-left:auto}
.ps-giftwall .gw-gift{width:26px;height:26px;border-radius:8px;background:#3a2a4e;display:grid;place-items:center;font-size:14px;border:1px solid #8754f644}
.ps-giftwall .gw-arrow{font-size:16px;color:#c4b5fd}
.ps-actions3{display:flex;gap:8px;margin-bottom:12px}
.ps-btn3{flex:1;border:0;border-radius:16px;padding:12px 4px;color:#fff;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.ps-btn3 svg{width:18px;height:18px;stroke:#fff}
.ps-btn3.follow{background:linear-gradient(145deg,#3b82f6,#1d4ed8)}
.ps-btn3.chat{background:linear-gradient(145deg,#a855f7,#7c3aed)}
.ps-btn3.gift{background:linear-gradient(145deg,#f472b6,#f97316)}
.ps-bottom{display:flex;justify-content:center;gap:24px;padding-top:6px;border-top:1px solid #8754f644}
.ps-mini{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 10px}
.ps-mini svg{width:22px;height:22px;stroke:#c4b5fd}
.ps-mini.danger svg{stroke:#ff6b9d}
.ps-mini .ps-mini-label{font-size:9px;color:#a78bfa}
.ps-mini.danger .ps-mini-label{color:#ff6b9d}
.ps-mute-badge{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:#1a1020;border:1px solid #ffa6bb;display:grid;place-items:center;z-index:20}
.ps-mute-badge svg{width:14px;height:14px;stroke:#ffa6bb;stroke-width:2}
.invite-dialog{position:fixed;inset:0;background:#000000cc;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.invite-box{background:linear-gradient(180deg,#1a112e,#0d0b18);border:1px solid #8754f6;border-radius:20px;padding:24px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 0 30px #8754f666}
.invite-box .iv-icon{font-size:40px;margin-bottom:8px}
.invite-box .iv-title{font-weight:700;font-size:16px;color:#f4d28b;margin-bottom:6px}
.invite-box .iv-text{font-size:12px;color:#c4b5fd;line-height:1.7;margin-bottom:16px}
.invite-box .iv-actions{display:flex;gap:10px}
.invite-box .iv-btn{flex:1;padding:12px;border-radius:14px;border:0;font-weight:700;font-size:13px;cursor:pointer}
.invite-box .iv-accept{background:linear-gradient(145deg,#22c55e,#16a34a);color:#fff}
.invite-box .iv-reject{background:linear-gradient(145deg,#ef4444,#dc2626);color:#fff}
.ev-card{border:1px solid #ffffff22;background:#ffffff08;border-radius:14px;padding:14px 12px;margin-top:10px;cursor:pointer}
.ev-card img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.ev-card .ev-title{font-weight:700;font-size:14px;color:#f4d28b}
.ev-card .ev-meta{font-size:10px;color:#d1bddb;margin-top:4px}
.ev-status{display:inline-block;font-size:9px;border-radius:8px;padding:1px 7px;margin-left:6px;color:#fff}
.ev-status.live{background:#16a34a}
.ev-status.closed{background:#6b7280}
.ev-status.scheduled{background:#2563eb}
.ev-status.cancelled{background:#dc2626}
.ev-leader{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ffffff18;border-radius:12px;margin-top:8px;background:#ffffff08}
.ev-leader .l-pic{width:34px;height:34px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff44;display:grid;place-items:center;font-weight:700;color:#f4d28b;overflow:hidden}
.ev-leader .l-pic img{width:100%;height:100%;object-fit:cover}
.ev-leader .l-name{flex:1;font-size:12px;font-weight:600}
.ev-leader .l-dia{font-weight:700;color:#fbbf24}
.ev-field{margin-top:12px}
.ev-field label{display:block;font-size:11px;color:#d1bddb;margin-bottom:5px}
.ev-field input,.ev-field textarea,.ev-field select{width:100%;border:1px solid #ffffff33;border-radius:10px;background:#ffffff0a;padding:10px 12px;color:#fff}
.ev-field textarea{min-height:90px;resize:vertical}
.ev-step{font-size:11px;color:#8ab4f8;margin-bottom:8px}
.ev-review-img{width:100%;height:160px;object-fit:cover;border-radius:12px;margin:10px 0}
.ev-review-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px solid #ffffff18}
.ev-review-row .k{color:#d1bddb}
.ev-review-row .v{color:#f4d28b;font-weight:600;text-align:right}
.pc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}

.mp-add button{background:#8754f6;border:1px solid #a78bfa;border-radius:12px;padding:10px 14px;color:#fff;font-weight:700}

.mp-track.active{border-color:#f4d28b;background:#ffffff10}

.mp-now{font-weight:700;font-size:14px;color:#f4d28b;text-align:center;margin:8px 0}

.mp-seek button{background:none;border:0;font-size:18px;color:#fff}

<script>
"use strict";
const E=id=>document.getElementById(id);
let mode="normal",seatCount=20,muted=false,micOn=false,micStream=null,mySeatNumber=null,lightsOn=false;
const roomID=new URLSearchParams(location.search).get("id")||new URLSearchParams(location.search).get("room")||"10001";
E("roomID").textContent=roomID;
function getLoggedInUser(){
  const q=new URLSearchParams(location.search);
  const qUid=q.get("uid");
  if(qUid){
    let full={};
    try{full=JSON.parse(localStorage.getItem("voxa_user_"+qUid)||"null")||{}}catch(_){}
    
return Object.assign({},full,{
  id:qUid,
  uid:qUid,
  name:q.get("name")||full.name||("User "+qUid),
  pic:full.pic||full.photo||full.avatar||full.photoURL||full.avatarUrl||full.image||""
});
  }
  try{
    const u=JSON.parse(localStorage.getItem("voxa_user")||"null");
    if(u&&u.id)return u;
  }catch(_){}
  try{
    let found=null;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k)continue;
      const lk=k.toLowerCase();
      if(!(lk.includes("user")||lk.includes("login")||lk.includes("current")||lk.includes("account")||lk.includes("profile")))continue;
      try{
        const u=JSON.parse(localStorage.getItem(k)||"null");
        if(u&&u.id&&(u.name||u.pic)){
          const score=(u.loggedIn||u.current||u.isCurrent?2:0)+(lk.includes("current")||lk.includes("login")?1:0);
          if(!found||score>found.score)found={u:u,score:score};
        }
      }catch(_){}
    }
    if(found)return found.u;
  }catch(_){}
  return{id:null,name:"Guest"};
}
const ME=getLoggedInUser();
const MY_ID=String(ME.id||"guest");
const seatKey="voxa_room_seats_"+roomID;
const roomKey="voxa_room_data_"+roomID;
const chatKey="voxa_chat_"+roomID+"_"+MY_ID;
const eventsKey="voxa_events_"+roomID;
const inviteKey="voxa_invite_"+roomID+"_"+MY_ID;
const calcKey="voxa_calc_"+roomID;
const calcHistKey="voxa_calc_history_"+roomID;
const pkKey="voxa_pk_"+roomID;

const ROOM_LEVELS=(()=>{
  const arr=[0];
  let need=500;
  for(let i=1;i<61;i++){arr.push(need);need+=Math.round(need*0.35)}
  return arr;
})();
function roomLevelFromDiamonds(dia){
  let lv=1;
  for(let i=1;i<61;i++){if(dia>=ROOM_LEVELS[i])lv=i+1}
  return Math.min(lv,61);
}
function roomBadge(lv){
  if(lv>=51)return"👑 Legendary";
  if(lv>=41)return"💎 Diamond";
  if(lv>=31)return"🏆 Gold";
  if(lv>=21)return"🥈 Silver";
  if(lv>=11)return"🥉 Bronze";
  return"🌱 Starter";
}
function roomFrameColor(lv){
  if(lv>=51)return"linear-gradient(90deg,#f59e0b,#ef4444)";
  if(lv>=41)return"linear-gradient(90deg,#3b82f6,#8b5cf6)";
  if(lv>=31)return"linear-gradient(90deg,#f59e0b,#fbbf24)";
  if(lv>=21)return"linear-gradient(90deg,#94a3b8,#e2e8f0)";
  if(lv>=11)return"linear-gradient(90deg,#b45309,#f59e0b)";
  return"linear-gradient(90deg,#16a34a,#22c55e)";
}
function checkRoomLevelUp(){
  const dia=roomData.diamondsSent||0;
  const newLv=roomLevelFromDiamonds(dia);
  if(newLv>(roomData.level||1)){
    roomData.level=newLv;
    roomData.achievements=roomData.achievements||[];
    roomData.achievements.push({name:roomBadge(newLv)+" — Level "+newLv});
    saveRoom();
    const r=document.createElement("div");
    r.className="msg system";
    r.textContent="🎉 Room Level Up! L"+newLv+" — "+roomBadge(newLv);
    E("chatBox").append(r);
    toast("🎉 Room Level Up! L"+newLv);
    applyRoom();
  }
}

function buildHideTabs(pageHead,pageBody){
  const tabs=pageHead.querySelector("#hideTabs");
  const sections={};
  const labels={settings:"Room Settings",members:"Members",followers:"Followers",events:"Event",achievements:"Achievements"};
  [["settings","Room Settings"],["members","Members"],["followers","Followers"],["events","Event"],["achievements","Achievements"]].forEach(([key,label])=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="hide-tab";
    b.textContent=label;
    b.onclick=()=>showTab(key);
    tabs.append(b);
    const sec=document.createElement("div");
    sec.dataset.key=key;
    sec.style.display="none";
    pageBody.append(sec);
    sections[key]=sec;
  });
  function showTab(key){
    Object.keys(sections).forEach(k=>{sections[k].style.display="none"});
    [...tabs.children].forEach(t=>t.classList.remove("active"));
    sections[key].style.display="block";
    [...tabs.children].find(t=>t.textContent===labels[key]).classList.add("active");
    if(key==="settings")renderSettingsInto(sections[key]);
    else if(key==="members")renderMembersInto(sections[key]);
    else if(key==="followers")renderFollowersInto(sections[key]);
    else if(key==="events")renderEventsHome(sections[key]);
    else renderAchievementsInto(sections[key]);
  }
  showTab("settings");
  return sections;
}

      +'<div class="ev-review-row"><span class="k">Duration</span><span class="v">'+ev.durationHours+'h</span></div>'

      note(body,"Final Sending Statistics");

      action(body,"✏ Edit Event",()=>openEditEvent(ev.id));

        if(e){e.status="cancelled";saveEvents(arr);toast("Event cancelled.");openEventDetail(id)}
      });

function renderLeaderboard(evId){
  const evs=loadEvents();
  const ev=evs.find(e=>e.id===evId);
  if(!ev)return;
  const lb=E("evLeaderboard");
  if(!lb)return;
  lb.replaceChildren();
  const entries=Object.entries(ev.stats||{}).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0){note(lb,"Abhi koi eligible gift send nahi hua.");return}
  entries.forEach(([uid,dia],i)=>{
    const seat=Object.values(seatStates).find(s=>String(s.id)===String(uid));

function recordEventGift(senderId,receiverId,diamonds){
  const arr=loadEvents();
  const now=Date.now();
  const ev=arr.find(e=>e.status==="live"&&now>=e.start&&now<e.end);
  if(ev){
    ev.stats=ev.stats||{};
    ev.stats[senderId]=(ev.stats[senderId]||0)+diamonds;
    saveEvents(arr);
    renderLeaderboard(ev.id);
  }
  roomData.diamondsSent=(roomData.diamondsSent||0)+diamonds;
  saveRoom();
  checkRoomLevelUp();
  applyRoom();
  calcRecordGift(receiverId,diamonds);
  pkRecordGift(senderId,diamonds);
  rpkRecordGift(diamonds);
}

function openCreateEvent(){
  if(!canCreateEvent()){toast("Permission nahi hai.");return}
  evDraft={title:"",description:"",start:0,end:0,durationHours:0,image:"",creatorId:MY_ID};
  openPage("Create Event — Step 1",(body)=>{
    body.innerHTML='<div class="ev-step">Step 1 of 3 — Title & Description</div>'
      +'<div class="ev-field"><label>Event Title (1–1000 words)</label><textarea id="evTitle" maxlength="8000"></textarea></div>'
      +'<div class="ev-field"><label>Event Description (1–1000 words)</label><textarea id="evDesc" maxlength="8000"></textarea></div>'
      +'<div class="note" id="evWordCount"></div>';
    const t=E("evTitle"),d=E("evDesc"),wc=E("evWordCount");
    function upd(){
      const wt=wordCount(t.value),wd=wordCount(d.value);
      wc.textContent="Title: "+wt+" words · Description: "+wd+" words";
      if(wt>1000||wd>1000){wc.style.color="#ff6b6b"}else{wc.style.color="#d1bddb"}
    }
    t.oninput=upd;d.oninput=upd;upd();
    action(body,"NEXT →",()=>{
      const wt=wordCount(t.value),wd=wordCount(d.value);
      if(wt<1||wd<1){toast("Dono fields me kam se kam 1 word likho.");return}
      if(wt>1000||wd>1000){toast("Maximum 1000 words allowed.");return}
      evDraft.title=t.value.trim();evDraft.description=d.value.trim();
      openCreateTiming();
    },"big-blue");
  });
}
function openCreateTiming(){
  openPage("Create Event — Step 2",(body)=>{
    body.innerHTML='<div class="ev-step">Step 2 of 3 — Timing</div>'
      +'<div class="ev-field"><label>Start Time</label><input type="time" id="evStart"></div>'
      +'<div class="ev-field"><label>End Time</label><input type="time" id="evEnd"></div>'
      +'<div class="ev-field"><label>Duration (max 4 hours)</label><select id="evDur"><option value="">Select</option><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option></select></div>';
    action(body,"NEXT →",()=>{
      const s=E("evStart").value,en=E("evEnd").value,dur=E("evDur").value;
      if(!s||!en||!dur){toast("Start, End aur Duration select karo.");return}
      const [sh,sm]=s.split(":").map(Number),[eh,em]=en.split(":").map(Number);
      const today=new Date();
      let start=new Date(today.getFullYear(),today.getMonth(),today.getDate(),sh,sm);
      let end=new Date(today.getFullYear(),today.getMonth(),today.getDate(),eh,em);
      if(end<=start)end.setDate(end.getDate()+1);
      const diffH=(end-start)/(1000*60*60);
      if(diffH>4){toast("Maximum 4 hours allowed.");return}
      if(diffH<=0){toast("End time start se baad honi chahiye.");return}
      if(start<new Date()){toast("Past start time allowed nahi.");return}
      if(Math.round(diffH)!==Number(dur)){toast("Duration selected ("+dur+"h) actual time ("+diffH.toFixed(1)+"h) se match nahi karta.");return}
      evDraft.start=start.getTime();evDraft.end=end.getTime();evDraft.durationHours=Number(dur);
      openCreateImage();
    },"big-blue");
  });
}
let cropCtx={target:null,img:null,scale:1,baseScale:1,x:0,y:0,dragging:false,startX:0,startY:0,shape:"free",box:{x:48,y:48,w:224,h:224},resizing:false};
const CROP_SIZE=320;
function openCropper(dataUrl,target){
  cropCtx={target:target,img:null,scale:1,baseScale:1,x:0,y:0,dragging:false,startX:0,startY:0,shape:"free",box:{x:48,y:48,w:224,h:224},resizing:false};
  E("cropTitle").textContent=target==="event"?"Crop Event Image":"Crop Room DP";
  E("cropper").hidden=false;
  const canvas=E("cropCanvas");
  canvas.width=CROP_SIZE;
  canvas.height=CROP_SIZE;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#2a1f37";
  ctx.fillRect(0,0,CROP_SIZE,CROP_SIZE);
  const img=new Image();
  img.onload=()=>{
    cropCtx.img=img;
    const fit=Math.min(CROP_SIZE/img.naturalWidth,CROP_SIZE/img.naturalHeight);
    cropCtx.baseScale=fit;
    cropCtx.scale=fit;
    cropCtx.x=(CROP_SIZE-img.naturalWidth*fit)/2;
    cropCtx.y=(CROP_SIZE-img.naturalHeight*fit)/2;
    cropCtx.box={x:CROP_SIZE*0.15,y:CROP_SIZE*0.15,w:CROP_SIZE*0.7,h:CROP_SIZE*0.7};
    E("cropZoom").value=1;
    drawCropCanvas();
    drawCropPreview();
    toast("Image loaded — drag/zoom karke crop karo");
  };
  img.onerror=()=>{toast("Image load failed — dobara choose karo.");E("cropper").hidden=true};
  img.src=dataUrl;
}
function drawCropCanvas(){
  const canvas=E("cropCanvas");
  const ctx=canvas.getContext("2d");
  const img=cropCtx.img;
  ctx.fillStyle="#2a1f37";
  ctx.fillRect(0,0,CROP_SIZE,CROP_SIZE);
  if(!img)return;
  ctx.save();
  ctx.translate(cropCtx.x,cropCtx.y);
  ctx.scale(cropCtx.scale,cropCtx.scale);
  ctx.drawImage(img,0,0);
  ctx.restore();
  const b=cropCtx.box;
  ctx.save();
  ctx.fillStyle="#00000066";
  ctx.beginPath();
  ctx.rect(0,0,CROP_SIZE,CROP_SIZE);
  if(cropCtx.shape==="circle"){
    ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,Math.PI*2,true);
  }else{
    ctx.rect(b.x,b.y,b.w,b.h);
  }
  ctx.fill("evenodd");
  ctx.restore();
  ctx.save();
  ctx.strokeStyle="#f4d28b";
  ctx.lineWidth=2;
  ctx.setLineDash([6,4]);
  if(cropCtx.shape==="circle"){
    ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,Math.PI*2);ctx.stroke();
  }else{
    ctx.strokeRect(b.x,b.y,b.w,b.h);
  }
  ctx.restore();
  ctx.save();
  ctx.fillStyle="#f4d28b";
  ctx.beginPath();ctx.arc(b.x+b.w,b.y+b.h,10,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  drawCropPreview();
}
function drawCropPreview(){
  const canvas=E("cropCanvas");
  const pcanvas=E("cropPreviewCanvas");
  const ctx=pcanvas.getContext("2d");
  const size=pcanvas.width;
  const b=cropCtx.box;
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle="#2a1f37";ctx.fillRect(0,0,size,size);
  if(!cropCtx.img)return;
  ctx.save();
  if(cropCtx.shape==="circle"){ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip()}
  const sx=(b.x-cropCtx.x)/cropCtx.scale;
  const sy=(b.y-cropCtx.y)/cropCtx.scale;
  const sw=b.w/cropCtx.scale;
  const sh=b.h/cropCtx.scale;
  ctx.drawImage(cropCtx.img,sx,sy,sw,sh,0,0,size,size);
  ctx.restore();
}
E("cropStage").addEventListener("pointerdown",e=>{
  const rect=E("cropStage").getBoundingClientRect();
  const px=e.clientX-rect.left,py=e.clientY-rect.top;
  const b=cropCtx.box;
  if(Math.hypot(px-(b.x+b.w),py-(b.y+b.h))<20){cropCtx.resizing=true;return}
  cropCtx.dragging=true;cropCtx.startX=e.clientX-cropCtx.x;cropCtx.startY=e.clientY-cropCtx.y;
  E("cropStage").setPointerCapture(e.pointerId);
});
E("cropStage").addEventListener("pointermove",e=>{
  const rect=E("cropStage").getBoundingClientRect();
  if(cropCtx.resizing){
    const px=e.clientX-rect.left,py=e.clientY-rect.top;
    const b=cropCtx.box;
    b.w=Math.max(40,px-b.x);
    b.h=Math.max(40,py-b.y);
    drawCropCanvas();return;
  }
  if(!cropCtx.dragging)return;
  cropCtx.x=e.clientX-cropCtx.startX;
  cropCtx.y=e.clientY-cropCtx.startY;
  drawCropCanvas();
});
E("cropStage").addEventListener("pointerup",()=>{cropCtx.dragging=false;cropCtx.resizing=false});
E("cropZoom").oninput=e=>{
  const old=cropCtx.scale;
  cropCtx.scale=Number(e.target.value)*cropCtx.baseScale;
  const cx=CROP_SIZE/2,cy=CROP_SIZE/2;
  cropCtx.x=cx-(cx-cropCtx.x)*(cropCtx.scale/old);
  cropCtx.y=cy-(cy-cropCtx.y)*(cropCtx.scale/old);
  drawCropCanvas();
};

const voiceChannel=new BroadcastChannel("voxa_voice_"+roomID);
const peers={};
let localStream=null;
function ensureMic(){
  if(localStream)return Promise.resolve(localStream);
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
    .then(s=>{localStream=s;micOn=true;E("micBtn").classList.remove("muted");return s})
    .catch(()=>{toast("Microphone permission denied.");return null});
}
function createPeer(peerId,isInitiator){
  if(peers[peerId])return peers[peerId];
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  peers[peerId]={pc,audio:null};
  if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{if(e.candidate)voiceChannel.postMessage({type:"ice",from:MY_ID,to:peerId,candidate:e.candidate})};
  pc.ontrack=e=>{
    const stream=e.streams[0];
    if(!peers[peerId].audio){
      peers[peerId].audio=new Audio();
      peers[peerId].audio.srcObject=stream;
      peers[peerId].audio.autoplay=true;
      peers[peerId].audio.play().catch(()=>{});
    }
  };
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==="connected"){toast("🔗 Voice connected: "+peerId)}
    if(pc.connectionState==="failed"||pc.connectionState==="disconnected"){closePeer(peerId)}
  };
  if(isInitiator){
    pc.onnegotiationneeded=async()=>{
      try{
        const offer=await pc.createOffer();
        await pc.setLocalDescription(offer);
        voiceChannel.postMessage({type:"offer",from:MY_ID,to:peerId,sdp:pc.localDescription});
      }catch(_){}
    };
  }
  return peers[peerId];
}
function closePeer(peerId){
  if(peers[peerId]){
    try{peers[peerId].pc.close()}catch(_){}
    if(peers[peerId].audio){peers[peerId].audio.pause();peers[peerId].audio.srcObject=null}
    delete peers[peerId];
  }
}
voiceChannel.onmessage=async e=>{
  const m=e.data;
  if(m.to!==MY_ID)return;
  if(m.type==="offer"){
    const p=createPeer(m.from,false);
    await p.pc.setRemoteDescription(m.sdp);
    const answer=await p.pc.createAnswer();
    await p.pc.setLocalDescription(answer);
    voiceChannel.postMessage({type:"answer",from:MY_ID,to:m.from,sdp:p.pc.localDescription});
  }else if(m.type==="answer"){
    if(peers[m.from])await peers[m.from].pc.setRemoteDescription(m.sdp);
  }else if(m.type==="ice"){
    if(peers[m.from])try{await peers[m.from].pc.addIceCandidate(m.candidate)}catch(_){}
  }else if(m.type==="leave"){
    closePeer(m.from);
  }
};

function roleTag(user){
  const role=(user.role||"").toLowerCase();
  if(role==="owner")return'<span class="role-tag owner">Owner</span>';
  if(role==="admin")return'<span class="role-tag admin">Admin</span>';
  if(role==="manager")return'<span class="role-tag manager">Manager</span>';
  if(role==="official")return'<span class="role-tag official">Official</span>';
  return"";
}
  
function tagsLine(user){
  let tags="";
  if(user.vip) tags+='<span class="tag">VIP</span>';

  const lv=user.levels||{};
  const p=lv.profile||user.level||0;
  const gs=lv.giftSend||0;
  const gr=lv.giftRecv||0;
  const g=lv.gaming||0;

  tags+='<span class="tag lvl">L'+p+'</span>';
  tags+='<span class="tag lvl">L'+gs+'</span>';
  tags+='<span class="tag lvl">L'+gr+'</span>';
  tags+='<span class="tag lvl">L'+g+'</span>';

  return '<div class="c-tags">'+tags+'</div>';
}
  
function picHtml(user){
  const photo = user.pic || user.photo || user.avatar ||
                user.photoURL || user.avatarUrl || user.image;
  const nm = user.name || user.nickname || "U";

  if (photo && typeof photo === "string" && photo.trim()) {
    return '<span class="c-pic"><img src="' +
      photo.trim().replace(/&/g, "&amp;").replace(/"/g, "&quot;") +
      '" alt="" onerror="this.style.display=\'none\';this.parentElement.textContent=\'U\'"></span>';
  }

  return '<span class="c-pic">' +
    nm.charAt(0).toUpperCase() + '</span>';
}

function shortName(nm){
  const words = (nm || "User").split(/\s+/);
  return words.length > 10
    ? words.slice(0, 10).join(" ") + "…"
    : nm;
}
  
function renderTaggedText(text){
  return text.replace(/@([\w\u0900-\u097F]+)/g,(m,name)=>{
    const tagged=(name.toLowerCase()===(ME.name||"").toLowerCase());
    return '<span class="tag-mention'+(tagged?' me':'')+'">@'+name+'</span>';
  });
}

function getRole(uid){
  if(String(uid)==="owner")return"owner";
  if((roomData.admins||[]).includes(String(uid)))return"admin";
  return"member";
}

function canModerate(actorRole,targetRole){
  if(actorRole==="owner")return targetRole!=="owner";
  if(actorRole==="admin")return targetRole==="member";
  return false;
}

function openFullProfile(user){
  if(!user){
    toast("User profile nahi mili.");
    return;
  }

  // Public UID ko priority do
  const publicUid=String(user.uid??"").trim();

  // Fallback sirf tab jab uid available na ho
  const internalId=String(user.id??"").trim();

  const uid=publicUid || internalId;

  if(!uid || ["undefined","null","guest"].includes(uid.toLowerCase())){
    toast("User ki valid profile ID nahi mili.");
    return;
  }

  const params=new URLSearchParams();
  params.set("uid",uid);

  if(user.name){
    params.set("name",String(user.name));
  }

  window.location.href="profile2.html?"+params.toString();
}

function joinSeat(n){
  if(mySeatNumber){toast("Pehle apni seat leave karo.");return}
  seatStates=loadJSON(seatKey,{});
  if(seatStates[n]){toast("Seat occupied.");return}
  seatStates[n]={id:MY_ID,uid:ME.uid||"",name:ME.name,pic:ME.pic||"",pp:ME.pp||"",muted:false,lastSeen:Date.now()};
  mySeatNumber=n;
  saveJSON(seatKey,seatStates);
  renderSeats();closePanel();
  toast("Seat "+n+" joined as "+ME.name);
  ensureMic().then(s=>{if(s)connectVoiceToAll()});
}
setInterval(()=>{
  if(!mySeatNumber)return;
  seatStates=loadJSON(seatKey,{});
  if(seatStates[mySeatNumber]){
    seatStates[mySeatNumber].lastSeen=Date.now();
    saveJSON(seatKey,seatStates);
  }
},5000);
setInterval(()=>{
  seatStates=loadJSON(seatKey,{});
  let changed=false;
  Object.keys(seatStates).forEach(k=>{
    const s=seatStates[k];
    if(s.lastSeen && Date.now()-s.lastSeen>15000){
      delete seatStates[k];
      changed=true;
      if(String(mySeatNumber)===String(k)){mySeatNumber=null;stopMic();disconnectVoiceAll();stopMusic()}
    }
  });
  if(changed){saveJSON(seatKey,seatStates);renderSeats()}
},5000);
window.addEventListener("beforeunload",()=>{
  if(!mySeatNumber)return;
  seatStates=loadJSON(seatKey,{});
  if(seatStates[mySeatNumber]){delete seatStates[mySeatNumber];saveJSON(seatKey,seatStates)}
  disconnectVoiceAll();
  stopMusic();
});
function leaveSeat(){
  if(!mySeatNumber){toast("Tum kisi seat par nahi ho.");return}
  stopMic();
  disconnectVoiceAll();
  stopMusic();
  delete seatStates[mySeatNumber];
  mySeatNumber=null;
  saveJSON(seatKey,seatStates);
  renderSeats();closePanel();toast("Seat left — music off");
}
async function startMic(){
  const s=await ensureMic();
  if(s)toast("Microphone on");
}
function stopMic(){
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  micOn=false;E("micBtn").classList.add("muted");
}
function toggleMic(){
  if(micOn){
    if(localStream){localStream.getTracks().forEach(t=>{if(t.kind==="audio")t.enabled=false})}
    micOn=false;E("micBtn").classList.add("muted");toast("Microphone muted");
  }else{
    if(localStream){localStream.getTracks().forEach(t=>{if(t.kind==="audio")t.enabled=true})}
    else{startMic();return}
    micOn=true;E("micBtn").classList.remove("muted");toast("Microphone unmuted");
  }
  if(mySeatNumber){
    seatStates=loadJSON(seatKey,{});
    if(seatStates[mySeatNumber]){seatStates[mySeatNumber].muted=!micOn;saveJSON(seatKey,seatStates)}
  }
  renderSeats();
}
function seatMenu(n){
  const body=panel("Seat "+n);
  if(String(mySeatNumber)===String(n)){
    action(body,"Leave seat",leaveSeat);
    action(body,micOn?"Mute microphone":"Unmute microphone",()=>{toggleMic();closePanel()});
    note(body,"Ye tumhari seat hai: "+ME.name+" (VoxaChat ID: "+MY_ID+")");
  }else if(seatStates[n]){
    userProfilePanel(seatStates[n],n);
    return;
  }else{
    action(body,"Join seat",()=>joinSeat(n));
    note(body,"Empty seat.");
  }
}
function renderSeats(){
  const area=E("seatsArea");
  area.replaceChildren();
  const grid=document.createElement("div");
  grid.className="grid";
  const calcS=loadJSON(calcKey,null);
  const calcActive=calcS&&calcS.status==="active"&&Date.now()<calcS.end;
  const maxRecv=calcActive?Math.max(1,...Object.values(calcS.recv||{})):1;
  for(let i=1;i<=seatCount;i++){
    const b=document.createElement("button");
    b.type="button";
    b.className="seat";
    const occupied=seatStates[i];
    const isMine=String(mySeatNumber)===String(i);
    const isMuted=occupied&&occupied.muted;
    let inner='<span class="avatar'+(occupied?" occupied":"")+(isMine&&!micOn?" muted":"")+'">';
    let label=String(i);
    if(occupied){
      if(occupied.pic){inner+='<img src="'+occupied.pic+'" alt="">'}
      else{inner+=(occupied.name||"U").charAt(0).toUpperCase()}
      label=shortName(occupied.name);
    }else{
      inner+='<svg><use href="#mic"/></svg>';
    }
    if(isMine&&isMuted)inner+='<span class="mute-badge"><svg><use href="#mic-off"/></svg></span>';
    inner+='</span><span class="seat-num">'+label+'</span>';
    if(calcActive&&occupied){
      const recv=(calcS.recv&&calcS.recv[occupied.id])||0;
      const pct=Math.min(100,(recv/maxRecv)*100);
      inner+='<span class="recv-line"><span class="recv-fill" style="width:'+pct+'%"></span></span>';
    }
    b.innerHTML=inner;
    b.onclick=()=>{
      if(occupied){
        if(isMine)seatMenu(i);
        else userProfilePanel(occupied,i);
      }else seatMenu(i);
    };
    grid.append(b);
  }
  area.append(grid);
  updateLiveCount();
  renderCalcBox();
}

let voxaReactionCleanup=null;

function playVoxaSeatEmoji(em){
  if(!mySeatNumber){
    toast("Pehle seat join karo.");
    return;
  }

  const seat=E("seatsArea")
    .querySelectorAll(".seat")[Number(mySeatNumber)-1];

  if(!seat){
    toast("Seat nahi mili.");
    return;
  }

  if(voxaReactionCleanup)voxaReactionCleanup();

  const avatar=seat.querySelector(".avatar")||seat;
  const oldPosition=avatar.style.position;
  const oldOverflow=avatar.style.overflow;

  avatar.style.position="relative";
  avatar.style.overflow="visible";

  const layer=document.createElement("span");

  Object.assign(layer.style,{
    position:"absolute",
    inset:"0",
    overflow:"visible",
    pointerEvents:"none",
    zIndex:"30"
  });

  layer.setAttribute("aria-hidden","true");
  avatar.appendChild(layer);

  const left=em==="😘 ⬅️";
  const right=em==="😘 ➡️";
  const kiss=left||right||em==="😘";
  const love=kiss||["❤️","😍","🥰","💋","🫂"].includes(em);
  const direction=left?-1:right?1:0;

  const emoji=document.createElement("span");
  emoji.textContent=(left||right)?"😘":em;

  Object.assign(emoji.style,{
    position:"absolute",
    inset:"-8px",
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    fontSize:"46px",
    lineHeight:"1",
    pointerEvents:"none",
    filter:"drop-shadow(0 4px 7px rgba(0,0,0,.4))"
  });

  layer.appendChild(emoji);

  const animations=[];
  const reduceMotion=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let frames;

  if(left||right){
    frames=[
      {transform:"scale(0)",opacity:0},
      {
        transform:"scale(1.2)",
        opacity:1,
        offset:.2
      },
      {
        transform:`translateX(${direction*15}px) rotate(${direction*15}deg)`,
        opacity:1,
        offset:.5
      },
      {
        transform:`translateX(${direction*30}px) scale(1.15)`,
        opacity:1,
        offset:.8
      },
      {
        transform:`translateX(${direction*45}px) scale(.5)`,
        opacity:0
      }
    ];
  }else if(love||em==="🔥"){
    frames=[
      {transform:"scale(0)",opacity:0},
      {transform:"scale(1.3)",opacity:1,offset:.15},
      {transform:"scale(.95)",opacity:1,offset:.3},
      {transform:"scale(1.25)",opacity:1,offset:.45},
      {transform:"scale(.95)",opacity:1,offset:.6},
      {transform:"scale(1.25)",opacity:1,offset:.8},
      {transform:"scale(.5) translateY(-25px)",opacity:0}
    ];
  }else{
    frames=[
      {transform:"scale(0)",opacity:0},
      {
        transform:"scale(1.25) rotate(-15deg)",
        opacity:1,
        offset:.15
      },
      {
        transform:"scale(1) rotate(15deg)",
        opacity:1,
        offset:.3
      },
      {
        transform:"scale(1.15) rotate(-15deg) translateY(-6px)",
        opacity:1,
        offset:.5
      },
      {
        transform:"scale(1) rotate(15deg)",
        opacity:1,
        offset:.7
      },
      {
        transform:"scale(1.1) rotate(0deg)",
        opacity:1,
        offset:.85
      },
      {
        transform:"scale(.5) translateY(-25px)",
        opacity:0
      }
    ];
  }

  if(!reduceMotion){
    animations.push(emoji.animate(frames,{
      duration:3500,
      easing:"ease-in-out",
      fill:"forwards"
    }));

    // Love/kiss ke saath chhote flying hearts
    if(love){
      for(let i=0;i<4;i++){
        const heart=document.createElement("span");
        heart.textContent="💕";

        Object.assign(heart.style,{
          position:"absolute",
          left:"50%",
          top:"40%",
          fontSize:"20px",
          lineHeight:"1",
          opacity:"0",
          pointerEvents:"none"
        });

        layer.appendChild(heart);

        const x=direction
          ?direction*(20+i*9)
          :(i-1.5)*20;

        animations.push(heart.animate([
          {
            transform:"translate(-50%,-50%) scale(.3)",
            opacity:0
          },
          {
            transform:`translate(calc(-50% + ${x*.4}px),-25px) scale(1)`,
            opacity:1,
            offset:.35
          },
          {
            transform:`translate(calc(-50% + ${x}px),-60px) scale(.5)`,
            opacity:0
          }
        ],{
          duration:1700,
          delay:300+i*300,
          easing:"ease-out",
          fill:"both"
        }));
      }
    }
  }

  const timer=setTimeout(cleanup,3500);

  function cleanup(){
    clearTimeout(timer);
    animations.forEach(animation=>animation.cancel());
    layer.remove();

    avatar.style.position=oldPosition;
    avatar.style.overflow=oldOverflow;

    if(voxaReactionCleanup===cleanup){
      voxaReactionCleanup=null;
    }
  }

  voxaReactionCleanup=cleanup;
}

function playTrack(i){

  musicAudio.onerror=()=>toast("⚠️ Song play error");
  const now=E("mpNow");
  if(now)now.textContent=myPlaylist[i].name;
  const pl=E("mpPlay");
  if(pl)pl.textContent="⏸";
  renderListSafe();
  renderMiniPlayer();

function renderMiniPlayer(){
  const host=E("miniPlayerHost");
  if(miniHidden||currentTrackIdx<0||!musicAudio){host.replaceChildren();return}

  const mp=document.createElement("div");

    drag={x:e.clientX-mp.offsetLeft,y:e.clientY-mp.offsetTop};

  });

function startCalcSession(title,minutes){
  const s={id:"calc_"+roomID+"_"+Date.now(),room:roomID,creator:MY_ID,title:title,minutes:minutes,start:Date.now(),end:Date.now()+minutes*60*1000,status:"active",recv:{},send:{},txs:{},box:{x:120,y:120,w:180,h:220}};
  saveJSON(calcKey,s);
  audit("calc_start",s.id,MY_ID);
  calcChannel.postMessage({type:"calc_start",session:s});
  renderCalcBox();
  renderSeats();
}
function calcRecordGift(receiverId,buyValue){
  const s=loadJSON(calcKey,null);
  if(!s||s.status!=="active"||Date.now()>=s.end)return;
  const txId=receiverId+"_"+buyValue+"_"+Date.now();
  if(s.txs[txId])return;
  s.txs[txId]=true;
  s.recv[receiverId]=(s.recv[receiverId]||0)+buyValue;
  s.send[receiverId]=(s.send[receiverId]||0)+buyValue;
  saveJSON(calcKey,s);
  calcChannel.postMessage({type:"calc_update",session:s});
  renderCalcBox();
  renderSeats();
}
function renderCalcBox(){
  const host=E("calcBoxHost");
  const s=loadJSON(calcKey,null);

    host.replaceChildren();

  if(!host.querySelector(".calc-box")){
    const box=document.createElement("div");

      +'<div class="cb-top" id="cbTop"></div>'
      +'<div class="cb-resize" id="cbResize"></div>';
    host.replaceChildren(box);
    const cb=box;
    let drag=null,resize=null;
    cb.addEventListener("pointerdown",e=>{

      if(e.target.id==="cbClose")return;
      drag={x:e.clientX-cb.offsetLeft,y:e.clientY-cb.offsetTop};
      cb.setPointerCapture(e.pointerId);
    });
    cb.addEventListener("pointermove",e=>{
      if(resize){
        cb.style.width=Math.max(120,resize.w+(e.clientX-resize.x))+"px";
        cb.style.height=Math.max(120,resize.h+(e.clientY-resize.y))+"px";
        return;
      }
      if(!drag)return;
      cb.style.left=(e.clientX-drag.x)+"px";
      cb.style.top=(e.clientY-drag.y)+"px";
    });
    cb.addEventListener("pointerup",()=>{
      drag=null;resize=null;
      const ns=loadJSON(calcKey,null);
      if(ns){ns.box={x:cb.offsetLeft,y:cb.offsetTop,w:cb.offsetWidth,h:cb.offsetHeight};saveJSON(calcKey,ns)}
    });
    E("cbClose").onclick=()=>{host.replaceChildren();toast("Box hidden — Play Center se wapas dikha sakte ho")};
  }
  const left=s.end-Date.now();
  const timer=E("cbTimer");
  if(timer){
    if(left<=0){endCalcSession();return}
    const mm=Math.floor(left/60000),ss=Math.floor((left%60000)/1000);
    timer.textContent=String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  }
  const top=E("cbTop");
  if(top){
    const entries=Object.entries(s.recv||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);
    top.replaceChildren();
    if(entries.length===0){const p=document.createElement("div");p.textContent="Abhi koi receiving nahi.";top.append(p)}

      const seat=Object.values(seatStates).find(x=>String(x.id)===String(uid));

  }

<script>
function applyRoomEmoji(imageSource){
  const seat=document.querySelector(".avatar-circle");

  if(!seat){
    alert("Seat nahi mila.");
    return;
  }

  let emojiImg=seat.querySelector(".seat-emoji");

  if(!emojiImg){
    emojiImg=document.createElement("img");
    emojiImg.className="seat-emoji";
    emojiImg.alt="Emoji";
    seat.appendChild(emojiImg);
  }

  emojiImg.src=imageSource;

  setTimeout(()=>{
    emojiImg.classList.add("show");
    seat.classList.add("has-effect");
  },50);
}

function clearRoomEmoji(){
  const seat=document.querySelector(".avatar-circle");

  if(!seat) return;

  const emojiImg=seat.querySelector(".seat-emoji");

  if(emojiImg){
    emojiImg.classList.remove("show");
    setTimeout(()=>{
      emojiImg.src="";
    },400);
  }

  seat.classList.remove("has-effect");
}
</script>
