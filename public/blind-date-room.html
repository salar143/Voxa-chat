<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>VoxaChat Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #110c19;
  color: #fff;
  font: 13px Arial, sans-serif;
  display: flex;
  justify-content: center;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

[hidden] {
  display: none !important;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #f6d697;
  outline-offset: 3px;
}

.app {
  --bg:
    radial-gradient(
      ellipse at 10% 32%,
      #bd985c70,
      transparent 48%
    ),
    linear-gradient(
      160deg,
      #4c2357,
      #513544 42%,
      #211c32 78%,
      #100d1b
    );

  width: 100%;
  max-width: 480px;
  height: 100svh;
  min-height: 450px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.app[data-theme="midnight"] {
  --bg:
    radial-gradient(
      at 20% 10%,
      #492c7566,
      transparent 55%
    ),
    linear-gradient(#1a112e, #0d0b18);
}

.app[data-theme="ocean"] {
  --bg:
    radial-gradient(
      at 15% 30%,
      #2fafa966,
      transparent 55%
    ),
    linear-gradient(#173343, #101522);
}

.app[data-theme="rose"] {
  --bg:
    radial-gradient(
      at 15% 30%,
      #c9658c55,
      transparent 55%
    ),
    linear-gradient(#532844, #221327);
}

/* HEADER */

.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 10px 8px;
  padding-top: max(12px, env(safe-area-inset-top));
  flex-shrink: 0;
}

.room-photo {
  width: 43px;
  height: 43px;
  border: 2px solid #edd18e;
  border-radius: 11px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #2a1f37;
  flex-shrink: 0;
}

.room-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info {
  flex: 1;
  min-width: 0;
}

.title {
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub {
  font-size: 10px;
  color: #ecdbea;
  margin-top: 5px;
}

.icon {
  background: none;
  border: 0;
  width: 32px;
  height: 36px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 12px 10px;
  font-size: 10px;
  color: #f0deef;
}

.status {
  font-size: 10px;
  color: #f6d697;
  max-width: 55%;
  text-align: right;
}

/* CONTINUOUS SEAT GRID */

.seats {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 8px 20px;
  scrollbar-width: none;
}

.seats::-webkit-scrollbar {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 22px 4px;
}

.seat {
  border: 0;
  background: none;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.avatar {
  width: clamp(42px, 12.8vw, 59px);
  height: clamp(42px, 12.8vw, 59px);
  border: 1px solid #ffffff66;
  background: #ffffff12;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
}

.avatar svg {
  color: #dfc9e7;
  width: 23px;
  height: 23px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.avatar.occupied {
  border: 2px solid #edd18e;
}

.badge {
  position: absolute;
  bottom: -3px;
  left: -3px;
  min-width: 16px;
  height: 16px;
  border-radius: 9px;
  background: #b269cf;
  border: 1px solid #efcfff;
  display: grid;
  place-items: center;
  padding: 0 3px;
  font-size: 8px;
}

.name {
  font-size: 10px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* BLIND DATE */

.hosts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}

.hosts .avatar {
  width: 65px;
  height: 65px;
}

.pairs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 23px 12px;
}

.pair {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    14px
    minmax(0, 1fr);
  align-items: center;
}

.heart {
  color: #ffb6d4;
  text-align: center;
}

/* CHAT AND SIDE BUTTONS */

.announcement {
  margin: 0 12px 8px;
  font-size: 11px;
  color: #f2dca7;
  overflow-wrap: anywhere;
}

.lower {
  min-height: 108px;
  height: 135px;
  position: relative;
  padding: 6px 60px 6px 12px;
  flex-shrink: 0;
}

.chat {
  height: 100%;
  overflow: auto;
  font-size: 11px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.msg {
  margin-bottom: 5px;
}

.system {
  color: #efd18b;
  font-size: 10px;
}

.side {
  position: absolute;
  right: 10px;
  bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.side button {
  width: 39px;
  height: 39px;
  border: 1px solid #ffffff44;
  border-radius: 12px;
  background: #ffffff18;
  display: grid;
  place-items: center;
}

.side .inbox {
  background: #687ac7bb;
}

/* BOTTOM ICONS */

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
  padding: 8px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: #130d22b0;
  flex-shrink: 0;
}

.left {
  display: flex;
  align-items: center;
  gap: 13px;
}

.muted {
  color: #ffa6bb;
}

.gold {
  color: #f4d28b;
}

/* MESSAGE INPUT */

.composer {
  display: flex;
  gap: 6px;
  padding: 9px;
  background: #271a36;
}

.composer input {
  min-width: 0;
  flex: 1;
  border: 1px solid #ffffff33;
  border-radius: 22px;
  background: #ffffff0a;
  padding: 10px 12px;
  color: white;
}

.emoji {
  position: absolute;
  bottom: 65px;
  left: 12px;
  background: #2b1c39;
  border: 1px solid #ffffff33;
  border-radius: 14px;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 5;
}

.emoji button {
  border: 0;
  background: none;
  font-size: 24px;
  padding: 6px;
}

/* OPTIONS AND EXIT/MINIMIZE PANEL */

.overlay {
  position: absolute;
  inset: 0;
  background: #0009;
  z-index: 8;
}

.panel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 78%;
  overflow: auto;
  background: #261a35;
  border: 1px solid #ffffff22;
  border-radius: 24px 24px 0 0;
  padding: 18px 15px max(20px, env(safe-area-inset-bottom));
  z-index: 9;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.panel h2 {
  font-size: 16px;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.opt {
  border: 1px solid #ffffff26;
  background: #ffffff08;
  border-radius: 12px;
  padding: 13px 9px;
  text-align: center;
}

.wide {
  width: 100%;
  margin-top: 9px;
  text-align: left;
}

.danger {
  color: #ffb0c0;
}

.note {
  font-size: 11px;
  color: #d1bddb;
  line-height: 1.6;
  margin: 12px 0;
}

.error {
  padding: 9px 12px;
  background: #7c153b99;
  color: #ffe4ed;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.restore {
  position: fixed;
  bottom: 20px;
  right: 18px;
  background: #3b284c;
  border: 1px solid #f4d28b;
  border-radius: 30px;
  padding: 13px 18px;
}

.toast {
  position: absolute;
  bottom: 80px;
  left: 15px;
  right: 15px;
  padding: 12px;
  background: #21132ef5;
  border: 1px solid #ffffff44;
  border-radius: 12px;
  z-index: 15;
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

dialog {
  margin: auto;
  width: calc(100% - 36px);
  max-width: 360px;
  background: #291b38;
  border: 1px solid #ffffff44;
  border-radius: 18px;
  color: white;
  padding: 20px;
}

dialog::backdrop {
  background: #0009;
}

dialog p {
  white-space: pre-line;
  font-size: 12px;
  line-height: 1.7;
  margin: 12px 0;
}

.small {
  font-size: 9px;
  color: #dfcbe5;
}

@media (max-height: 650px) {
  .lower {
    height: 90px;
    min-height: 80px;
  }

  .grid {
    gap: 15px 4px;
  }
}
</style>
</head>

<body>

<!-- REUSABLE SVG ICONS -->
<svg
  style="position:absolute;width:0;height:0"
  aria-hidden="true"
>
  <defs>

    <symbol id="mic" viewBox="0 0 24 24">
      <rect
        x="9"
        y="2"
        width="6"
        height="13"
        rx="3"
      />
      <path
        d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"
      />
    </symbol>

    <symbol id="lock" viewBox="0 0 24 24">
      <rect
        x="5"
        y="10"
        width="14"
        height="11"
        rx="2"
      />
      <path
        d="M8 10V6a4 4 0 0 1 8 0v4M12 15v2"
      />
    </symbol>

    <symbol id="user" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4" />
      <path d="M4 22v-3a8 8 0 0 1 16 0v3" />
    </symbol>

    <symbol id="share" viewBox="0 0 24 24">
      <path
        d="M14 3h7v7M21 3L10 14M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"
      />
    </symbol>

    <symbol id="more" viewBox="0 0 24 24">
      <path
        d="M12 4h.01M12 12h.01M12 20h.01"
        stroke-width="4"
      />
    </symbol>

    <symbol id="power" viewBox="0 0 24 24">
      <path d="M12 2v10M6 5a9 9 0 1 0 12 0" />
    </symbol>

    <symbol id="audio" viewBox="0 0 24 24">
      <path
        d="M10 4L5 8H2v8h3l5 4zM14 8a6 6 0 0 1 0 8M17 4a11 11 0 0 1 0 16"
      />
    </symbol>

    <symbol id="smile" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <path
        d="M8 14a4.5 4.5 0 0 0 8 0M8 9h.01M16 9h.01"
      />
    </symbol>

    <symbol id="chat" viewBox="0 0 24 24">
      <path
        d="M20 3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3v3l5-3h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM7 11h.01M12 11h.01M17 11h.01"
      />
    </symbol>

    <symbol id="apply" viewBox="0 0 24 24">
      <path
        d="M8 12V5a1.5 1.5 0 0 1 3 0v6-8a1.5 1.5 0 0 1 3 0v8-6a1.5 1.5 0 0 1 3 0v7-4a1.5 1.5 0 0 1 3 0v7c0 5-3 7-7 7h-1c-3 0-4-2-6-5l-3-4a1.5 1.5 0 0 1 2-2l3 3"
      />
    </symbol>

    <symbol id="grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="2" />
      <rect x="14" y="3" width="7" height="7" rx="2" />
      <rect x="3" y="14" width="7" height="7" rx="2" />
      <rect x="14" y="14" width="7" height="7" rx="2" />
    </symbol>

    <symbol id="send" viewBox="0 0 24 24">
      <path d="M22 2L9 15M22 2l-7 20-6-7-7-6z" />
    </symbol>

  </defs>
</svg>

<!-- MAIN ROOM -->
<main class="app" id="app" data-theme="sunset">

  <!-- TOP HEADER -->
  <header class="topbar">

    <div class="room-photo" id="roomPhoto">♫</div>

    <div class="info">
      <div class="title" id="roomTitle">
        Loading room…
      </div>

      <div class="sub">
        ID: <span id="roomID">—</span>
      </div>
    </div>

    <button
      type="button"
      class="icon"
      id="shareBtn"
      aria-label="Share room"
    ></button>

    <button
      type="button"
      class="icon"
      id="moreBtn"
      aria-label="Room menu"
    ></button>

    <button
      type="button"
      class="icon"
      id="powerBtn"
      aria-label="Exit or minimize"
    ></button>

  </header>

  <!-- MODE AND CONNECTION STATUS -->
  <div class="line">
    <span id="modeLabel">Room</span>
    <span class="status" id="roomStatus">Loading</span>
  </div>

  <!-- ERROR MESSAGE -->
  <div
    class="error"
    id="errorBox"
    role="alert"
    hidden
  ></div>

  <!-- SEATS: GENERATED BY JAVASCRIPT -->
  <section
    class="seats"
    id="seatsArea"
    aria-label="Room seats"
  ></section>

  <!-- ROOM ANNOUNCEMENT -->
  <div
    class="announcement"
    id="announcement"
    hidden
  ></div>

  <!-- ROOM CHAT AND RIGHT-SIDE BUTTONS -->
  <section class="lower">

    <section
      class="chat"
      id="chatBox"
      aria-label="Room messages"
      aria-live="polite"
    ></section>

    <div class="side">

      <!-- INBOX ABOVE APPLY -->
      <button
        type="button"
        class="inbox"
        id="inboxBtn"
        aria-label="Inbox"
      ></button>

      <button
        type="button"
        id="applyBtn"
        aria-label="Join or leave seat"
        disabled
      ></button>

    </div>

  </section>

  <!-- HIDDEN UNTIL CHAT ICON IS TAPPED -->
  <form class="composer" id="composer" hidden>

    <input
      id="msgInput"
      maxlength="1000"
      placeholder="Message…"
      aria-label="Room message"
      autocomplete="off"
    >

    <button
      type="submit"
      class="icon"
      id="sendBtn"
      aria-label="Send message"
    ></button>

    <button
      type="button"
      class="icon"
      id="closeComposer"
      aria-label="Close message input"
    >×</button>

  </form>

  <!-- BOTTOM CONTROLS -->
  <footer class="bottom">

    <div class="left">

      <button
        type="button"
        class="icon"
        id="audioBtn"
        aria-label="Mute room audio"
        aria-pressed="false"
      ></button>

      <button
        type="button"
        class="icon"
        id="emojiBtn"
        aria-label="Emoji"
      ></button>

      <button
        type="button"
        class="icon"
        id="chatBtn"
        aria-label="Write room message"
      ></button>

    </div>

    <button
      type="button"
      class="icon"
      id="micBtn"
      aria-label="Start or mute microphone"
      disabled
    ></button>

    <!-- FOUR-DOT MENU: INCLUDES CHANGE THEME -->
    <button
      type="button"
      class="icon gold"
      id="optionsBtn"
      aria-label="Room options"
    ></button>

  </footer>

  <!-- EMOJI PICKER -->
  <div
    class="emoji"
    id="emojiPicker"
    hidden
  ></div>

  <!-- MENU BACKDROP -->
  <div
    class="overlay"
    id="overlay"
    hidden
  ></div>

  <!-- OPTIONS / THEME / EXIT / SEAT MENU -->
  <section
    class="panel"
    id="panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="panelTitle"
    hidden
  >

    <div class="panel-head">
      <h2 id="panelTitle">Room options</h2>

      <button
        type="button"
        class="icon"
        id="closePanelBtn"
        aria-label="Close menu"
      >×</button>
    </div>

    <div id="panelBody"></div>

  </section>

  <!-- SMALL STATUS MESSAGE -->
  <div
    class="toast"
    id="toast"
    role="status"
    hidden
  ></div>

  <!-- REMOTE VOICE AUDIO ELEMENTS -->
  <div id="remoteAudio"></div>

</main>

<!-- SAME-PAGE MINIMIZED ROOM BUTTON -->
<button
  type="button"
  class="restore"
  id="restoreBtn"
  hidden
>
  ♫ Return to room
</button>

<!-- MESSAGE DIALOG -->
<dialog id="messageDialog">

  <h3 id="dialogTitle">VoxaChat</h3>

  <p id="dialogText"></p>

  <button
    type="button"
    class="opt wide"
    id="dialogOK"
  >
    OK
  </button>

</dialog>

<script>
"use strict";
