<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>VoxaChat Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #110c19;
  color: #fff;
  font: 13px Arial, sans-serif;
  display: flex;
  justify-content: center;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

[hidden] {
  display: none !important;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #f6d697;
  outline-offset: 3px;
}

.app {
  --bg:
    radial-gradient(
      ellipse at 10% 32%,
      #bd985c70,
      transparent 48%
    ),
    linear-gradient(
      160deg,
      #4c2357,
      #513544 42%,
      #211c32 78%,
      #100d1b
    );

  width: 100%;
  max-width: 480px;
  height: 100svh;
  min-height: 450px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.app[data-theme="midnight"] {
  --bg:
    radial-gradient(
      at 20% 10%,
      #492c7566,
      transparent 55%
    ),
    linear-gradient(#1a112e, #0d0b18);
}

.app[data-theme="ocean"] {
  --bg:
    radial-gradient(
      at 15% 30%,
      #2fafa966,
      transparent 55%
    ),
    linear-gradient(#173343, #101522);
}

.app[data-theme="rose"] {
  --bg:
    radial-gradient(
      at 15% 30%,
      #c9658c55,
      transparent 55%
    ),
    linear-gradient(#532844, #221327);
}

/* HEADER */

.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 10px 8px;
  padding-top: max(12px, env(safe-area-inset-top));
  flex-shrink: 0;
}

.room-photo {
  width: 43px;
  height: 43px;
  border: 2px solid #edd18e;
  border-radius: 11px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #2a1f37;
  flex-shrink: 0;
}

.room-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info {
  flex: 1;
  min-width: 0;
}

.title {
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub {
  font-size: 10px;
  color: #ecdbea;
  margin-top: 5px;
}

.icon {
  background: none;
  border: 0;
  width: 32px;
  height: 36px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 12px 10px;
  font-size: 10px;
  color: #f0deef;
}

.status {
  font-size: 10px;
  color: #f6d697;
  max-width: 55%;
  text-align: right;
}

/* CONTINUOUS SEAT GRID */

.seats {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 8px 20px;
  scrollbar-width: none;
}

.seats::-webkit-scrollbar {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 22px 4px;
}

.seat {
  border: 0;
  background: none;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.avatar {
  width: clamp(42px, 12.8vw, 59px);
  height: clamp(42px, 12.8vw, 59px);
  border: 1px solid #ffffff66;
  background: #ffffff12;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
}

.avatar svg {
  color: #dfc9e7;
  width: 23px;
  height: 23px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.avatar.occupied {
  border: 2px solid #edd18e;
}

.badge {
  position: absolute;
  bottom: -3px;
  left: -3px;
  min-width: 16px;
  height: 16px;
  border-radius: 9px;
  background: #b269cf;
  border: 1px solid #efcfff;
  display: grid;
  place-items: center;
  padding: 0 3px;
  font-size: 8px;
}

.name {
  font-size: 10px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* BLIND DATE */

.hosts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}

.hosts .avatar {
  width: 65px;
  height: 65px;
}

.pairs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 23px 12px;
}

.pair {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    14px
    minmax(0, 1fr);
  align-items: center;
}

.heart {
  color: #ffb6d4;
  text-align: center;
}

/* CHAT AND SIDE BUTTONS */

.announcement {
  margin: 0 12px 8px;
  font-size: 11px;
  color: #f2dca7;
  overflow-wrap: anywhere;
}

.lower {
  min-height: 108px;
  height: 135px;
  position: relative;
  padding: 6px 60px 6px 12px;
  flex-shrink: 0;
}

.chat {
  height: 100%;
  overflow: auto;
  font-size: 11px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.msg {
  margin-bottom: 5px;
}

.system {
  color: #efd18b;
  font-size: 10px;
}

.side {
  position: absolute;
  right: 10px;
  bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.side button {
  width: 39px;
  height: 39px;
  border: 1px solid #ffffff44;
  border-radius: 12px;
  background: #ffffff18;
  display: grid;
  place-items: center;
}

.side .inbox {
  background: #687ac7bb;
}

/* BOTTOM ICONS */

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
  padding: 8px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: #130d22b0;
  flex-shrink: 0;
}

.left {
  display: flex;
  align-items: center;
  gap: 13px;
}

.muted {
  color: #ffa6bb;
}

.gold {
  color: #f4d28b;
}

/* MESSAGE INPUT */

.composer {
  display: flex;
  gap: 6px;
  padding: 9px;
  background: #271a36;
}

.composer input {
  min-width: 0;
  flex: 1;
  border: 1px solid #ffffff33;
  border-radius: 22px;
  background: #ffffff0a;
  padding: 10px 12px;
  color: white;
}

.emoji {
  position: absolute;
  bottom: 65px;
  left: 12px;
  background: #2b1c39;
  border: 1px solid #ffffff33;
  border-radius: 14px;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 5;
}

.emoji button {
  border: 0;
  background: none;
  font-size: 24px;
  padding: 6px;
}

/* OPTIONS AND EXIT/MINIMIZE PANEL */

.overlay {
  position: absolute;
  inset: 0;
  background: #0009;
  z-index: 8;
}

.panel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 78%;
  overflow: auto;
  background: #261a35;
  border: 1px solid #ffffff22;
  border-radius: 24px 24px 0 0;
  padding: 18px 15px max(20px, env(safe-area-inset-bottom));
  z-index: 9;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.panel h2 {
  font-size: 16px;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.opt {
  border: 1px solid #ffffff26;
  background: #ffffff08;
  border-radius: 12px;
  padding: 13px 9px;
  text-align: center;
}

.wide {
  width: 100%;
  margin-top: 9px;
  text-align: left;
}

.danger {
  color: #ffb0c0;
}

.note {
  font-size: 11px;
  color: #d1bddb;
  line-height: 1.6;
  margin: 12px 0;
}

.error {
  padding: 9px 12px;
  background: #7c153b99;
  color: #ffe4ed;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.restore {
  position: fixed;
  bottom: 20px;
  right: 18px;
  background: #3b284c;
  border: 1px solid #f4d28b;
  border-radius: 30px;
  padding: 13px 18px;
}

.toast {
  position: absolute;
  bottom: 80px;
  left: 15px;
  right: 15px;
  padding: 12px;
  background: #21132ef5;
  border: 1px solid #ffffff44;
  border-radius: 12px;
  z-index: 15;
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

dialog {
  margin: auto;
  width: calc(100% - 36px);
  max-width: 360px;
  background: #291b38;
  border: 1px solid #ffffff44;
  border-radius: 18px;
  color: white;
  padding: 20px;
}

dialog::backdrop {
  background: #0009;
}

dialog p {
  white-space: pre-line;
  font-size: 12px;
  line-height: 1.7;
  margin: 12px 0;
}

.small {
  font-size: 9px;
  color: #dfcbe5;
}

@media (max-height: 650px) {
  .lower {
    height: 90px;
    min-height: 80px;
  }

  .grid {
    gap: 15px 4px;
  }
}
</style>
</head>

<body>

<!-- REUSABLE SVG ICONS -->
<svg
  style="position:absolute;width:0;height:0"
  aria-hidden="true"
>
  <defs>

    <symbol id="mic" viewBox="0 0 24 24">
      <rect
        x="9"
        y="2"
        width="6"
        height="13"
        rx="3"
      />
      <path
        d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"
      />
    </symbol>

    <symbol id="lock" viewBox="0 0 24 24">
      <rect
        x="5"
        y="10"
        width="14"
        height="11"
        rx="2"
      />
      <path
        d="M8 10V6a4 4 0 0 1 8 0v4M12 15v2"
      />
    </symbol>

    <symbol id="user" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4" />
      <path d="M4 22v-3a8 8 0 0 1 16 0v3" />
    </symbol>

    <symbol id="share" viewBox="0 0 24 24">
      <path
        d="M14 3h7v7M21 3L10 14M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"
      />
    </symbol>

    <symbol id="more" viewBox="0 0 24 24">
      <path
        d="M12 4h.01M12 12h.01M12 20h.01"
        stroke-width="4"
      />
    </symbol>

    <symbol id="power" viewBox="0 0 24 24">
      <path d="M12 2v10M6 5a9 9 0 1 0 12 0" />
    </symbol>

    <symbol id="audio" viewBox="0 0 24 24">
      <path
        d="M10 4L5 8H2v8h3l5 4zM14 8a6 6 0 0 1 0 8M17 4a11 11 0 0 1 0 16"
      />
    </symbol>

    <symbol id="smile" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <path
        d="M8 14a4.5 4.5 0 0 0 8 0M8 9h.01M16 9h.01"
      />
    </symbol>

    <symbol id="chat" viewBox="0 0 24 24">
      <path
        d="M20 3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3v3l5-3h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM7 11h.01M12 11h.01M17 11h.01"
      />
    </symbol>

    <symbol id="apply" viewBox="0 0 24 24">
      <path
        d="M8 12V5a1.5 1.5 0 0 1 3 0v6-8a1.5 1.5 0 0 1 3 0v8-6a1.5 1.5 0 0 1 3 0v7-4a1.5 1.5 0 0 1 3 0v7c0 5-3 7-7 7h-1c-3 0-4-2-6-5l-3-4a1.5 1.5 0 0 1 2-2l3 3"
      />
    </symbol>

    <symbol id="grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="2" />
      <rect x="14" y="3" width="7" height="7" rx="2" />
      <rect x="3" y="14" width="7" height="7" rx="2" />
      <rect x="14" y="14" width="7" height="7" rx="2" />
    </symbol>

    <symbol id="send" viewBox="0 0 24 24">
      <path d="M22 2L9 15M22 2l-7 20-6-7-7-6z" />
    </symbol>

  </defs>
</svg>

<!-- MAIN ROOM -->
<main class="app" id="app" data-theme="sunset">

  <!-- TOP HEADER -->
  <header class="topbar">

    <div class="room-photo" id="roomPhoto">♫</div>

    <div class="info">
      <div class="title" id="roomTitle">
        Loading room…
      </div>

      <div class="sub">
        ID: <span id="roomID">—</span>
      </div>
    </div>

    <button
      type="button"
      class="icon"
      id="shareBtn"
      aria-label="Share room"
    ></button>

    <button
      type="button"
      class="icon"
      id="moreBtn"
      aria-label="Room menu"
    ></button>

    <button
      type="button"
      class="icon"
      id="powerBtn"
      aria-label="Exit or minimize"
    ></button>

  </header>

  <!-- MODE AND CONNECTION STATUS -->
  <div class="line">
    <span id="modeLabel">Room</span>
    <span class="status" id="roomStatus">Loading</span>
  </div>

  <!-- ERROR MESSAGE -->
  <div
    class="error"
    id="errorBox"
    role="alert"
    hidden
  ></div>

  <!-- SEATS: GENERATED BY JAVASCRIPT -->
  <section
    class="seats"
    id="seatsArea"
    aria-label="Room seats"
  ></section>

  <!-- ROOM ANNOUNCEMENT -->
  <div
    class="announcement"
    id="announcement"
    hidden
  ></div>

  <!-- ROOM CHAT AND RIGHT-SIDE BUTTONS -->
  <section class="lower">

    <section
      class="chat"
      id="chatBox"
      aria-label="Room messages"
      aria-live="polite"
    ></section>

    <div class="side">

      <!-- INBOX ABOVE APPLY -->
      <button
        type="button"
        class="inbox"
        id="inboxBtn"
        aria-label="Inbox"
      ></button>

      <button
        type="button"
        id="applyBtn"
        aria-label="Join or leave seat"
        disabled
      ></button>

    </div>

  </section>

  <!-- HIDDEN UNTIL CHAT ICON IS TAPPED -->
  <form class="composer" id="composer" hidden>

    <input
      id="msgInput"
      maxlength="1000"
      placeholder="Message…"
      aria-label="Room message"
      autocomplete="off"
    >

    <button
      type="submit"
      class="icon"
      id="sendBtn"
      aria-label="Send message"
    ></button>

    <button
      type="button"
      class="icon"
      id="closeComposer"
      aria-label="Close message input"
    >×</button>

  </form>

  <!-- BOTTOM CONTROLS -->
  <footer class="bottom">

    <div class="left">

      <button
        type="button"
        class="icon"
        id="audioBtn"
        aria-label="Mute room audio"
        aria-pressed="false"
      ></button>

      <button
        type="button"
        class="icon"
        id="emojiBtn"
        aria-label="Emoji"
      ></button>

      <button
        type="button"
        class="icon"
        id="chatBtn"
        aria-label="Write room message"
      ></button>

    </div>

    <button
      type="button"
      class="icon"
      id="micBtn"
      aria-label="Start or mute microphone"
      disabled
    ></button>

    <!-- FOUR-DOT MENU: INCLUDES CHANGE THEME -->
    <button
      type="button"
      class="icon gold"
      id="optionsBtn"
      aria-label="Room options"
    ></button>

  </footer>

  <!-- EMOJI PICKER -->
  <div
    class="emoji"
    id="emojiPicker"
    hidden
  ></div>

  <!-- MENU BACKDROP -->
  <div
    class="overlay"
    id="overlay"
    hidden
  ></div>

  <!-- OPTIONS / THEME / EXIT / SEAT MENU -->
  <section
    class="panel"
    id="panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="panelTitle"
    hidden
  >

    <div class="panel-head">
      <h2 id="panelTitle">Room options</h2>

      <button
        type="button"
        class="icon"
        id="closePanelBtn"
        aria-label="Close menu"
      >×</button>
    </div>

    <div id="panelBody"></div>

  </section>

  <!-- SMALL STATUS MESSAGE -->
  <div
    class="toast"
    id="toast"
    role="status"
    hidden
  ></div>

  <!-- REMOTE VOICE AUDIO ELEMENTS -->
  <div id="remoteAudio"></div>

</main>

<!-- SAME-PAGE MINIMIZED ROOM BUTTON -->
<button
  type="button"
  class="restore"
  id="restoreBtn"
  hidden
>
  ♫ Return to room
</button>

<!-- MESSAGE DIALOG -->
<dialog id="messageDialog">

  <h3 id="dialogTitle">VoxaChat</h3>

  <p id="dialogText"></p>

  <button
    type="button"
    class="opt wide"
    id="dialogOK"
  >
    OK
  </button>

</dialog>

<script>
"use strict";
/*
  DEFAULT: local room mode.

  sharedBackend ko true tabhi karna jab supplied SQL setup
  aur voxa_rooms records properly configure ho chuke hon.

  Voice ke server secrets kabhi HTML mein mat rakhna.
*/
const CONFIG = {
  sharedBackend: true,

    supabaseUrl:
    "https://mblcbygpqbogmtzacbtz.supabase.co",

  supabaseAnonKey:
    "sb_publishable_d0jKzXs_b-tBVzhusjYKJw_ZdPkMxdV",

  voiceTokenEndpoint: "",
  livekitUrl: ""
};

const E = id => document.getElementById(id);

const KEYS = [
  "voxa_managed_rooms",
  "voxa_followed_rooms",
  "voxa_recent_rooms",
  "voxa_explore_rooms"
];

let sb = null;
let room = null;
let roomID = "";
let authUser = null;
let profile = null;
let chatCache = [];
let chatChannel = null;

let ready = false;
let canManage = false;
let currentMode = "normal";
let seatCount = 20;
let busy = false;

let roomMuted = false;
let voiceRoom = null;
let micOn = false;

let refreshTimer = null;
let previousFocus = null;

const official = {
  id: "10001",
  name: "🎧 Customer Support 💬",
  owner: "creator_main_id",
  admins: [],
  live: true,
  alwaysVisible: true,
  mode: "normal",
  seatCount: 20,
  seats: []
};

/* SVG ICON HELPERS */

const svg = name => `
  <svg aria-hidden="true">
    <use href="#${name}"></use>
  </svg>
`;

const buttonIcons = {
  shareBtn: "share",
  moreBtn: "more",
  powerBtn: "power",
  audioBtn: "audio",
  emojiBtn: "smile",
  chatBtn: "chat",
  sendBtn: "send",
  inboxBtn: "chat",
  applyBtn: "apply",
  micBtn: "mic",
  optionsBtn: "grid"
};

for (const [id, name] of Object.entries(buttonIcons)) {
  E(id).innerHTML = svg(name);
}

/* LOCAL ROOM STORAGE */

function read(key) {
  try {
    const value = JSON.parse(
      localStorage.getItem(key) || "[]"
    );

    return Array.isArray(value) ? value : [];
  } catch (_) {
    return [];
  }
}

function find(id) {
  for (const key of KEYS) {
    const found = read(key).find(
      item => String(item.id) === String(id)
    );

    if (found) return found;
  }

  return String(id) === "10001"
    ? { ...official }
    : null;
}

function store(updated) {
  let found = false;

  for (const key of KEYS) {
    const rows = read(key);

    const index = rows.findIndex(
      item => String(item.id) === String(updated.id)
    );

    if (index >= 0) {
      rows[index] = updated;

      localStorage.setItem(
        key,
        JSON.stringify(rows)
      );

      found = true;
    }
  }

  if (!found) {
    localStorage.setItem(
      KEYS[2],
      JSON.stringify([
        updated,
        ...read(KEYS[2])
      ])
    );
  }
}

/* STATUS AND MESSAGES */

function error(text) {
  E("errorBox").textContent = text;
  E("errorBox").hidden = false;
}

function message(title, text) {
  E("dialogTitle").textContent = title;
  E("dialogText").textContent = text;

  if (!E("messageDialog").open) {
    E("messageDialog").showModal();
  }
}

let toastTimer = null;

function toast(text) {
  clearTimeout(toastTimer);

  E("toast").textContent = text;
  E("toast").hidden = false;

  toastTimer = setTimeout(() => {
    E("toast").hidden = true;
  }, 4200);
}

function system(text) {
  const row = document.createElement("div");

  row.className = "msg system";
  row.textContent = text;

  E("chatBox").append(row);

  E("chatBox").scrollTop =
    E("chatBox").scrollHeight;
}

function photo(value) {
  if (!value || typeof value !== "string") {
    return "";
  }

  try {
    const url = new URL(value, location.href);

    return ["https:", "http:"].includes(url.protocol)
      ? url.href
      : "";
  } catch (_) {
    return "";
  }
}

/* OWNER / ADMIN ROLE */

function roles() {
  if (!room || !authUser) {
    canManage = false;
    return;
  }

  /*
    Shared mode uses authenticated UUIDs only.
    Legacy IDs are recognised only for local preview.
  */
  const identities = CONFIG.sharedBackend
    ? [authUser.id]
    : [
        authUser.id,
        profile?.id,
        localStorage.getItem("voxa_user_id")
      ].filter(Boolean);

  const idsAsStrings = identities.map(String);

  const owner = idsAsStrings.includes(
    String(room.owner)
  );

  const admin =
    Array.isArray(room.admins) &&
    room.admins.some(
      id => idsAsStrings.includes(String(id))
    );

  canManage = owner || admin;
}

/* SEAT HELPERS */

function ids() {
  if (currentMode === "blind") {
    return [
      "host_admin",
      "host_user",
      ...Array.from(
        { length: 8 },
        (_, index) => String(index + 1)
      )
    ];
  }

  return Array.from(
    { length: seatCount },
    (_, index) => String(index + 1)
  );
}

function seats() {
  return Array.isArray(room?.seats)
    ? room.seats.filter(
        item => item && typeof item === "object"
      )
    : [];
}

function seat(id) {
  return seats().find(
    item => String(item.number) === String(id)
  ) || {
    number: String(id),
    user_id: null,
    locked: false
  };
}

function mySeat() {
  if (!authUser) return null;

  return seats().find(
    item => String(item.user_id) === authUser.id
  ) || null;
}

/* CREATE ONE SEAT */

function seatButton(id, label) {
  id = String(id);

  const savedSeat = seat(id);
  const occupied = Boolean(savedSeat.user_id);

  const button = document.createElement("button");

  button.type = "button";
  button.className = "seat";

  const avatar = document.createElement("span");

  avatar.className =
    "avatar" + (occupied ? " occupied" : "");

  const imageURL = photo(savedSeat.photo);

  if (occupied && imageURL) {
    const image = document.createElement("img");

    image.src = imageURL;
    image.alt = savedSeat.name || "Participant";

    image.onerror = () => {
      image.remove();

      avatar.insertAdjacentHTML(
        "afterbegin",
        svg("user")
      );
    };

    avatar.append(image);
  } else {
    const icon = occupied
      ? "user"
      : savedSeat.locked
      ? "lock"
      : "mic";

    avatar.innerHTML = svg(icon);
  }

  const badge = document.createElement("span");

  badge.className = "badge";
  badge.textContent = id.startsWith("host")
    ? "H"
    : id;

  avatar.append(badge);

  const name = document.createElement("span");

  name.className = "name";

  name.textContent = occupied
    ? (savedSeat.name || "Participant")
    : savedSeat.locked
    ? "Locked"
    : (label || "Seat " + id);

  button.setAttribute(
    "aria-label",
    (label || "Seat " + id) + ": " +
    (
      occupied
        ? (savedSeat.name || "Occupied")
        : savedSeat.locked
        ? "Locked"
        : "Empty"
    )
  );

  button.append(avatar, name);

  button.onclick = () => {
    seatMenu(id);
  };

  return button;
}

/* RENDER ROOM */

function render() {
  if (!room) return;

  roles();

  currentMode = ["normal", "disco", "blind"].includes(
    room.mode
  )
    ? room.mode
    : room.category === "blinded"
    ? "blind"
    : "normal";

  seatCount = [5, 10, 15, 20].includes(
    Number(room.seatCount)
  )
    ? Number(room.seatCount)
    : 20;

  E("roomTitle").textContent =
    room.name || "VoxaChat Room";

  E("roomID").textContent = String(room.id);

  E("modeLabel").textContent =
    currentMode === "blind"
      ? "Blind Date · 2 Hosts + 8 Seats"
      : (
          currentMode === "disco"
            ? "Disco"
            : "Normal"
        ) + " · " + seatCount + " Seats";

  E("roomStatus").textContent =
    CONFIG.sharedBackend
      ? "Shared seats · voice separate"
      : "Local seats · voice not connected";

  E("applyBtn").disabled = !ready || busy;
  E("micBtn").disabled = !ready || busy;

  E("announcement").textContent =
    room.announcement || "";

  E("announcement").hidden =
    !room.announcement;

  const area = E("seatsArea");
  const previousScroll = area.scrollTop;

  area.replaceChildren();

  if (currentMode === "blind") {
    const hosts = document.createElement("div");

    hosts.className = "hosts";

    hosts.append(
      seatButton("host_admin", "Admin Host"),
      seatButton("host_user", "User Host")
    );

    const pairs = document.createElement("div");

    pairs.className = "pairs";

    for (const [first, second] of [
      [1, 2],
      [3, 4],
      [5, 6],
      [7, 8]
    ]) {
      const pair = document.createElement("div");

      pair.className = "pair";

      const heart = document.createElement("span");

      heart.className = "heart";
      heart.textContent = "♡";
      heart.setAttribute("aria-hidden", "true");

      pair.append(
        seatButton(String(first)),
        heart,
        seatButton(String(second))
      );

      pairs.append(pair);
    }

    area.append(hosts, pairs);
  } else {
    /*
      One continuous 5-column grid.
      No separate group cards or Seats 1–5 headings.
    */
    const grid = document.createElement("div");

    grid.className = "grid";

    for (let index = 1; index <= seatCount; index++) {
      grid.append(
        seatButton(String(index))
      );
    }

    area.append(grid);
  }

  area.scrollTop = previousScroll;

  const ownSeat = mySeat();

  if (
    voiceRoom &&
    (
      !ownSeat ||
      !ids().includes(String(ownSeat.number))
    )
  ) {
    stopVoice().catch(err => {
      error("Voice cleanup failed: " + err.message);
    });
  }
}

/* PANEL HELPERS */

function closePanel() {
  E("panel").hidden = true;
  E("overlay").hidden = true;

  previousFocus?.focus();
}

function panel(title) {
  if (E("panel").hidden) {
    previousFocus = document.activeElement;
  }

}

function action(parent, label, handler, disabled = false) {
  const button = document.createElement("button");

  button.type = "button";
  button.className = "opt wide";
  button.textContent = label;
  button.disabled = disabled;

}

function note(parent, text) {
  const paragraph = document.createElement("p");

  paragraph.className = "note";
  paragraph.textContent = text;

  parent.append(paragraph);
}

/* SEAT AND ROOM ACTIONS */

async function mutate(operation, data = {}) {
  if (!ready || busy) return false;

  busy = true;
  render();

  try {
    if (CONFIG.sharedBackend) {
      /*
        Requires the supplied Supabase SQL setup.
        Permissions are checked by the database RPC.
      */
      const { error: rpcError } = await sb.rpc(
        "voxa_room_action",
        {
          p_room: String(room.id),
          p_action: operation,
          p_data: data
        }
      );

      if (rpcError) throw rpcError;

      await loadShared();
    } else {
      /*
        Local preview mode only.
        These changes are not shared with other devices.
      */
      const latest = find(room.id) || room;

      const updated = {
        ...latest
      };

      const savedSeats = Array.isArray(latest.seats)
        ? latest.seats
            .filter(item => item && typeof item === "object")
            .map(item => ({ ...item }))
        : [];

      const target = String(data.number || "");

      const existing = savedSeats.find(
        item => String(item.number) === target
      );

      if (operation === "join") {
        if (!ids().includes(target)) {
          throw new Error("Invalid seat.");
        }

        if (
          target === "host_admin" &&
          !canManage
        ) {
          throw new Error(
            "Admin host seat is for owner/admin."
          );
        }

        if (
          existing?.user_id &&
          String(existing.user_id) !== authUser.id
        ) {
          throw new Error("Seat is occupied.");
        }

        if (existing?.locked) {
          throw new Error("Seat is locked.");
        }

        /*
          Clear your old seat without deleting its record.
          This preserves any stored seat properties.
        */
        const nextSeats = savedSeats.map(item => {
          if (String(item.user_id) === authUser.id) {
            return {
              ...item,
              user_id: null,
              name: null,
              photo: null
            };
          }

          return item;
        });

        const targetIndex = nextSeats.findIndex(
          item => String(item.number) === target
        );

        const joinedSeat = {
          ...(targetIndex >= 0
            ? nextSeats[targetIndex]
            : {}),
          number: target,
          user_id: authUser.id,
          name: profile.name || "You",
          photo: photo(profile.dp || profile.photo),
          locked: false
        };

        if (targetIndex >= 0) {
          nextSeats[targetIndex] = joinedSeat;
        } else {
          nextSeats.push(joinedSeat);
        }

        updated.seats = nextSeats;
      } else if (operation === "leave") {
        updated.seats = savedSeats.map(item => {
          if (String(item.user_id) === authUser.id) {
            return {
              ...item,
              user_id: null,
              name: null,
              photo: null
            };
          }

          return item;
        });
      } else {
        if (!canManage) {
          throw new Error(
            "Owner/admin permission required."
          );
        }

                if (
          ["lock", "remove"].includes(operation) &&
          !ids().includes(target)
        ) {
          throw new Error("Invalid seat.");
        }

        if (operation === "lock") {
          if (existing?.user_id) {
            throw new Error(
              "Cannot lock an occupied seat."
            );
          }

          updated.seats = savedSeats.filter(
            item => String(item.number) !== target
          );

          updated.seats.push({
            ...existing,
            number: target,
            user_id: null,
            locked: !existing?.locked
          });
        } else if (operation === "remove") {
          updated.seats = savedSeats.map(item => {
            if (String(item.number) === target) {
              return {
                ...item,
                user_id: null,
                name: null,
                photo: null
              };
            }

            return item;
          });
        } else if (operation === "settings") {
          if (
            data.mode !== undefined &&
            !["normal", "disco", "blind"].includes(data.mode)
          ) {
            throw new Error("Invalid room mode.");
          }

          if (
            data.seatCount !== undefined &&
            ![5, 10, 15, 20].includes(Number(data.seatCount))
          ) {
            throw new Error("Invalid seat count.");
          }

          if (
            data.announcement !== undefined &&
            (
              typeof data.announcement !== "string" ||
              data.announcement.length > 300
            )
          ) {
            throw new Error(
              "Announcement must be up to 300 characters."
            );
          }

          if (data.mode !== undefined) {
            updated.mode = data.mode;
          }

          if (data.seatCount !== undefined) {
            updated.seatCount = Number(data.seatCount);
          }

          if (data.announcement !== undefined) {
            updated.announcement = data.announcement;
          }

          if (
            data.mode !== undefined ||
            data.seatCount !== undefined
          ) {
            const nextMode =
              ["normal", "disco", "blind"].includes(updated.mode)
                ? updated.mode
                : currentMode;

            const nextCount =
              [5, 10, 15, 20].includes(Number(updated.seatCount))
                ? Number(updated.seatCount)
                : seatCount;

            const allowed = nextMode === "blind"
              ? [
                  "host_admin",
                  "host_user",
                  ...Array.from(
                    { length: 8 },
                    (_, index) => String(index + 1)
                  )
                ]
              : Array.from(
                  { length: nextCount },
                  (_, index) => String(index + 1)
                );

            updated.seats = savedSeats.filter(
              item => allowed.includes(String(item.number))
            );
          } else {
            updated.seats = savedSeats;
          }
        } else {
          throw new Error("Unknown room action.");
        }
      }

      store(updated);
      room = updated;
    }

    closePanel();
    render();

    if (operation === "leave") {
      await stopVoice();
    }

    toast(
      CONFIG.sharedBackend
        ? "Room updated."
        : "Saved on this browser only."
    );

    return true;
  } catch (err) {
    message(
      "Room action failed",
      err.message || "Unable to update room."
    );

    return false;
  } finally {
    busy = false;
    render();
  }
}

/* TAP A SEAT */

function seatMenu(id) {
  if (!ready) return;

  id = String(id);

  const savedSeat = seat(id);
  const body = panel(
    id === "host_admin"
      ? "Admin Host"
      : id === "host_user"
      ? "User Host"
      : "Seat " + id
  );

  if (String(savedSeat.user_id) === authUser.id) {
    action(
      body,
      "Leave seat",
      () => mutate("leave")
    );
  } else if (!savedSeat.user_id) {
    const adminOnly =
      id === "host_admin" && !canManage;

    action(
      body,
      savedSeat.locked
        ? "Seat locked"
        : adminOnly
        ? "Owner/admin host only"
        : "Join seat",
      () => mutate("join", { number: id }),
      Boolean(savedSeat.locked) || adminOnly
    );
  } else {
    note(
      body,
      savedSeat.name || "This seat is occupied."
    );
  }

  if (canManage) {
    if (!savedSeat.user_id) {
      action(
        body,
        savedSeat.locked ? "Unlock seat" : "Lock seat",
        () => mutate("lock", { number: id })
      );
    } else {
      action(
        body,
        "Remove from seat",
        () => {
          if (
            confirm(
              "Remove this participant from the seat?"
            )
          ) {
            mutate("remove", { number: id });
          }
        }
      );
    }
  }

  note(
    body,
    CONFIG.sharedBackend
      ? "Seat changes use the shared backend."
      : "Local mode: other devices do not receive these seat changes."
  );
}

/* RIGHT-SIDE APPLY / JOIN BUTTON */

E("applyBtn").onclick = () => {
  if (!ready || busy) return;

  const ownSeat = mySeat();

  if (ownSeat) {
    seatMenu(String(ownSeat.number));
    return;
  }

  const availableID = ids().find(id => {
    if (id === "host_admin") return false;

    const savedSeat = seat(id);

    return !savedSeat.locked && !savedSeat.user_id;
  });

  if (!availableID) {
    toast("No unlocked empty seat available.");
    return;
  }

  seatMenu(availableID);
};

/* ROOM OPTIONS */

function settings() {
  if (!ready) {
    toast("Wait for the room to finish loading.");
    return;
  }

  const body = panel("Room options");

  action(body, "Change Theme", themes);

  const following = read(KEYS[1]).some(
    item => String(item.id) === String(room.id)
  );

  action(
    body,
    following ? "Unfollow room" : "Follow room",
    () => {
      try {
        let rows = read(KEYS[1]);

        const exists = rows.some(
          item => String(item.id) === String(room.id)
        );

        rows = rows.filter(
          item => String(item.id) !== String(room.id)
        );

        if (!exists) {
          rows.unshift({ ...room });
        }

        localStorage.setItem(
          KEYS[1],
          JSON.stringify(rows)
        );

        closePanel();
        toast(exists ? "Unfollowed." : "Followed.");
      } catch (err) {
        message("Follow failed", err.message);
      }
    }
  );

  if (canManage) {
    for (const [mode, label] of [
      ["normal", "Normal Room"],
      ["disco", "Disco"],
      ["blind", "Blind Date"]
    ]) {
      action(
        body,
        (currentMode === mode ? "✓ " : "") + label,
        () => {
          if (mode === currentMode) {
            closePanel();
            return;
          }

          const accepted = confirm(
            "Change room mode? Seats outside the new " +
            "layout will lose their saved occupants."
          );

          if (accepted) {
            mutate("settings", { mode });
          }
        }
      );
    }

    action(body, "Seat count", () => {
      if (currentMode === "blind") {
        toast(
          "Blind Date has 2 hosts and 8 member seats."
        );
        return;
      }

      const answer = prompt(
        "Enter 5, 10, 15 or 20.",
        String(seatCount)
      );

      if (answer === null) return;

      const count = Number(answer.trim());

      if (![5, 10, 15, 20].includes(count)) {
        toast("Choose 5, 10, 15 or 20.");
        return;
      }

      if (count === seatCount) {
        closePanel();
        return;
      }

      const accepted = confirm(
        "Change seat count? Seats removed from the " +
        "layout will lose their saved occupants."
      );

      if (accepted) {
        mutate("settings", {
          seatCount: count
        });
      }
    });

    action(body, "Announcement", () => {
      const value = prompt(
        "Announcement: maximum 300 characters.",
        room.announcement || ""
      );

      if (value === null) return;

      if (value.length > 300) {
        toast("Maximum 300 characters.");
        return;
      }

      mutate("settings", {
        announcement: value.trim()
      });
    });
  }

  note(
    body,
    canManage
      ? "Owner/admin controls available."
      : "Member: room mode and seat-management controls are owner/admin only."
  );

  action(body, "Connection status", () => {
    message(
      "Connection status",
      CONFIG.sharedBackend
        ? (
            "Shared backend enabled.\n" +
            "Voice requires its separate token service."
          )
        : (
            "Local seat mode.\n" +
            "Shared seats and voice are not configured.\n" +
            "The backend setup is separate from this HTML."
          )
    );
  });
}

/* CHANGE THEME */

function themes() {
  const body = panel("Change Theme");

  const choices = [
    ["sunset", "Warm room"],
    ["midnight", "Midnight purple"],
    ["ocean", "Ocean"],
    ["rose", "Rose"]
  ];

  for (const [key, label] of choices) {
    action(body, label, () => {
      E("app").dataset.theme = key;

      try {
        localStorage.setItem(
          "voxa_room_theme",
          key
        );

        closePanel();
      } catch (err) {
        closePanel();

        toast(
          "Theme changed, but could not save preference."
        );
      }
    });
  }

  note(
    body,
    "Theme preference is saved on this browser."
  );
}

/* DISPLAY CHAT MESSAGES */

function showChat(item) {
  const row = document.createElement("div");

  row.className = "msg";
  row.textContent =
    (item.name || "Member") +
    ": " +
    item.body;

  E("chatBox").append(row);

  while (E("chatBox").children.length > 150) {
    E("chatBox").firstChild.remove();
  }

  E("chatBox").scrollTop =
    E("chatBox").scrollHeight;

/* SEND MESSAGE */

E("composer").onsubmit = async event => {
  event.preventDefault();

  const body = E("msgInput").value.trim();

  if (!body || !ready) return;

  E("sendBtn").disabled = true;

  try {
    if (CONFIG.sharedBackend) {
      const { error: insertError } = await sb
        .from("voxa_messages")
        .insert({
          room_id: String(room.id),
          user_id: authUser.id,
          body
        });

      if (insertError) throw insertError;

      await loadChat();
    } else {
      showChat({
        name: "You · local",
        body
      });
    }

    E("msgInput").value = "";
  } catch (err) {
    message(
      "Chat failed",
      err.message || "Unable to send message."
    );
  } finally {
    E("sendBtn").disabled = false;
  }
};

  ).forEach(audio => {

        );

  });

  E("audioBtn").classList.toggle(
    "muted",
    roomMuted
  );

  E("audioBtn").setAttribute(
    "aria-pressed",
    String(roomMuted)
  );

  E("audioBtn").setAttribute(
    "aria-label",
    roomMuted
      ? "Unmute room audio"
      : "Mute room audio"
  );

  toast(
    roomMuted
      ? "Room listening muted."
      : "Room listening unmuted."
  );
};

/* VOICE INTEGRATION */

/*
  This HTML does not include a voice token service.
  Set CONFIG.voiceTokenUrl to your own secure endpoint,
  or leave it blank to use the local seat preview only.
*/
async function startVoice() {
  if (!CONFIG.sharedBackend) {
    toast(
      "Voice requires shared backend and voice token service."
    );

    return;
  }

  if (!voiceTokenUrl) {
    toast(
      "Voice is not configured. Set CONFIG.voiceTokenUrl."
    );

    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    toast("Microphone is not available.");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    micStream = stream;

    E("micBtn").classList.add("on");
    E("micBtn").setAttribute(
      "aria-label",
      "Turn microphone off"
    );

    toast("Microphone connected.");
  } catch (err) {
    message(
      "Microphone unavailable",
      err.message ||
      "Allow microphone permission and try again."
    );
  }
}

async function stopVoice() {
  try {
    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
      micStream = null;
    }

    E("micBtn").classList.remove("on");
    E("micBtn").setAttribute(
      "aria-label",
      "Turn microphone on"
    );
  } catch (err) {
    /* Ignore cleanup errors */
  }
}

E("micBtn").onclick = async () => {
  if (!ready) {
    toast("Wait for the room to finish loading.");
    return;
  }

  if (!mySeat()) {
    toast("Join a seat before using the microphone.");
    return;
  }

  if (micStream) {
    await stopVoice();
    toast("Microphone off.");
    return;
  }

  await startVoice();
};

/* LOAD SHARED DATA */

async function loadShared() {
  if (!CONFIG.sharedBackend) return;

  const { data: roomData, error: roomError } = await sb
    .from("voxa_rooms")
    .select("*")
    .eq("id", String(room.id))
    .maybeSingle();

  if (roomError) throw roomError;

if (!roomData) {
  const { data: visibleRooms, error: listError } =
    await sb
      .from("voxa_rooms")
      .select("id")
      .limit(10);

  throw new Error(
    "Backend: " + sb.supabaseUrl +
    " | Wanted: " + String(room.id) +
    " | Visible IDs: " +
    JSON.stringify(visibleRooms) +
    " | Error: " +
    (listError ? listError.message : "none")
  );
}

  room = roomData;

  const { data: chatData, error: chatError } = await sb
    .from("voxa_messages")
    .select("id, room_id, user_id, body, created_at")
    .eq("room_id", String(room.id))
    .order("created_at", { ascending: false })
    .limit(50);

  if (chatError) throw chatError;

  chatCache = (chatData || []).reverse();
}

/* LOAD LOCAL CHAT */

async function loadChat() {
  if (CONFIG.sharedBackend) {
    await loadShared();
  }

  E("chatBox").innerHTML = "";

  for (const item of chatCache) {
    showChat(item);
  }
}

/* REALTIME CHAT */

function connectChat() {
  if (!CONFIG.sharedBackend || !sb) return;

  chatChannel = sb
    .channel("voxa-room-chat-" + String(room.id))
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "voxa_messages",
        filter: "room_id=eq." + String(room.id)
      },
      payload => {
        if (payload?.new) {
          showChat(payload.new);
        }
      }
    )
    .subscribe();
}

/* INITIALIZE */

async function init() {
  try {
    if (!window.supabase) {
      throw new Error(
        "Supabase library did not load. Check your internet connection."
      );
    }

    if (CONFIG.sharedBackend) {
      if (
        !CONFIG.supabaseUrl ||
        !CONFIG.supabaseAnonKey
      ) {
        throw new Error(
          "Add your Supabase URL and anon key in CONFIG."
        );
      }

      sb = window.supabase.createClient(
        CONFIG.supabaseUrl,
        CONFIG.supabaseAnonKey
      );

      const { data: userData, error: userError } =
        await sb.auth.getUser();

      alert("Session check: " + (userData?.user?.id || userError?.message || "no session"));

      if (userError) throw userError;

      if (!userData?.user) {
        location.href = "login.html";
        return;
      }

      authUser = userData.user;

      const { data: profileData, error: profileError } =
        await sb
          .from("profiles")
          .select("name, photo")
          .eq("id", authUser.id)
          .maybeSingle();

      if (profileError) throw profileError;

      profile = profileData || {};
    } else {
      authUser = {
        id: "local-user"
      };

      profile = {
        name: "You",
        photo: ""
      };
    }

    /*
      Room ID can come from:
      ?id=123
      ?room=123
      #room-123
    */
    const params = new URLSearchParams(
      location.search
    );

    roomID =
      params.get("id") ||
      params.get("room") ||
      location.hash.replace(/^#room-?/i, "");

    if (!roomID) {
      location.href = "party.html";
      return;
    }

    room = find(roomID) || {
      id: String(roomID),
      name: "VoxaChat Room",
      mode: "normal",
      seatCount: 10,
      announcement: "",
      seats: []
    };

    await loadChat();
    connectChat();

    ready = true;
    render();

    E("powerBtn").focus();
  } catch (err) {
    message(
      "Room could not load",
      err.message || "Unexpected initialization error."
    );
  }
}

init();

</script>
</body>
</html>
