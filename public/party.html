<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxaChat - Premium Party</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#05040a;color:#fff;padding:14px;padding-bottom:110px;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;perspective:600px}
.heart{position:absolute;opacity:.4;animation:float 11s linear infinite;filter:drop-shadow(0 0 8px rgba(168,85,247,.7));transform-style:preserve-3d}
.heart.big{animation:floatBig 10s linear infinite}
@keyframes float{0%{transform:translateY(110vh) translateX(0) scale(.5) rotateZ(0deg);opacity:0}10%{opacity:.5}50%{transform:translateY(50vh) translateX(20px) scale(.8) rotateZ(15deg)}90%{opacity:.3}100%{transform:translateY(-160px) translateX(-20px) scale(1.1) rotateZ(30deg);opacity:0}}
@keyframes floatBig{0%{transform:translateY(110vh) translateX(0) scale(.5) rotateZ(0deg);opacity:0}10%{opacity:.5}25%{transform:translateY(75vh) translateX(30px) scale(.7) rotateZ(8deg)}50%{transform:translateY(50vh) translateX(-25px) scale(.85) rotateZ(-8deg)}75%{transform:translateY(25vh) translateX(25px) scale(.95) rotateZ(6deg)}90%{opacity:.3}100%{transform:translateY(-160px) translateX(-15px) scale(1.1) rotateZ(-5deg);opacity:0}}

.wrap{max-width:480px;margin:0 auto;position:relative;z-index:2}
.head{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.top-tab{background:rgba(255,255,255,.03);border:1px solid rgba(168,85,247,.2);color:#c084fc;font-size:12px;font-weight:800;padding:10px 14px;border-radius:14px;cursor:pointer;white-space:nowrap;transition:0.3s;letter-spacing:0.5px}
.top-tab.active{background:linear-gradient(135deg,#7c3aed,#ec4899);border-color:transparent;color:#fff;box-shadow:0 4px 15px rgba(236,72,153,0.4)}
.search-icon{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(168,85,247,.3);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;margin-left:auto;flex-shrink:0;backdrop-filter:blur(10px)}
.home-plus-icon{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(168,85,247,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;gap:1px;transition:0.3s;backdrop-filter:blur(10px)}
.home-plus-icon:active{transform:scale(0.9);background:rgba(168,85,247,.2)}
.home-plus-icon .home{font-size:14px;line-height:1}
.home-plus-icon .plus{font-size:12px;line-height:1;color:#c084fc;font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,4,10,.8);border-top:1px solid rgba(168,85,247,.2);display:flex;justify-content:space-around;padding:12px 0;z-index:10;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav button{background:none;border:0;color:#9ca3af;font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:0.2s}
.nav button.active{color:#c084fc;text-shadow:0 0 12px rgba(192,132,252,.9)}
.nav .ic{font-size:22px}

/* PREMIUM CREATE ROOM SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:90;display:none;opacity:0;transition:opacity .3s}
.sheet-overlay.show{display:block;opacity:1}
.sheet{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#130c1c,#0a0610);border-radius:32px 32px 0 0;z-index:91;transform:translateY(100%);transition:transform .4s cubic-bezier(0.16, 1, 0.3, 1);max-height:92vh;overflow-y:auto;border-top:1px solid rgba(168,85,247,0.3);box-shadow:0 -15px 50px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1)}
.sheet.show{transform:translateY(0)}
.sheet-drag{width:44px;height:5px;background:rgba(255,255,255,0.15);border-radius:10px;margin:12px auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 20px}
.sheet-head h2{font-size:24px;font-weight:900;color:#fff;letter-spacing:0.5px;background:linear-gradient(90deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sheet-head .cancel{font-size:14px;color:#a78bfa;cursor:pointer;font-weight:600;padding:6px 12px;background:rgba(168,85,247,0.1);border-radius:20px;transition:0.2s}
.sheet-head .cancel:active{background:rgba(168,85,247,0.3)}

/* Mode Grid */
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px 30px}
.mode-card{border-radius:20px;padding:16px 12px;color:#fff;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;min-height:110px;transition:transform 0.15s, box-shadow 0.2s, border-color 0.2s;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(10px)}
.mode-card:hover{border-color:rgba(255,255,255,0.2)}
.mode-card:active{transform:scale(0.94);box-shadow:0 0 20px rgba(255,255,255,0.1)}
.mode-card .m-title{font-size:13px;font-weight:800;z-index:2;text-shadow:0 2px 4px rgba(0,0,0,0.8);line-height:1.3}
.mode-card .m-icon{position:absolute;right:10px;bottom:10px;z-index:1;width:44px;height:44px;opacity:0.85;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.6));transition:0.3s}
.mode-card:hover .m-icon{opacity:1;transform:scale(1.1) rotate(-5deg)}
.mode-card .m-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Individual Card Themes & Glows */
.bg-chat{background:linear-gradient(135deg,rgba(255,138,0,0.15),rgba(229,46,113,0.1));border-color:rgba(255,138,0,0.2)}
.bg-chat:hover{box-shadow:0 0 20px rgba(255,138,0,0.2);border-color:rgba(255,138,0,0.5)}
.bg-chat .m-icon{color:#ff8a00}
.bg-video{background:linear-gradient(135deg,rgba(17,153,142,0.15),rgba(56,239,125,0.1));border-color:rgba(56,239,125,0.2)}
.bg-video:hover{box-shadow:0 0 20px rgba(56,239,125,0.2);border-color:rgba(56,239,125,0.5)}
.bg-video .m-icon{color:#38ef7d}
.bg-td{background:linear-gradient(135deg,rgba(142,45,226,0.15),rgba(74,0,224,0.1));border-color:rgba(142,45,226,0.2)}
.bg-td:hover{box-shadow:0 0 20px rgba(142,45,226,0.2);border-color:rgba(142,45,226,0.5)}
.bg-td .m-icon{color:#b966ff}
.bg-carrom{background:linear-gradient(135deg,rgba(241,39,17,0.15),rgba(245,175,25,0.1));border-color:rgba(241,39,17,0.2)}
.bg-carrom:hover{box-shadow:0 0 20px rgba(241,39,17,0.2);border-color:rgba(241,39,17,0.5)}
.bg-carrom .m-icon{color:#f5af19}
.bg-snake{background:linear-gradient(135deg,rgba(0,180,219,0.15),rgba(0,131,176,0.1));border-color:rgba(0,180,219,0.2)}
.bg-snake:hover{box-shadow:0 0 20px rgba(0,180,219,0.2);border-color:rgba(0,180,219,0.5)}
.bg-snake .m-icon{color:#00b4db}
.bg-talent{background:linear-gradient(135deg,rgba(195,20,50,0.15),rgba(36,11,54,0.1));border-color:rgba(195,20,50,0.2)}
.bg-talent:hover{box-shadow:0 0 20px rgba(195,20,50,0.2);border-color:rgba(195,20,50,0.5)}
.bg-talent .m-icon{color:#ff4b6a}

/* Form Styles */
.create-form{display:none;padding:0 24px 40px}
.create-form.show{display:block;animation:fadeIn .4s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.premium-input{width:100%;padding:18px;border-radius:16px;border:1px solid rgba(255,255,255,0.08);font-size:16px;background:rgba(0,0,0,0.4);color:#fff;margin-bottom:24px;outline:none;transition:0.3s;box-shadow:inset 0 2px 5px rgba(0,0,0,0.5)}
.premium-input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,0.2), inset 0 2px 5px rgba(0,0,0,0.5)}
.premium-input::placeholder{color:rgba(255,255,255,0.3)}

.type-box{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.type-btn{padding:18px 10px;border-radius:16px;border:2px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.02);color:#a1a1aa;font-weight:800;cursor:pointer;text-align:center;transition:0.3s;position:relative;overflow:hidden}
.type-btn.selected{border-color:#8b5cf6;background:rgba(139,92,246,0.15);color:#fff;box-shadow:0 0 25px rgba(139,92,246,0.2)}
.type-btn small{display:block;font-weight:500;font-size:11px;margin-top:6px;color:#d4d4d8;letter-spacing:0.5px}
.type-btn.family-btn.selected{border-color:#fbbf24;background:rgba(251,191,36,0.15);box-shadow:0 0 25px rgba(251,191,36,0.2)}
.type-btn.family-btn small{color:#fbbf24;font-weight:700}

.create-btn{width:100%;padding:18px;border-radius:16px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:900;font-size:16px;border:0;cursor:pointer;box-shadow:0 8px 30px rgba(236,72,153,0.4);transition:0.3s;display:flex;justify-content:center;align-items:center;gap:10px;letter-spacing:0.5px}
.create-btn:active{transform:scale(0.97)}
.create-btn:disabled{opacity:0.7;box-shadow:none;transform:none}
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="bg">
 <span class="heart big" style="left:3%;color:#a855f7;font-size:46px;z-index:1;animation-delay:0s">💜</span>
 <span class="heart" style="left:12%;animation-duration:11s;color:#a855f7;font-size:18px;z-index:0">💜</span>
 <span class="heart big" style="left:22%;color:#7e22ce;font-size:46px;z-index:2;animation-delay:2s">💜</span>
 <span class="heart" style="left:42%;color:#a855f7;font-size:46px;z-index:1;animation-delay:4s">💜</span>
 <span class="heart big" style="left:62%;color:#a855f7;font-size:46px;z-index:2;animation-delay:6s">💜</span>
 <span class="heart" style="left:82%;color:#7e22ce;font-size:46px;z-index:1;animation-delay:8s">💜</span>
</div>

<div class="wrap">
 <div class="head">
  <div class="top-tab" onclick="setMode('related')">Related</div>
  <div class="top-tab" onclick="setMode('explore')">Explore</div>
  <div class="top-tab" onclick="setMode('event')">Event</div>
  <div class="search-icon" onclick="searchRoom()">🔍</div>
  <div class="home-plus-icon" onclick="openCreateSheet()"><span class="home">🏠</span><span class="plus">+</span></div>
 </div>
</div>

<div class="wrap">
 <div id="masterContentContainer"></div>
</div>

<div class="nav">
 <button onclick="location.href='homefile3.html'"><span class="ic">🏠</span>Home</button>
 <button class="active" onclick="location.href='party.html'"><span class="ic">🎉</span>Party</button>
 <button onclick="location.href='inbox.html'"><span class="ic">📥</span>Inbox</button>
 <button onclick="location.href='profile2.html'"><span class="ic">👤</span>Profile</button>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeCreateSheet()"></div>
<div class="sheet" id="createSheet">
  <div class="sheet-drag"></div>
  
  <div id="stepModes">
    <div class="sheet-head">
      <h2>Create Room</h2>
      <span class="cancel" onclick="closeCreateSheet()">Cancel</span>
    </div>
    <div class="sheet-grid">
      <div class="mode-card bg-chat" onclick="selectMode('chat')"><span class="m-title">Chat</span><span class="m-icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span></div>
      <div class="mode-card bg-video" onclick="selectMode('video')"><span class="m-title">Video</span><span class="m-icon"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3"/></svg></span></div>
      <div class="mode-card bg-td" onclick="selectMode('truth')"><span class="m-title">Truth & Dare</span><span class="m-icon"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8 12l2 2 4-4"/></svg></span></div>
      <div class="mode-card bg-carrom" onclick="selectMode('carrom')"><span class="m-title">Carrom</span><span class="m-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></span></div>
      <div class="mode-card bg-snake" onclick="selectMode('snakes')"><span class="m-title">Snakes</span><span class="m-icon"><svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zM12 4h4v4h-4zM20 4h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM20 12h4v4h-4zM4 20h4v4H4zM12 20h4v4h-4zM20 20h4v4h-4z"/></svg></span></div>
      <div class="mode-card bg-talent" onclick="selectMode('talent')"><span class="m-title">Talent</span><span class="m-icon"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg></span></div>
    </div>
  </div>

  <div class="create-form" id="stepForm">
    <div class="sheet-head" style="padding:0 0 20px 0">
      <h2>Details</h2>
      <span class="cancel" onclick="backToModes()">← Back</span>
    </div>
    <input type="text" id="newRoomName" class="premium-input" placeholder="Give your room a name..." maxlength="50" autocomplete="off">
    <div class="type-box">
      <div class="type-btn selected" id="btnNormal" onclick="handleTypeClick('normal')"><span id="txtNormal">Normal</span><small id="subTxtNormal">Free to create</small></div>
      <div class="type-btn family-btn" id="btnFamily" onclick="handleTypeClick('family')"><span id="txtFamily">Family</span><small id="subTxtFamily">10,00,000 💎</small></div>
    </div>
    <button class="create-btn" id="btnCreateSubmit" onclick="submitCreateRoom()"><span class="spinner" id="btnSpinner"></span><span id="btnText">Create Room</span></button>
  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://mblcbygpqbogmtzacbtz.supabase.co',
  'sb_publishable_d0jKzXs_b-tBVzhusjYKJw_ZdPkMxdV'
);

let currentUserProfile = null;
let myRooms = { normal: null, family: null };
let selectedMode = '';
let selectedType = 'normal';
let currentActiveMode = 'related';

async function checkAuthAndRooms() {
  const { data: { user } } = await sb.auth.getUser();
  if(user) {
    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    currentUserProfile = profile;
    if(currentUserProfile) {
        const { data: rooms } = await sb.from('rooms').select('*').eq('owner_uid', String(currentUserProfile.uid));
        if(rooms) {
            rooms.forEach(r => {
                if(r.type === 'normal') myRooms.normal = r;
                if(r.type === 'family') myRooms.family = r;
            });
        }
    }
  }
}
checkAuthAndRooms();

async function openCreateSheet(){
  document.getElementById('sheetOverlay').classList.add('show');
  document.getElementById('createSheet').classList.add('show');
  try {
    await checkAuthAndRooms();
  } catch(e) {
    console.log("Auth error: ", e);
  }
  backToModes();
}

function closeCreateSheet(){
  document.getElementById('sheetOverlay').classList.remove('show');
  document.getElementById('createSheet').classList.remove('show');
}

function selectMode(mode){
  selectedMode = mode;
  document.getElementById('stepModes').style.display = 'none';
  document.getElementById('stepForm').style.display = 'block';
  document.getElementById('newRoomName').value = '';
  updateTypeButtonsUI();
}

function backToModes(){
  document.getElementById('stepModes').style.display = 'block';
  document.getElementById('stepForm').style.display = 'none';
}

function updateTypeButtonsUI() {
  const btnNormal = document.getElementById('btnNormal');
  const btnFamily = document.getElementById('btnFamily');
  btnNormal.classList.remove('selected');
  btnFamily.classList.remove('selected');

  if(myRooms.normal) {
      document.getElementById('txtNormal').innerText = "Enter Room";
      document.getElementById('subTxtNormal').innerText = "You already have one";
      setRoomType('family'); 
  } else {
      document.getElementById('txtNormal').innerText = "Normal";
      document.getElementById('subTxtNormal').innerText = "Free to create";
      setRoomType('normal');
  }

  if(myRooms.family) {
      document.getElementById('txtFamily').innerText = "Enter Family";
      document.getElementById('subTxtFamily').innerText = "You already have one";
      if(myRooms.normal) {
          btnNormal.classList.remove('selected');
          btnFamily.classList.remove('selected');
          document.getElementById('btnCreateSubmit').innerText = "Both Rooms Limit Reached";
          document.getElementById('btnCreateSubmit').disabled = true;
          return;
      }
  } else {
      document.getElementById('txtFamily').innerText = "Family";
      document.getElementById('subTxtFamily').innerText = "10,00,000 💎";
  }
  
  document.getElementById('btnCreateSubmit').innerText = "Create Room";
  document.getElementById('btnCreateSubmit').disabled = false;
  setRoomType(selectedType);
}

function handleTypeClick(type) {
    if(type === 'normal' && myRooms.normal) {
        location.href = 'blind-date-room-profile-fix.html?id=' + myRooms.normal.room_id;
        return;
    }
    if(type === 'family' && myRooms.family) {
        location.href = 'blind-date-room-profile-fix.html?id=' + myRooms.family.room_id;
        return;
    }
    setRoomType(type);
}

function setRoomType(type){
  selectedType = type;
  document.getElementById('btnNormal').classList.toggle('selected', type === 'normal');
  document.getElementById('btnFamily').classList.toggle('selected', type === 'family');
}

async function submitCreateRoom(){
  const name = document.getElementById('newRoomName').value.trim();
  const btn = document.getElementById('btnCreateSubmit');
  const spinner = document.getElementById('btnSpinner');
  const btnText = document.getElementById('btnText');
  
  if(!name) return alert('Please enter a room name.');

  btn.disabled = true;
  btnText.textContent = 'Checking...';
  spinner.style.display = 'block';

  try {
    const { data: { user }, error: authErr } = await sb.auth.getUser();
    if(authErr || !user) throw new Error("Aap login nahi hain. Please login again.");

    const { data: profile, error: pErr } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(pErr || !profile) throw new Error("Profile nahi mili.");

    btnText.textContent = 'Creating...';

    const { data, error } = await sb.rpc('create_room', {
      p_owner_uid: String(profile.uid),
      p_name: name,
      p_type: selectedType,
      p_dp: null
    });

    if(error) throw error;
    if(!data.success) throw new Error(data.error);

    btnText.textContent = 'Success!';
    location.href = 'blind-date-room-profile-fix.html?id=' + data.room.room_id + '&mode=' + selectedMode;

  } catch(e) {
    alert(e.message || 'Room creation failed.');
    btn.disabled = false;
    btnText.textContent = 'Create Room';
    spinner.style.display = 'none';
  }
}

function searchRoom(){
  const id=prompt('Search Room ID:');
  if(!id)return;
  location.href='blind-date-room-profile-fix.html?id='+id.trim();
}

function renderScreenView() {
  const container = document.getElementById('masterContentContainer');
  if (currentActiveMode === 'explore') {
    container.innerHTML = `<div style="color:#9ca3af;text-align:center;padding:20px">Explore Rooms loading...</div>`;
  } else if (currentActiveMode === 'related') {
    container.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <span class="top-tab active">Recently</span>
      <span class="top-tab">Following</span>
      <span class="top-tab">Manage</span>
    </div>
    <div style="color:#9ca3af;text-align:center;padding:20px">Recently mein abhi koi room nahi hai.</div>`;
  } else {
    container.innerHTML = `<div style="color:#9ca3af;text-align:center;padding:20px">Events coming soon</div>`;
  }
}

function setMode(mode){
   currentActiveMode = mode;
  renderScreenView();
}

renderScreenView();
</script>
</body>
</html>
