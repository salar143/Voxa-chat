<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test</title></head>
<body style="font-family:sans-serif;text-align:center;margin-top:50px">
<h2>Link Test</h2>
<p id="out">Check ho raha hai...</p>
<script>
window.onload = function(){
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');
  const tokenHash = url.searchParams.get('token_hash');
  const type = url.searchParams.get('type');
  const hash = window.location.hash;
  let result = 'Kuch nahi mila';
  if(code) result = 'CODE mila';
  else if(tokenHash) result = 'TOKEN_HASH mila (type: ' + type + ')';
  else if(hash && hash.includes('access_token')) result = 'ACCESS_TOKEN mila';
  document.getElementById('out').innerText = result;
};
</script>
</body>
</html>
