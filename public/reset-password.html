<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif;max-width:400px;margin:50px auto;text-align:center">
<h2>Naya Password Set Karo</h2>
<p id="status">Link check ho raha hai...</p>
<div id="form" style="display:none">
<input id="pw" type="password" placeholder="Naya password" style="width:100%;padding:10px;margin:10px 0">
<button onclick="reset()" style="width:100%;padding:10px;background:#6c5ce7;color:#fff;border:none;border-radius:8px">Password Set Karo</button>
</div>
<p id="msg"></p>
<script>
const supabase = window.supabase.createClient('https://mblcbygpqbgmtzacbtz.supabase.co', 'sb_publishable_d0jKzXs_b-tBVzhusjYKJw_ZdPkMxdV');

window.onload = async function(){
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');
  const tokenHash = url.searchParams.get('token_hash');
  const type = url.searchParams.get('type');
  const hash = window.location.hash;

  if(tokenHash && type === 'recovery'){
    const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
    if(error){
      document.getElementById('status').innerText = 'Link expire — dobara recovery link bhejo. ('+error.message+')';
    } else {
      showForm();
    }
  } else if(code){
    const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
    if(error){
      document.getElementById('status').innerText = 'Link expire — dobara recovery link bhejo.';
    } else {
      showForm();
    }
  } else if(hash && hash.includes('access_token')){
    showForm();
  } else {
    const { data } = await supabase.auth.getSession();
    if(data && data.session){
      showForm();
    } else {
      document.getElementById('status').innerText = 'Recovery link email se kholo.';
    }
  }
};

function showForm(){
  document.getElementById('status').innerText = 'Ab naya password daalo:';
  document.getElementById('form').style.display = 'block';
}

async function reset(){
  const pw = document.getElementById('pw').value;
  if(!pw || pw.length < 6){
    document.getElementById('msg').innerText = 'Password kam se kam 6 letters ka.';
    return;
  }
  const { error } = await supabase.auth.updateUser({ password: pw });
  document.getElementById('msg').innerText = error ? 'Error: '+error.message : 'Password set ho gaya! Ab login karo.';
}
</script>
</body>
</html>
