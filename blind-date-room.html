<script>
  window.supabaseClient = supabase.createClient(
    "https://mblcbygpqbogmtzacbtz.supabase.co",
    "sb_publishable_d0jKzXs_b-tBVzhusjYKJw_ZdPkMxdV",
    { auth: { persistSession: true, autoRefreshToken: true } }
  );

<script>
/* ================= VoxaChat Realtime Bridge =================
   Room ka data (seats / chat / gifts / PK / calculator) aur voice signalling
   pehle sirf isi browser me band tha. Ab ye Supabase Realtime se
   sab devices ke beech sync hota hai. Purane functions waise hi chalte hain. */
window.VOXA_RT=(function(){
  "use strict";
  var sb=window.supabaseClient||null;
  var CID="c"+Math.random().toString(36).slice(2,10);
  var syncCh=null, roomId=null, onSyncCb=null, ready=false, initAt=0, chatKeyLocal="", selfId="";
  function log(){ if(window.VOXA_RT_DEBUG){ try{ console.log.apply(console,["[VOXA RT]"].concat([].slice.call(arguments))) }catch(_){} } }
  function safeSend(ch,payload){
    if(!ch)return;
    try{ var p=ch.send(payload); if(p&&p.catch)p.catch(function(){}); }catch(_){}
  }

  /* BroadcastChannel jaisa hi API — same functions, bas network ke through */
  function broadcast(name){
    var listener=null, queue=[];
    var ch=sb?sb.channel(name,{config:{broadcast:{self:false}}}):null;
    if(ch){
      ch.on("broadcast",{event:"msg"},function(p){
        var d=p&&p.payload;
        if(!d||d._c===CID||d.d===undefined)return;
        if(listener){ try{ listener({data:d.d}) }catch(_){} }
        else{ queue.push(d.d); if(queue.length>200)queue.shift(); }
      });
      ch.subscribe(function(st){ log(name,st) });
    }
    return {
      postMessage:function(data){ safeSend(ch,{type:"broadcast",event:"msg",payload:{d:data,_c:CID}}) },
      set onmessage(fn){ listener=fn; if(queue.length){ var q=queue; queue=[]; q.forEach(function(d){ try{fn({data:d})}catch(_){} }) } },
      get onmessage(){ return listener },
      close:function(){ try{ if(ch&&sb) sb.removeChannel(ch) }catch(_){} }
    };
  }

  function isRoomKey(k){
    return k==="voxa_room_seats_"+roomId || k==="voxa_room_data_"+roomId ||
           k==="voxa_events_"+roomId || k==="voxa_calc_"+roomId ||
           k==="voxa_pk_"+roomId || k==="voxa_rpk_"+roomId;
  }

  function publish(key,val){
    if(!syncCh||!key)return;
    var k=String(key);
    if(k.indexOf("voxa_chat_")===0){
      if(!Array.isArray(val)||val.length===0)return;   // exit pe chat clear dusron ka chat na uda de
      k="voxa_chat_"+roomId;
      val=val.slice(-60);
    }else if(!isRoomKey(k)){
      return;
    }
    safeSend(syncCh,{type:"broadcast",event:"state",payload:{k:k,v:val,_c:CID}});
  }

  function pushState(){
    if(!syncCh)return;
    ["voxa_room_seats_","voxa_room_data_","voxa_events_","voxa_calc_","voxa_pk_","voxa_rpk_"].forEach(function(pre){
      var k=pre+roomId, raw=null;
      try{ raw=localStorage.getItem(k) }catch(_){}
      if(!raw)return;
      try{ safeSend(syncCh,{type:"broadcast",event:"state",payload:{k:k,v:JSON.parse(raw),_c:CID}}) }catch(_){}
    });
    try{
      var c=JSON.parse(localStorage.getItem(chatKeyLocal)||"[]");
      if(c&&c.length) safeSend(syncCh,{type:"broadcast",event:"state",payload:{k:"voxa_chat_"+roomId,v:c.slice(-60),_c:CID}});
    }catch(_){}
  }

  function presenceCount(){
    if(!syncCh)return 0;
    try{
      var st=syncCh.presenceState(), n=0;
      Object.keys(st).forEach(function(k){ n+=st[k].length });
      return n;
    }catch(_){ return 0 }
  }

  function init(rid,me,cb){
    if(ready||!sb)return false;
    ready=true; initAt=Date.now(); roomId=String(rid); onSyncCb=cb||function(){};
    me=me||{};
    selfId=String(me.id||me.uid||"guest");
    if(!me.id&&!me.uid) selfId+="_"+CID;
    chatKeyLocal="voxa_chat_"+roomId+"_"+selfId;
    syncCh=sb.channel("voxa_room_"+roomId,{config:{broadcast:{self:false},presence:{key:selfId}}});

    syncCh.on("broadcast",{event:"state"},function(p){
      var pl=p&&p.payload;
      if(!pl||pl._c===CID||!pl.k)return;
      var key=(pl.k.indexOf("voxa_chat_")===0)?chatKeyLocal:pl.k;
      var val=pl.v;
      try{
        if(key===chatKeyLocal){
          var cur=[];
          try{ cur=JSON.parse(localStorage.getItem(key)||"[]")||[] }catch(_){ cur=[] }
          if(!Array.isArray(cur))cur=[];
          (Array.isArray(val)?val:[]).forEach(function(h){ if(cur.indexOf(h)===-1)cur.push(h) });
          if(cur.length>200)cur=cur.slice(-200);
          val=cur;
        }
        localStorage.setItem(key,JSON.stringify(val));
      }catch(_){}
      try{ onSyncCb(key,val) }catch(_){}
    });

    /* naya user aaya — jo state mere paas hai wo bhej do */
    syncCh.on("broadcast",{event:"hi"},function(p){
      var pl=p&&p.payload;
      if(!pl||pl._c===CID)return;
      if(Date.now()-initAt<2500)return;
      pushState();
    });

    /* seat invite dusre device tak */
    /* seat emoji / reaction sabke screen pe */
    syncCh.on("broadcast",{event:"react"},function(p){
      var pl=p&&p.payload;
      if(!pl||pl._c===CID)return;
      try{ if(onReact) onReact(pl) }catch(_){}
    });

    syncCh.on("broadcast",{event:"invite"},function(p){
      var pl=p&&p.payload;
      if(!pl||pl._c===CID)return;
      if(String(pl.to)!==String(selfId))return;
      try{ localStorage.setItem("voxa_invite_"+roomId+"_"+pl.to,JSON.stringify(pl.invite)) }catch(_){}
    });

    syncCh.subscribe(function(status){
      log("room",status);
      if(status==="SUBSCRIBED"){
        try{ syncCh.track({id:selfId,name:me.name||"User",at:Date.now()}) }catch(_){}
        safeSend(syncCh,{type:"broadcast",event:"hi",payload:{_c:CID,at:Date.now()}});
        setTimeout(pushState,900);
      }
    });

    window.addEventListener("pagehide",function(){
      try{ if(syncCh) syncCh.untrack() }catch(_){}
    });
    return true;
  }

  var onReact=null;
  function sendReaction(o){
    if(!syncCh)return;
    safeSend(syncCh,{type:"broadcast",event:"react",payload:{id:String((o&&o.id)||""),em:(o&&o.em)||"",src:(o&&o.src)||"",_c:CID}});
  }
  function setOnReact(fn){ onReact=fn; }

  function sendInvite(to,invite){
    if(!syncCh||!to)return;
    safeSend(syncCh,{type:"broadcast",event:"invite",payload:{to:String(to),invite:invite,_c:CID}});
  }

  /* room me abhi kaun kaun online hai (presence) */
  function members(){
    if(!syncCh)return [];
    try{
      var out=[], st=syncCh.presenceState();
      Object.keys(st).forEach(function(k){
        (st[k]||[]).forEach(function(p){ out.push({id:String(p.id||k),name:p.name||"User"}) });
      });
      return out;
    }catch(_){ return [] }
  }

  return {
    broadcast:broadcast,
    init:init,
    publish:publish,
    pushState:pushState,
    presenceCount:presenceCount,
    sendInvite:sendInvite,
    members:members,
    sendReaction:sendReaction,
    onReact:setOnReact,
    get ready(){ return ready },
    get id(){ return CID }
  };
})();
</script>

/* ================= PREMIUM ICONS / GLOSSY UI ================= */
/* khaali seat: 3D glossy chair-ball + gold rim */
.avatar{
  border:0;
  background:
    radial-gradient(circle at 34% 24%,#ffffff5c,#ffffff10 34%,#00000000 52%),
    radial-gradient(circle at 50% 118%,#ffcf7a4d,#00000000 58%),
    linear-gradient(155deg,#8b5fb0,#4a2a63 52%,#251531 100%);
  box-shadow:
    inset 0 2px 5px #ffffff4d,
    inset 0 -10px 16px #00000080,
    0 5px 12px #00000066,
    0 0 0 1px #f2d79a59,
    0 0 0 3px #00000033;
}
.avatar::after{
  content:"";position:absolute;inset:4px;border-radius:50%;
  background:radial-gradient(circle at 50% 0%,#ffffff33,#ffffff00 62%);
  box-shadow:inset 0 0 0 1px #ffffff2b;pointer-events:none;
}
.avatar svg{width:24px;height:24px;color:#f3e6ff;filter:drop-shadow(0 1px 2px #000000aa);opacity:.92}
.avatar.muted svg{color:#ffb3c6}
/* bhara hua seat: gold ring + glow */
.avatar.occupied{
  border:0;
  box-shadow:
    inset 0 2px 5px #ffffff40,
    inset 0 -8px 14px #00000066,
    0 5px 12px #00000066,
    0 0 0 2px #ffd98a,
    0 0 12px #ffca6a80;
}
.seat-num{color:#efe2ff;font-weight:600;text-shadow:0 1px 2px #000000aa}
/* topbar ke chhote glass buttons */
.topbar .icon{
  width:34px;height:34px;border-radius:12px;
  background:linear-gradient(160deg,#ffffff26,#ffffff08 60%,#00000026);
  border:1px solid #ffffff30;
  box-shadow:inset 0 1px 0 #ffffff40,0 3px 8px #00000040;
  backdrop-filter:blur(6px);
}
.topbar .icon:active{transform:scale(.94)}
.topbar .icon svg{filter:drop-shadow(0 1px 2px #00000080)}
/* bottom toolbar ke premium round buttons */
.bottom .icon{
  width:42px;height:42px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 22%,#ffffff40,#ffffff08 46%,#00000000 70%),
    linear-gradient(155deg,#5b3f7d,#2a1a3d 60%,#1a1128);
  border:1px solid #f2d79a66;
  box-shadow:
    inset 0 2px 4px #ffffff33,
    inset 0 -6px 10px #00000070,
    0 4px 10px #00000066,
    0 0 10px #b388ff40;
  color:#fdf6ff;
  transition:transform .12s ease,box-shadow .2s ease;
}
.bottom .icon:active{transform:scale(.93);box-shadow:inset 0 2px 4px #ffffff33,0 0 14px #ffd98a99}
.bottom .icon svg{width:21px;height:21px;stroke-width:1.9;filter:drop-shadow(0 1px 2px #00000090)}
/* video play / select premium */
.vplay{
  border-radius:20px;color:#fff;font-size:0;
  background:
    radial-gradient(circle at 30% 20%,#ffffff59,#ffffff00 46%),
    linear-gradient(160deg,#a97bff,#6d28d9 55%,#3b1178);
  box-shadow:
    inset 0 2px 6px #ffffff66,
    inset 0 -8px 14px #2a0a5a80,
    0 8px 22px #6d28d966,
    0 0 0 1px #f2d79a80,
    0 0 0 4px #00000040;
  position:relative;
}
.vplay::after{
  content:"";width:0;height:0;margin-left:6px;
  border-left:34px solid #fff;
  border-top:22px solid transparent;
  border-bottom:22px solid transparent;
  filter:drop-shadow(0 2px 4px #000000aa);
}
.vselect{
  background:
    linear-gradient(180deg,#ffffff33,#ffffff00 42%),
    linear-gradient(160deg,#9b6bff,#6c3bff 45%,#4a1ed8);
  box-shadow:
    inset 0 1px 0 #ffffff80,
    inset 0 -4px 10px #2a0a8a66,
    0 10px 26px #7c4dff66,
    0 0 0 1px #ffffff33;
  text-shadow:0 1px 2px #2a0a5a;
  letter-spacing:.2px;
}

.app.is-video .seats .grid{gap:30px 6px;padding-top:12px}

  content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);

    radial-gradient(ellipse at 50% 2%,#ffb7bd66,#00000000 62%),

    inset 0 3px 7px #ffffff4d,

    linear-gradient(160deg,#e63a4b,#a3101f 55%,#520610);

    0 5px 12px #00000099,

function firstUserValue(...values){
  for(const value of values){
    if(value!==undefined&&value!==null&&String(value).trim()!=="")return value;
  }
  return "";
}
function userPhoto(user){
  return firstUserValue(user&&user.photo,user&&user.pic,user&&user.pp,user&&user.dp,
    user&&user.avatar,user&&user.avatarUrl,user&&user.avatar_url,user&&user.photoURL,
    user&&user.photo_url,user&&user.profile_photo,user&&user.profilePicture,user&&user.image,"");
}
function userPublicId(user){
  return firstUserValue(user&&user.uid,user&&user.publicId,user&&user.public_id,
    user&&user.voxaId,user&&user.voxa_id,user&&user.publicUID,"");
}
function getLoggedInUser(){
  const q=new URLSearchParams(location.search);
  const qUid=q.get("uid");
  if(qUid){
    let full={};
    try{full=JSON.parse(localStorage.getItem("voxa_user_"+qUid)||"null")||{}}catch(_){}
    return Object.assign({},full,{
      id:firstUserValue(full.id,qUid),
      uid:firstUserValue(userPublicId(full),qUid),
      publicId:firstUserValue(full.publicId,full.public_id,userPublicId(full),qUid),
      name:q.get("name")||full.name||full.nickname||("User "+qUid),
      pic:userPhoto(full)
    });
  }
  try{
    const u=JSON.parse(localStorage.getItem("voxa_user")||"null");
    if(u&&(u.id||userPublicId(u)))return Object.assign({},u,{uid:firstUserValue(userPublicId(u)),pic:userPhoto(u)});
  }catch(_){}
  try{
    let found=null;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k)continue;
      const lk=k.toLowerCase();
      if(!(lk.includes("user")||lk.includes("login")||lk.includes("current")||lk.includes("account")||lk.includes("profile")))continue;
      try{
        const u=JSON.parse(localStorage.getItem(k)||"null");
        if(u&&(u.id||userPublicId(u))&&(u.name||u.nickname||userPhoto(u))){
          const score=(u.loggedIn||u.current||u.isCurrent?2:0)+(lk.includes("current")||lk.includes("login")?1:0);
          if(!found||score>found.score)found={u:Object.assign({},u,{uid:firstUserValue(userPublicId(u)),pic:userPhoto(u)}),score:score};
        }
      }catch(_){}
    }
    if(found)return found.u;
  }catch(_){}
  return{id:null,uid:"",name:"Guest",pic:""};
}

})();

const ROOM_LEVELS=(()=>{
  const arr=[0];
  let need=500;
  for(let i=1;i<61;i++){arr.push(need);need+=Math.round(need*0.35)}
  return arr;
})();
function roomLevelFromDiamonds(dia){
  let lv=1;
  for(let i=1;i<61;i++){if(dia>=ROOM_LEVELS[i])lv=i+1}
  return Math.min(lv,61);
}
function roomBadge(lv){
  if(lv>=51)return"👑 Legendary";
  if(lv>=41)return"💎 Diamond";
  if(lv>=31)return"🏆 Gold";
  if(lv>=21)return"🥈 Silver";
  if(lv>=11)return"🥉 Bronze";
  return"🌱 Starter";
}
function roomFrameColor(lv){
  if(lv>=51)return"linear-gradient(90deg,#f59e0b,#ef4444)";
  if(lv>=41)return"linear-gradient(90deg,#3b82f6,#8b5cf6)";
  if(lv>=31)return"linear-gradient(90deg,#f59e0b,#fbbf24)";
  if(lv>=21)return"linear-gradient(90deg,#94a3b8,#e2e8f0)";
  if(lv>=11)return"linear-gradient(90deg,#b45309,#f59e0b)";
  return"linear-gradient(90deg,#16a34a,#22c55e)";
}
function checkRoomLevelUp(){
  const dia=roomData.diamondsSent||0;
  const newLv=roomLevelFromDiamonds(dia);
  if(newLv>(roomData.level||1)){
    roomData.level=newLv;
    roomData.achievements=roomData.achievements||[];
    roomData.achievements.push({name:roomBadge(newLv)+" — Level "+newLv});
    saveRoom();
    const r=document.createElement("div");
    r.className="msg system";
    r.textContent="🎉 Room Level Up! L"+newLv+" — "+roomBadge(newLv);
    E("chatBox").append(r);
    toast("🎉 Room Level Up! L"+newLv);
    applyRoom();
  }
}

function buildHideTabs(pageHead,pageBody){
  const tabs=pageHead.querySelector("#hideTabs");
  const sections={};
  const labels={settings:"Room Settings",members:"Members",followers:"Followers",events:"Event",achievements:"Achievements"};
  [["settings","Room Settings"],["members","Members"],["followers","Followers"],["events","Event"],["achievements","Achievements"]].forEach(([key,label])=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="hide-tab";
    b.textContent=label;
    b.onclick=()=>showTab(key);
    tabs.append(b);
    const sec=document.createElement("div");
    sec.dataset.key=key;
    sec.style.display="none";
    pageBody.append(sec);
    sections[key]=sec;
  });
  function showTab(key){
    Object.keys(sections).forEach(k=>{sections[k].style.display="none"});
    [...tabs.children].forEach(t=>t.classList.remove("active"));
    sections[key].style.display="block";
    [...tabs.children].find(t=>t.textContent===labels[key]).classList.add("active");
    if(key==="settings")renderSettingsInto(sections[key]);
    else if(key==="members")renderMembersInto(sections[key]);
    else if(key==="followers")renderFollowersInto(sections[key]);
    else if(key==="events")renderEventsHome(sections[key]);
    else renderAchievementsInto(sections[key]);
  }
  showTab("settings");
  return sections;
}

function ageFromDob(dob){
  if(!dob)return "";
  const d=new Date(dob);
  if(isNaN(d.getTime()))return "";
  const diff=Date.now()-d.getTime();
  const age=Math.floor(diff/(365.25*24*3600*1000));
  return (age>0&&age<120)?String(age):"";
}
let followerProfiles=null;
async function loadFollowerProfiles(){
  const ids=followerIds();
  if(!ids.length){followerProfiles=[];return}
  const sb=window.supabaseClient;
  if(!sb){followerProfiles=ids.map(id=>({uid:id,nickname:"User "+id}));return}
  try{
    const {data}=await sb.from("profiles").select("id,uid,nickname,name,photo,profile_photo,gender,dob,active_level,charm_level,wealth_level,game_level").in("uid",ids);
    const map={};
    (data||[]).forEach(p=>{map[String(p.uid)]=p});
    followerProfiles=ids.map(id=>map[String(id)]||{uid:id,nickname:"User "+id});
  }catch(_){
    followerProfiles=ids.map(id=>({uid:id,nickname:"User "+id}));
  }
}

      const p=document.createElement("div");p.className="rs-empty";p.textContent="Abhi koi event nahi hai. Room owner event bana sakta hai — timing, prize aur leaderboard ke saath.";

    evs.slice().reverse().forEach(ev=>{

      return;

    const rows=followerProfiles.filter(p=>{

let cropCtx={target:null,img:null,scale:1,baseScale:1,x:0,y:0,dragging:false,startX:0,startY:0,shape:"free",box:{x:48,y:48,w:224,h:224},resizing:false};
const CROP_SIZE=320;
function openCropper(dataUrl,target){
  cropCtx={target:target,img:null,scale:1,baseScale:1,x:0,y:0,dragging:false,startX:0,startY:0,shape:"free",box:{x:48,y:48,w:224,h:224},resizing:false};
  E("cropTitle").textContent=target==="event"?"Crop Event Image":"Crop Room DP";
  E("cropper").hidden=false;
  const canvas=E("cropCanvas");
  canvas.width=CROP_SIZE;
  canvas.height=CROP_SIZE;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#2a1f37";
  ctx.fillRect(0,0,CROP_SIZE,CROP_SIZE);
  const img=new Image();
  img.onload=()=>{
    cropCtx.img=img;
    const fit=Math.min(CROP_SIZE/img.naturalWidth,CROP_SIZE/img.naturalHeight);
    cropCtx.baseScale=fit;
    cropCtx.scale=fit;
    cropCtx.x=(CROP_SIZE-img.naturalWidth*fit)/2;
    cropCtx.y=(CROP_SIZE-img.naturalHeight*fit)/2;
    cropCtx.box={x:CROP_SIZE*0.15,y:CROP_SIZE*0.15,w:CROP_SIZE*0.7,h:CROP_SIZE*0.7};
    E("cropZoom").value=1;
    drawCropCanvas();
    drawCropPreview();
    toast("Image loaded — drag/zoom karke crop karo");
  };
  img.onerror=()=>{toast("Image load failed — dobara choose karo.");E("cropper").hidden=true};
  img.src=dataUrl;
}
function drawCropCanvas(){
  const canvas=E("cropCanvas");
  const ctx=canvas.getContext("2d");
  const img=cropCtx.img;
  ctx.fillStyle="#2a1f37";
  ctx.fillRect(0,0,CROP_SIZE,CROP_SIZE);
  if(!img)return;
  ctx.save();
  ctx.translate(cropCtx.x,cropCtx.y);
  ctx.scale(cropCtx.scale,cropCtx.scale);
  ctx.drawImage(img,0,0);
  ctx.restore();
  const b=cropCtx.box;
  ctx.save();
  ctx.fillStyle="#00000066";
  ctx.beginPath();
  ctx.rect(0,0,CROP_SIZE,CROP_SIZE);
  if(cropCtx.shape==="circle"){
    ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,Math.PI*2,true);
  }else{
    ctx.rect(b.x,b.y,b.w,b.h);
  }
  ctx.fill("evenodd");
  ctx.restore();
  ctx.save();
  ctx.strokeStyle="#f4d28b";
  ctx.lineWidth=2;
  ctx.setLineDash([6,4]);
  if(cropCtx.shape==="circle"){
    ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,Math.PI*2);ctx.stroke();
  }else{
    ctx.strokeRect(b.x,b.y,b.w,b.h);
  }
  ctx.restore();
  ctx.save();
  ctx.fillStyle="#f4d28b";
  ctx.beginPath();ctx.arc(b.x+b.w,b.y+b.h,10,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  drawCropPreview();
}
function drawCropPreview(){
  const canvas=E("cropCanvas");
  const pcanvas=E("cropPreviewCanvas");
  const ctx=pcanvas.getContext("2d");
  const size=pcanvas.width;
  const b=cropCtx.box;
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle="#2a1f37";ctx.fillRect(0,0,size,size);
  if(!cropCtx.img)return;
  ctx.save();
  if(cropCtx.shape==="circle"){ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip()}
  const sx=(b.x-cropCtx.x)/cropCtx.scale;
  const sy=(b.y-cropCtx.y)/cropCtx.scale;
  const sw=b.w/cropCtx.scale;
  const sh=b.h/cropCtx.scale;
  ctx.drawImage(cropCtx.img,sx,sy,sw,sh,0,0,size,size);
  ctx.restore();
}
E("cropStage").addEventListener("pointerdown",e=>{
  const rect=E("cropStage").getBoundingClientRect();
  const px=e.clientX-rect.left,py=e.clientY-rect.top;
  const b=cropCtx.box;
  if(Math.hypot(px-(b.x+b.w),py-(b.y+b.h))<20){cropCtx.resizing=true;return}
  cropCtx.dragging=true;cropCtx.startX=e.clientX-cropCtx.x;cropCtx.startY=e.clientY-cropCtx.y;
  E("cropStage").setPointerCapture(e.pointerId);
});
E("cropStage").addEventListener("pointermove",e=>{
  const rect=E("cropStage").getBoundingClientRect();
  if(cropCtx.resizing){
    const px=e.clientX-rect.left,py=e.clientY-rect.top;
    const b=cropCtx.box;
    b.w=Math.max(40,px-b.x);
    b.h=Math.max(40,py-b.y);
    drawCropCanvas();return;
  }
  if(!cropCtx.dragging)return;
  cropCtx.x=e.clientX-cropCtx.startX;
  cropCtx.y=e.clientY-cropCtx.startY;
  drawCropCanvas();
});
E("cropStage").addEventListener("pointerup",()=>{cropCtx.dragging=false;cropCtx.resizing=false});
E("cropZoom").oninput=e=>{
  const old=cropCtx.scale;
  cropCtx.scale=Number(e.target.value)*cropCtx.baseScale;
  const cx=CROP_SIZE/2,cy=CROP_SIZE/2;
  cropCtx.x=cx-(cx-cropCtx.x)*(cropCtx.scale/old);
  cropCtx.y=cy-(cy-cropCtx.y)*(cropCtx.scale/old);
  drawCropCanvas();
};
[...E("cropShapes").children].forEach(b=>{
  b.onclick=()=>{

E("cropSave").onclick=()=>{
  const b=cropCtx.box;
  const canvas=document.createElement("canvas");
  canvas.width=Math.round(b.w);
  canvas.height=Math.round(b.h);
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#2a1f37";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  if(cropCtx.shape==="circle"){ctx.beginPath();ctx.arc(canvas.width/2,canvas.height/2,canvas.width/2,0,Math.PI*2);ctx.clip()}
  const sx=(b.x-cropCtx.x)/cropCtx.scale;
  const sy=(b.y-cropCtx.y)/cropCtx.scale;
  const sw=b.w/cropCtx.scale;
  const sh=b.h/cropCtx.scale;
  ctx.drawImage(cropCtx.img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  ctx.restore();
  const out=canvas.toDataURL("image/jpeg",0.85);
  if(cropCtx.target==="event"){evDraft.image=out;const prev=E("evImgPrev");if(prev)prev.innerHTML='<img class="ev-review-img" src="'+out+'" alt="">'}
  else{roomData.dp=out;saveRoom();applyRoom()}
  E("cropper").hidden=true;
  toast(cropCtx.target==="event"?"Event image cropped & saved":"Room DP cropped & saved");
  if(cropCtx.target!=="event")openSettingsPage();
};

const peers={};
let localStream=null;
function ensureMic(){
  if(localStream)return Promise.resolve(localStream);
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
    .then(s=>{localStream=s;micOn=true;E("micBtn").classList.remove("muted");return s})
    .catch(()=>{toast("Microphone permission denied.");return null});
}
function createPeer(peerId,isInitiator){
  if(peers[peerId])return peers[peerId];
  const pc=new RTCPeerConnection({iceServers:[
    {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},
    {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
    {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
    {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
  ]});
  peers[peerId]={pc,audio:null};
  if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{if(e.candidate)voiceChannel.postMessage({type:"ice",from:MY_ID,to:peerId,candidate:e.candidate})};
  pc.ontrack=e=>{
    const stream=e.streams[0];
    if(!peers[peerId].audio){
      peers[peerId].audio=new Audio();
      peers[peerId].audio.srcObject=stream;
      peers[peerId].audio.autoplay=true;
      peers[peerId].audio.play().catch(()=>{});
    }
  };
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==="connected"){toast("🔗 Voice connected: "+peerId)}
    if(pc.connectionState==="failed"||pc.connectionState==="disconnected"){closePeer(peerId)}
  };
  if(isInitiator){
    pc.onnegotiationneeded=async()=>{
      try{
        const offer=await pc.createOffer();
        await pc.setLocalDescription(offer);
        voiceChannel.postMessage({type:"offer",from:MY_ID,to:peerId,sdp:pc.localDescription});
      }catch(_){}
    };
  }
  return peers[peerId];
}
function closePeer(peerId){
  if(peers[peerId]){
    try{peers[peerId].pc.close()}catch(_){}
    if(peers[peerId].audio){peers[peerId].audio.pause();peers[peerId].audio.srcObject=null}
    delete peers[peerId];
  }
}
voiceChannel.onmessage=async e=>{
  const m=e.data;
  if(m.to!==MY_ID&&m.to!=="*")return;
  if(m.type==="leave"){closePeer(String(m.from));return;}
  if(m.type==="offer"){
    const p=createPeer(m.from,false);
    await p.pc.setRemoteDescription(m.sdp);
    const answer=await p.pc.createAnswer();
    await p.pc.setLocalDescription(answer);
    voiceChannel.postMessage({type:"answer",from:MY_ID,to:m.from,sdp:p.pc.localDescription});
  }else if(m.type==="answer"){
    if(peers[m.from])await peers[m.from].pc.setRemoteDescription(m.sdp);
  }else if(m.type==="ice"){
    if(peers[m.from])try{await peers[m.from].pc.addIceCandidate(m.candidate)}catch(_){}
  }else if(m.type==="leave"){
    closePeer(m.from);
  }
};

/* ---- YouTube search (bina API key) — results laakar room me chalao ---- */
async function fetchJSON(url,ms){
  try{
    const ctl=new AbortController();
    const t=setTimeout(()=>ctl.abort(),ms||9000);
    const r=await fetch(url,{signal:ctl.signal,headers:{Accept:"application/json"}});
    clearTimeout(t);
    if(!r.ok)return null;
    const txt=await r.text();
    try{return JSON.parse(txt)}catch(_){return null}
  }catch(_){return null}
}
async function ytSearchVideos(q){
  const enc=encodeURIComponent(q);
  /* Piped API instances (CORS open) */
  const piped=["https://pipedapi.ducks.party","https://pipedapi.adminforge.de","https://pipedapi.leptons.xyz"];
  for(let i=0;i<piped.length;i++){
    const d=await fetchJSON(piped[i]+"/search?q="+enc+"&filter=videos",9000);
    if(d&&Array.isArray(d.items)){
      const vids=d.items.map(function(v){
        const m=String(v.url||"").match(/v=([\w-]{11})/);
        return m?{id:m[1],title:v.title||"Video",author:v.uploaderName||"",secs:v.duration||0}:null;
      }).filter(Boolean);
      if(vids.length)return vids.slice(0,12);
    }
  }
  /* Invidious fallback */
  const inv=["https://invidious.materialio.us","https://invidious.protokolla.fi"];
  for(let i=0;i<inv.length;i++){
    const d=await fetchJSON(inv[i]+"/api/v1/search?q="+enc+"&type=video",9000);
    if(Array.isArray(d)){
      const vids=d.filter(function(v){return v&&v.videoId}).map(function(v){
        return {id:v.videoId,title:v.title||"Video",author:v.author||"",secs:v.lengthSeconds||0};
      });
      if(vids.length)return vids.slice(0,12);
    }
  }
  return null;
}

function renderSeats(){
  const area=E("seatsArea");
  area.replaceChildren();
  const grid=document.createElement("div");
  grid.className="grid";
  const calcS=loadJSON(calcKey,null);
  const calcActive=calcS&&calcS.status==="active"&&Date.now()<calcS.end;
  const maxRecv=calcActive?Math.max(1,...Object.values(calcS.recv||{})):1;
  for(let i=1;i<=seatCount;i++){
    const b=document.createElement("button");
    b.type="button";
    b.className="seat"+(mode==="video"?" vseat":"");
    const occupied=seatStates[i];
    const isMine=String(mySeatNumber)===String(i);
    const isMuted=occupied&&occupied.muted;
    const isVideo=(mode==="video");
    let inner='<span class="avatar'+(occupied?" occupied":(isVideo?" locked":""))+(isMine&&!micOn?" muted":"")+'">';
    let label=String(i);
    if(occupied){
      if(occupied.pic){inner+='<img src="'+occupied.pic+'" alt="">'}
      else{inner+=(occupied.name||"U").charAt(0).toUpperCase()}
      label=shortName(occupied.name);
    }else{
      inner+=isVideo?'<svg><use href="#lock"/></svg>':'<svg><use href="#mic"/></svg>';
    }
    if(isMine&&isMuted)inner+='<span class="mute-badge"><svg><use href="#mic-off"/></svg></span>';
    inner+='</span><span class="seat-num">'+label+'</span>';
    if(calcActive&&occupied){
      const recv=(calcS.recv&&calcS.recv[occupied.id])||0;
      const pct=Math.min(100,(recv/maxRecv)*100);
      inner+='<span class="recv-line"><span class="recv-fill" style="width:'+pct+'%"></span></span>';
    }
    b.innerHTML=inner;
    b.onclick=()=>{
      if(occupied){
        if(isMine)seatMenu(i);
        else userProfilePanel(occupied,i);
      }else seatMenu(i);
    };
    grid.append(b);
  }
  area.append(grid);
  updateLiveCount();
  renderCalcBox();
}

let voxaReactionCleanup=null;

function playVoxaSeatEmoji(em){
  if(!mySeatNumber){
    toast("Pehle seat join karo.");
    return;
  }

  const seat=E("seatsArea")
    .querySelectorAll(".seat")[Number(mySeatNumber)-1];

  if(!seat){
    toast("Seat nahi mili.");
    return;
  }

  if(voxaReactionCleanup)voxaReactionCleanup();

  const avatar=seat.querySelector(".avatar")||seat;
  const oldPosition=avatar.style.position;
  const oldOverflow=avatar.style.overflow;

  avatar.style.position="relative";
  avatar.style.overflow="visible";

  const layer=document.createElement("span");

  Object.assign(layer.style,{
    position:"absolute",
    inset:"0",
    overflow:"visible",
    pointerEvents:"none",
    zIndex:"30"
  });

  layer.setAttribute("aria-hidden","true");
  avatar.appendChild(layer);

  const left=em==="😘 ⬅️";
  const right=em==="😘 ➡️";
  const kiss=left||right||em==="😘";
  const love=kiss||["❤️","😍","🥰","💋","🫂"].includes(em);
  const direction=left?-1:right?1:0;

  const emoji=document.createElement("span");
  emoji.textContent=(left||right)?"😘":em;

  Object.assign(emoji.style,{
    position:"absolute",
    inset:"-8px",
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    fontSize:"46px",
    lineHeight:"1",
    pointerEvents:"none",
    filter:"drop-shadow(0 4px 7px rgba(0,0,0,.4))"
  });

  layer.appendChild(emoji);

  const animations=[];
  const reduceMotion=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let frames;

  if(left||right){
    frames=[
      {transform:"scale(0)",opacity:0},
      {
        transform:"scale(1.2)",
        opacity:1,
        offset:.2
      },
      {
        transform:`translateX(${direction*15}px) rotate(${direction*15}deg)`,
        opacity:1,
        offset:.5
      },
      {
        transform:`translateX(${direction*30}px) scale(1.15)`,
        opacity:1,
        offset:.8
      },
      {
        transform:`translateX(${direction*45}px) scale(.5)`,
        opacity:0
      }
    ];
  }else if(love||em==="🔥"){
    frames=[
      {transform:"scale(0)",opacity:0},
      {transform:"scale(1.3)",opacity:1,offset:.15},
      {transform:"scale(.95)",opacity:1,offset:.3},
      {transform:"scale(1.25)",opacity:1,offset:.45},
      {transform:"scale(.95)",opacity:1,offset:.6},
      {transform:"scale(1.25)",opacity:1,offset:.8},
      {transform:"scale(.5) translateY(-25px)",opacity:0}
    ];
  }else{
    frames=[
      {transform:"scale(0)",opacity:0},
      {
        transform:"scale(1.25) rotate(-15deg)",
        opacity:1,
        offset:.15
      },
      {
        transform:"scale(1) rotate(15deg)",
        opacity:1,
        offset:.3
      },
      {
        transform:"scale(1.15) rotate(-15deg) translateY(-6px)",
        opacity:1,
        offset:.5
      },
      {
        transform:"scale(1) rotate(15deg)",
        opacity:1,
        offset:.7
      },
      {
        transform:"scale(1.1) rotate(0deg)",
        opacity:1,
        offset:.85
      },
      {
        transform:"scale(.5) translateY(-25px)",
        opacity:0
      }
    ];
  }

  if(!reduceMotion){
    animations.push(emoji.animate(frames,{
      duration:3500,
      easing:"ease-in-out",
      fill:"forwards"
    }));

    // Love/kiss ke saath chhote flying hearts
    if(love){
      for(let i=0;i<4;i++){
        const heart=document.createElement("span");
        heart.textContent="💕";

        Object.assign(heart.style,{
          position:"absolute",
          left:"50%",
          top:"40%",
          fontSize:"20px",
          lineHeight:"1",
          opacity:"0",
          pointerEvents:"none"
        });

        layer.appendChild(heart);

        const x=direction
          ?direction*(20+i*9)
          :(i-1.5)*20;

        animations.push(heart.animate([
          {
            transform:"translate(-50%,-50%) scale(.3)",
            opacity:0
          },
          {
            transform:`translate(calc(-50% + ${x*.4}px),-25px) scale(1)`,
            opacity:1,
            offset:.35
          },
          {
            transform:`translate(calc(-50% + ${x}px),-60px) scale(.5)`,
            opacity:0
          }
        ],{
          duration:1700,
          delay:300+i*300,
          easing:"ease-out",
          fill:"both"
        }));
      }
    }
  }

  const timer=setTimeout(cleanup,3500);

  function cleanup(){
    clearTimeout(timer);
    animations.forEach(animation=>animation.cancel());
    layer.remove();

    avatar.style.position=oldPosition;
    avatar.style.overflow=oldOverflow;

    if(voxaReactionCleanup===cleanup){

let musicAudio=null,mpRepeat=false,mpShuffle=false;

const musicKey="voxa_music_"+roomID;
function musicSave(){
  try{
    const list=myPlaylist.filter(function(t){return t&&t.url&&t.url.indexOf("blob:")!==0}).slice(0,50);
    localStorage.setItem(musicKey,JSON.stringify(list));
  }catch(_){}
}
function musicLoad(){
  try{
    const a=JSON.parse(localStorage.getItem(musicKey)||"[]");
    if(Array.isArray(a))myPlaylist=a.filter(function(t){return t&&t.url}).map(function(t){return {name:t.name||"Song",url:t.url}});
  }catch(_){}
}
musicLoad();
function fmtTime(sec){sec=Math.max(0,Number(sec)||0);const m=Math.floor(sec/60),ss=String(Math.floor(sec%60)).padStart(2,"0");return m+":"+ss}
function musicSend(){
  try{
    if(applyingRemoteMode)return;
    if(currentTrackIdx<0||!myPlaylist[currentTrackIdx])return;
    const t=myPlaylist[currentTrackIdx];
    if(!t.url||t.url.indexOf("blob:")===0)return;
    modeChannel.postMessage({t:"music",url:t.url,name:t.name,playing:!!(musicAudio&&!musicAudio.paused),pos:musicAudio?Number(musicAudio.currentTime)||0:0,at:Date.now()});
  }catch(_){}
}
let remoteAudio=null;
function musicApplyRemote(d){
  if(!d||!d.url)return;
  if(mode==="video")return;
  try{
    if(!remoteAudio){remoteAudio=new Audio();remoteAudio.volume=0.85}
    const same=(remoteAudio.getAttribute("src")||"")===d.url;
    if(!same){
      remoteAudio.src=d.url;
      const pos=Number(d.pos)||0;
      if(pos>0)remoteAudio.currentTime=pos;
      if(d.playing)remoteAudio.play().catch(function(){});
      toast("🎵 Room music: "+(d.name||"Song"));
    }else{
      if(d.playing){ if(remoteAudio.paused)remoteAudio.play().catch(function(){}) }
      else if(!remoteAudio.paused){ remoteAudio.pause() }
      const pos=Number(d.pos)||0;
      if(pos&&Math.abs((remoteAudio.currentTime||0)-pos)>3)remoteAudio.currentTime=pos;
    }
    const mh=E("hostMusic");
    if(mh){mh.textContent="🎵 "+(d.name||"Song")+(d.playing?"":" (paused)")}
  }catch(_){}
}
function stopRemoteMusic(){try{if(remoteAudio){remoteAudio.pause();remoteAudio.removeAttribute("src")}}catch(_){}}
function addMusicFiles(files){
  let n=0;
  Array.prototype.slice.call(files||[]).forEach(function(f){
    if(!f||String(f.type||"").indexOf("audio/")!==0)return;
    myPlaylist.push({name:String(f.name||"Song").replace(/\.[^.]+$/,""),url:URL.createObjectURL(f),local:true});
    n++;
  });
  if(n)toast(n+" song add ho gaya");
  musicSave();
  return n;
}
function addMusicUrl(url,name){
  url=String(url||"").trim();
  if(!/^https?:\/\//i.test(url)){toast("Sahi link daalo (https://...mp3)");return false}
  myPlaylist.push({name:name||url.split("/").pop().slice(0,40)||"Song",url:url});
  musicSave();toast("Song add ho gaya");return true;
}
function removeTrack(i){
  if(i<0||i>=myPlaylist.length)return;

function calcRecordGift(receiverId,buyValue){
  const s=loadJSON(calcKey,null);
  if(!s||s.status!=="active"||Date.now()>=s.end)return;
  const txId=receiverId+"_"+buyValue+"_"+Date.now();
  if(s.txs[txId])return;
  s.txs[txId]=true;
  s.recv[receiverId]=(s.recv[receiverId]||0)+buyValue;
  s.send[receiverId]=(s.send[receiverId]||0)+buyValue;
  saveJSON(calcKey,s);
  calcChannel.postMessage({type:"calc_update",session:s});
  renderCalcBox();
  renderSeats();
}

function renderCalcBoard(){

  if(warn)warn.hidden=!(left<=60000&&left>0);

  const v=String(userPublicId(u)||u.uid||u.publicId||u.id||"").trim();
  if(!v)return "—";
  return /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(v)?v.replace(/-/g,"").slice(-6):v.replace(/[<>]/g,"").slice(0,20);
}
function seatElByUser(uid){
  const seats=E("seatsArea").querySelectorAll(".seat");
  const keys=Object.keys(seatStates||{});
  for(const k of keys){
    if(String(seatStates[k].id)===String(uid))return seats[Number(k)-1]||null;
  }
  return null;
}
function seatFxByUser(uid,em,src){
  const seat=seatElByUser(uid);
  if(!seat)return false;
  const avatar=seat.querySelector(".avatar")||seat;
  avatar.style.position="relative";
  avatar.style.overflow="visible";
  const old=avatar.querySelector(".voxa-seat-fx");
  if(old)old.remove();
  const fx=document.createElement(src?"img":"span");
  if(src){fx.src=src;fx.alt="";}
  else{fx.textContent=em||"✨";}
  fx.className="voxa-seat-fx";
  fx.style.cssText="position:absolute;left:50%;top:-10px;transform:translate(-50%,-50%) scale(.4);width:58px;height:58px;object-fit:contain;pointer-events:none;z-index:40;opacity:0;transition:transform .25s ease,opacity .25s ease;font-size:40px;line-height:1;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))";
  avatar.appendChild(fx);
  requestAnimationFrame(()=>{
    fx.style.opacity="1";
    fx.style.transform="translate(-50%,-50%) scale(1.15)";
  });
  setTimeout(()=>{
    fx.style.opacity="0";
    fx.style.transform="translate(-50%,-85%) scale(.9)";
  },2600);
  setTimeout(()=>fx.remove(),3400);
  return true;
}
function sendSeatFx(em,src){
  if(!mySeatNumber){toast("Pehle seat join karo — phir emoji bhejna.");return}
  seatFxByUser(MY_ID,em,src);
  try{if(window.VOXA_RT)VOXA_RT.sendReaction({id:MY_ID,em:em||"",src:src||""})}catch(_){}
}
function applyRoomEmoji(imageSource){
  if(!mySeatNumber){toast("Pehle seat join karo — phir reaction bhejo.");return}
  sendSeatFx("",imageSource);
  const rp=document.getElementById("reactionPanel");
  if(rp)rp.classList.remove("open");
}

function clearRoomEmoji(){
  document.querySelectorAll(".voxa-seat-fx").forEach(function(el){el.remove()});
  const rp=document.getElementById("reactionPanel");
  if(rp)rp.classList.remove("open");
}
</script>

    history.back();
  }else{

  }
});
