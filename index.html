<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxaChat Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { background:#1e293b; padding:32px; border-radius:16px; text-align:center; }
    button { background:#4285f4; color:#fff; border:none; padding:14px 28px; border-radius:8px; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>VoxaChat</h1>
    <p>Google से login करो</p>
    <button id="googleBtn">Sign in with Google</button>
    <p id="status"></p>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://mblcbygpqbogmtzacbtz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibGNieWdwcWJvZ210emFjYnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDg0OTIsImV4cCI6MjEwODE4NDQ5Mn0.7OpmnIoZKgGLTCj2gPZtNiZyXkgYPgrdyocbCkG6-Cg'
    );

    document.getElementById('googleBtn').addEventListener('click', async () => {
      document.getElementById('status').innerText = 'Google खुल रहा है...';
      try {
        const { error } = await supabase.auth.signInWithOAuth({ provider: 'google' });
        if (error) {
          document.getElementById('status').innerText = 'Error: ' + error.message;
          alert('Login error: ' + error.message);
        }
      } catch (e) {
        alert('JS error: ' + e.message);
      }
    });
  </script>
</body>
</html>
