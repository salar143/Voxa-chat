<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f8f8ff;color:#292432;
  font-family:Arial,sans-serif
}
button,input{font:inherit}
button{
  cursor:pointer;border:0;border-radius:10px;
  padding:10px 12px;background:#8548db;color:white
}
button:disabled{opacity:.5;cursor:default}
header{
  position:sticky;top:0;background:#f8f8ff;
  padding:16px 12px;z-index:2
}
.top{display:flex;gap:10px;align-items:center}
.tab{
  background:none;color:#292432;padding:10px 2px;
  font-size:17px;border-radius:0
}
.active{border-bottom:4px solid #8548db;font-weight:bold}
#search{
  margin-left:auto;min-width:55px;width:110px;
  border:0;background:white;border-radius:20px;padding:10px
}
.alt,.close{background:#e6e1ee;color:#55476a}
#requests{
  background:white;color:#33253e;
  font-size:21px;padding:8px
}
#badge{
  background:#e85676;color:white;font-size:11px;
  border-radius:20px;padding:2px 4px
}
.small{font-size:12px;color:#888;margin-top:6px}
.status{font-size:12px;color:#a34545;overflow-wrap:anywhere}
main{max-width:650px;margin:auto;padding:12px 15px 100px}
h3{font-size:16px}
.card{
  display:flex;align-items:center;gap:12px;
  background:#efeff8;border-radius:17px;
  margin-bottom:12px;padding:17px;width:100%;
  color:inherit;text-align:left
}
.avatar{
  height:43px;width:43px;border-radius:50%;
  background:#e1d5f9;color:#8041c3;
  display:grid;place-items:center;
  font-size:22px;flex-shrink:0
}
.info{flex:1;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.muted{text-align:center;padding:22px;color:#888}
nav{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:white;border-top:1px solid #eee;
  padding:13px 0 max(13px,env(safe-area-inset-bottom));
  z-index:3
}
nav a{
  flex:1;text-align:center;text-decoration:none;
  font-size:12px;color:#999
}
nav span{display:block;font-size:22px;margin-bottom:4px}
nav .selected{color:#8548db}
dialog{
  width:min(96vw,540px);border:0;border-radius:20px;
  padding:16px;box-shadow:0 15px 80px #0003
}
dialog::backdrop{background:#0005}
.modalTop{display:flex;align-items:center;gap:10px}
.modalTop h3{flex:1;overflow-wrap:anywhere}
#messages{
  height:45vh;overflow:auto;display:flex;
  flex-direction:column;gap:10px;padding:12px 0
}
.bubble{
  align-self:flex-start;max-width:84%;padding:11px;
  border-radius:13px;background:#ece6f5;
  white-space:pre-wrap;overflow-wrap:anywhere
}
.mine{align-self:flex-end;background:#8548db;color:white}
.bubble img{
  display:block;max-width:240px;width:100%;
  max-height:270px;object-fit:contain;border-radius:9px
}
.caption{margin-top:8px}
#sendForm{display:flex;gap:7px;margin-top:10px}
#message{
  min-width:0;flex:1;border:1px solid #ddd;
  border-radius:12px;padding:10px
}
#photoButton{font-size:24px;padding:5px 12px}
#attachment{
  position:relative;background:#eee7f7;
  border-radius:12px;padding:10px;margin-top:10px
}
#attachment img{
  max-width:100%;max-height:120px;
  display:block;border-radius:8px
}
#removePhoto{position:absolute;right:8px;top:8px}
#callModal{text-align:center}
#callModal .actions{justify-content:center}
</style>
</head>
<body>

<header>
  <div class="top">
    <button class="tab active" id="chatsTab">Chats</button>
    <button class="tab" id="contactsTab">Contacts</button>

    <input
      id="search"
      type="search"
      placeholder="⌕ User ID"
      aria-label="Search user ID"
    >

    <button id="requests" aria-label="Friend requests">
      ♙+<span id="badge" hidden></span>
    </button>
  </div>

  <p class="small" id="myId">Loading…</p>
  <div id="status" class="status" role="status"></div>
</header>

<main>
  <section id="searchSection" hidden>
    <h3>Search result</h3>
    <div id="results"></div>
  </section>

  <section id="chats">
    <h3>Online users</h3>
    <div id="online"></div>
  </section>

  <section id="contacts" hidden></section>
</main>

<nav>
  <a href="index.html"><span>⌂</span>Home</a>
  <a href="party.html"><span>🎉</span>Party</a>
  <a href="inbox.html" class="selected"><span>💬</span>Chat</a>
  <a href="profile2.html"><span>👤</span>Profile</a>
</nav>

<dialog id="listModal">
  <div class="modalTop">
    <h3 id="listTitle"></h3>
    <button class="close" data-close="listModal">✕</button>
  </div>
  <div id="listBody"></div>
</dialog>

<dialog id="chatModal">
  <div class="modalTop">
    <h3 id="chatTitle"></h3>
    <button id="callButton" aria-label="Voice call">📞</button>
    <button class="close" data-close="chatModal">✕</button>
  </div>

  <div id="messages"></div>

  <div id="attachment" hidden>
    <img id="previewImage" alt="Selected photo">
    <button
      id="removePhoto"
      class="close"
      type="button"
      aria-label="Remove selected photo"
    >✕</button>
  </div>

  <form id="sendForm">
    <button
      type="button"
      id="photoButton"
      class="alt"
      aria-label="Attach photo"
    >+</button>

    <input
      id="message"
      placeholder="Message or caption…"
      maxlength="2000"
    >

    <button id="sendButton" type="submit">Send</button>
  </form>

  <div id="chatNote" class="status" role="status"></div>
</dialog>

<input
  type="file"
  id="file"
  accept="image/jpeg,image/png,image/webp"
  hidden
>

<dialog id="callModal">
  <h3 id="callName">Voice call</h3>
  <p id="callState"></p>

  <div class="actions">
    <button id="acceptCall">Accept</button>
    <button id="muteCall" class="alt">Mute</button>
    <button id="endCall">End call</button>
  </div>
</dialog>

<audio id="remoteAudio" autoplay playsinline></audio>
<script>
// Apne login wale Supabase project ki details bharo.
const SUPABASE_URL = 'PASTE_SUPABASE_PROJECT_URL';
const SUPABASE_KEY = 'PASTE_SUPABASE_PUBLISHABLE_KEY';

const $ = id => document.getElementById(id);

let sb;
let me;
let peer = null;
let tab = 'chats';
let selectedPhoto = null;
let previewURL = null;
let sending = false;

const photoCache = new Map();

function report(error) {
  const text = error?.message || String(error || '');
  $('status').textContent = text;
  $('chatNote').textContent = text;
}

function check(result) {
  if (result.error) throw result.error;
  return result.data;
}

async function run(fn) {
  try {
    report('');
    await fn();
  } catch (error) {
    report(error);
  }
}

function empty(box, text) {
  const p = document.createElement('p');
  p.className = 'muted';
  p.textContent = text;
  box.replaceChildren(p);
}

function button(text, fn, alt = false) {
  const b = document.createElement('button');
  b.textContent = text;
  if (alt) b.className = 'alt';

  b.onclick = async () => {
    b.disabled = true;
    await run(fn);
    if (b.isConnected) b.disabled = false;
  };

  return b;
}

function card(person, online = false) {
  const row = document.createElement('div');
  row.className = 'card';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = Array.from(person.name || 'U')[0].toUpperCase();

  const info = document.createElement('div');
  info.className = 'info';

  const name = document.createElement('div');
  name.textContent = person.name;

  const sub = document.createElement('div');
  sub.className = 'small';
  sub.textContent =
    (online ? '🟢 Online · ' : '') +
    'ID: ' + person.user_number;

  const actions = document.createElement('div');
  actions.className = 'actions';

  info.append(name, sub, actions);
  row.append(avatar, info);

  return { row, actions };
}

async function people(ids) {
  ids = [...new Set(ids)];
  if (!ids.length) return [];

  return check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .in('id', ids)
  );
}

async function heartbeat() {
  check(
    await sb.from('vc_people')
      .update({ last_seen: new Date().toISOString() })
      .eq('id', me.id)
  );
}

async function loadOnline() {
  const rows = check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .neq('id', me.id)
      .gte('last_seen', new Date(Date.now() - 90000).toISOString())
      .order('last_seen', { ascending: false })
      .limit(100)
  );

  $('online').replaceChildren();

  if (!rows.length) {
    empty($('online'), 'Abhi koi doosra user online nahi hai.');
    return;
  }

  for (const person of rows) {
    const c = card(person, true);
    c.actions.append(button('Chat', () => openChat(person)));
    $('online').append(c.row);
  }
}

async function loadBadge() {
  const result = await sb.from('vc_requests')
    .select('id', { count: 'exact', head: true })
    .eq('receiver_id', me.id)
    .eq('status', 'pending');

  check(result);

  $('badge').textContent = result.count || 0;
  $('badge').hidden = !result.count;
}

async function searchUser() {
  const q = $('search').value.trim();
  const box = $('results');

  $('searchSection').hidden = !q;
  box.replaceChildren();

  if (!q) return;

  if (!/^\d{1,15}$/.test(q)) {
    empty(box, 'Poora numeric User ID enter karo.');
    return;
  }

  const person = check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .eq('user_number', q)
      .maybeSingle()
  );

  if (!person) {
    empty(box, 'Koi user nahi mila.');
    return;
  }

  if (person.id === me.id) {
    empty(box, 'Ye aapki apni ID hai.');
    return;
  }

  const c = card(person);
  c.actions.append(button('Chat', () => openChat(person)));

  c.actions.append(
    button('Add Friend', async () => {
      check(
        await sb.from('vc_requests').insert({
          sender_id: me.id,
          receiver_id: person.id
        })
      );

      await searchUser();
    })
  );

  box.replaceChildren(c.row);
}

function showList(title) {
  $('listTitle').textContent = title;
  empty($('listBody'), 'Loading…');

  if (!$('listModal').open) {
    $('listModal').showModal();
  }
}

async function showRequests() {
  showList('Friend Requests');

  const rows = check(
    await sb.from('vc_requests')
      .select('*')
      .eq('receiver_id', me.id)
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
  );

  const map = new Map(
    (await people(rows.map(r => r.sender_id)))
      .map(p => [p.id, p])
  );

  const box = $('listBody');
  box.replaceChildren();

  if (!rows.length) {
    empty(box, 'Abhi koi friend request nahi hai.');
    return;
  }

  for (const request of rows) {
    const person = map.get(request.sender_id);
    if (!person) continue;

    const c = card(person);

    const answer = async status => {
      check(
        await sb.from('vc_requests')
          .update({ status })
          .eq('id', request.id)
          .eq('status', 'pending')
      );

      await showRequests();
      await loadBadge();
    };

    c.actions.append(
      button('Accept', () => answer('accepted')),
      button('Reject', () => answer('rejected'), true)
    );

    box.append(c.row);
  }
}

async function showCategory(name) {
  showList(name);

  if (name === 'Family' || name === 'Family group') {
    empty($('listBody'), name + ' abhi available nahi hai.');
    return;
  }

  const followers = name === 'Followers';

  const rows = check(
    await sb.from('vc_follows')
      .select(followers ? 'follower_id' : 'following_id')
      .eq(followers ? 'following_id' : 'follower_id', me.id)
  );

  const ids = rows.map(r =>
    followers ? r.follower_id : r.following_id
  );

  const peopleRows = await people(ids);
  const box = $('listBody');
  box.replaceChildren();

  if (!peopleRows.length) {
    empty(box, 'Abhi list khaali hai.');
    return;
  }

  for (const person of peopleRows) {
    const c = card(person);
    c.actions.append(button('Chat', () => openChat(person)));
    box.append(c.row);
  }
}

for (const [icon, name] of [
  ['👥', 'Friends'],
  ['👤', 'Followers'],
  ['⭐', 'Following']
]) {
  const b = document.createElement('button');
  b.className = 'card';
  b.textContent = icon + '　' + name + '　›';
  b.onclick = () => run(() => showCategory(name));
  $('contacts').append(b);
}

function switchTab(value) {
  tab = value;

  $('chats').hidden = value !== 'chats';
  $('contacts').hidden = value !== 'contacts';

  $('chatsTab').classList.toggle('active', value === 'chats');
  $('contactsTab').classList.toggle('active', value === 'contacts');
}

function clearPhoto() {
  if (previewURL) URL.revokeObjectURL(previewURL);

  previewURL = null;
  selectedPhoto = null;

  $('file').value = '';
  $('previewImage').removeAttribute('src');
  $('attachment').hidden = true;
}

async function openChat(person) {
  if (sending) return;

  clearPhoto();
  $('message').value = '';

  peer = person;

  $('chatTitle').textContent =
    person.name + ' · ID ' + person.user_number;

  $('messages').replaceChildren();

  if ($('listModal').open) $('listModal').close();

  if (!$('chatModal').open) $('chatModal').showModal();

  await loadMessages();
}

async function photoURL(path) {
  const old = photoCache.get(path);

  if (old && old.expiry > Date.now()) return old.url;

  const data = check(
    await sb.storage.from('vc-chat-images')
      .createSignedUrl(path, 3600)
  );

  photoCache.set(path, {
    url: data.signedUrl,
    expiry: Date.now() + 3300000
  });

  return data.signedUrl;
}

async function loadMessages() {
  if (!peer || !$('chatModal').open) return;

  const target = peer.id;

  const rows = check(
    await sb.from('vc_messages')
      .select('id,sender_id,content,image_path,created_at')
      .or(
        `and(sender_id.eq.${me.id},receiver_id.eq.${target}),` +
        `and(sender_id.eq.${target},receiver_id.eq.${me.id})`
      )
      .order('created_at', { ascending: true })
      .limit(100)
  );

  const box = $('messages');
  box.replaceChildren();

  if (!rows.length) {
    empty(box, 'Pehla message ya photo bhejo.');
    return;
  }

  for (const message of rows) {
    const bubble = document.createElement('div');
    bubble.className =
      'bubble' + (message.sender_id === me.id ? ' mine' : '');

    if (message.image_path) {
      try {
        const url = await photoURL(message.image_path);

        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Chat photo';

        bubble.append(img);
      } catch (error) {
        bubble.textContent = 'Photo load nahi hui.';
      }

      if (message.content !== '[Photo]') {
        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.textContent = message.content;
        bubble.append(caption);
      }
    } else {
      bubble.textContent = message.content;
    }

    box.append(bubble);
  }

  box.scrollTop = box.scrollHeight;
}

$('sendForm').onsubmit = async event => {
  event.preventDefault();

  const target = peer;
  const text = $('message').value.trim();
  const file = selectedPhoto;

  if (!target || sending || (!text && !file)) return;

  sending = true;
  $('sendButton').disabled = true;

  let path = null;

  try {
    if (file) {
      const extension = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp'
      }[file.type];

      path =
        me.id + '/' + target.id + '/' +
        crypto.randomUUID() + '.' + extension;

      check(
        await sb.storage.from('vc-chat-images')
          .upload(path, file, {
            contentType: file.type,
            upsert: false
          })
      );
    }

    check(
      await sb.from('vc_messages').insert({
        sender_id: me.id,
        receiver_id: target.id,
        content: text || '[Photo]',
        image_path: path
      })
    );

    clearPhoto();
    $('message').value = '';
    await loadMessages();

  } catch (error) {
    report(error);
  } finally {
    sending = false;
    $('sendButton').disabled = false;
  }
};

$('photoButton').onclick = () => $('file').click();

$('file').onchange = () => {
  const file = $('file').files[0];
  if (!file) return;

  selectedPhoto = file;
  previewURL = URL.createObjectURL(file);

  $('previewImage').src = previewURL;
  $('attachment').hidden = false;
};

$('removePhoto').onclick = clearPhoto;

$('chatsTab').onclick = () => switchTab('chats');
$('contactsTab').onclick = () => switchTab('contacts');

$('requests').onclick = () => run(showRequests);

$('search').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => run(searchUser), 400);
};

document.querySelectorAll('[data-close]').forEach(button => {
  button.onclick = () => {
    const id = button.dataset.close;
    $(id).close();

    if (id === 'chatModal') {
      peer = null;
      clearPhoto();
    }
  };
});

$('acceptCall').onclick = () => {
  $('callState').textContent = 'Call connected (basic mode).';
};

$('muteCall').onclick = () => {
  $('callState').textContent = 'Muted.';
};

$('endCall').onclick = () => {
  $('callState').textContent = 'Call ended.';
  $('callModal').close();
};

async function start() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data } = await sb.auth.getSession();
  const user = data.session?.user;

  if (!user) {
    $('myId').textContent = 'Pehle login karo.';
    return;
  }

  me = user;

  const profile = check(
    await sb.from('vc_people')
      .select('id,name,user_number')
      .eq('id', me.id)
      .maybeSingle()
  );

  if (profile) {
    $('myId').textContent =
      'My ID: ' + profile.user_number;
  }

  await heartbeat();
  await loadOnline();
  await loadBadge();

  setInterval(() => run(heartbeat), 30000);
  setInterval(() => run(loadOnline), 30000);

  const channel = sb
    .channel('inbox-realtime')
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'vc_messages'
      },
      () => {
        run(loadOnline);
        if (peer) run(loadMessages);
      }
    )
    .subscribe();
}

start();
</script>

</body>
</html>
